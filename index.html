<style>

:root[data-theme="dark"]{
  --bg:#11151d;--paper:#181e29;--ink:#e6eaf2;--muted:#9aa4b6;--line:#2c3545;

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);

.blank{display:inline-block;min-width:2.2em;text-align:center;border-bottom:1.5px solid var(--indigo);color:var(--indigo);font-family:var(--font-mono);font-size:13px;padding:0 3px;margin:0 2px;line-height:1.4}

.item{border-top:1px dashed var(--line);padding:12px 0}

.item-text{margin:0 0 8px}
.lab{font-family:var(--font-mono);font-weight:500;color:var(--indigo);margin-right:6px}

.chip.num-only{min-width:38px;text-align:center;padding:5px 0}
.chip:hover{border-color:var(--indigo)}
.chip.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.chip.wrong{background:var(--ng-soft);border-color:var(--ng);color:var(--ng);text-decoration:line-through}
.chip[disabled]{cursor:default}

.ex .verdict{font-weight:700;font-size:14px}
.ex .verdict.ng{color:var(--ng)}
.ex .verdict.ok{color:var(--ok)}
.ex p{margin:4px 0 0}
.ex .sv{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;margin-top:6px}
.ex .sv .m{font-weight:700}
.ex .sv .m.o{color:var(--ok)}
.ex .sv .m.x{color:var(--ng)}
.ref{display:inline-block;margin-top:6px;font-family:var(--font-mono);font-size:12px;color:var(--muted);background:var(--bg);border-radius:4px;padding:0 6px}
.ref{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:none;padding:0;margin-top:8px}
.ref a.pg{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:2px 12px;border:1.5px solid var(--indigo);border-radius:8px;background:var(--paper);color:var(--indigo);font-size:13px;font-weight:600;text-decoration:none}
.ref a.pg::before{content:"📖"}
.ref a.pg:hover,.ref a.pg:active{background:var(--indigo-soft)}
.ref .pnote{font-size:12px;color:var(--muted);margin-left:-2px}
.tf-key{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.sec{position:relative}
.stem-wrap{position:sticky;top:var(--barH,64px);z-index:3;background:var(--paper);margin:0 -6px;padding:6px 6px 2px;max-height:50vh;overflow-y:auto;border-bottom:1px solid var(--line);box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
.stem-wrap .stem{margin-top:2px}
@media (max-width:560px){.stem-wrap .stem{font-size:14px;line-height:1.6;padding:8px 10px;margin-bottom:6px}.stem-wrap .words{font-size:12.5px;gap:0 10px;line-height:1.6}}
.save-note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.btn.back{background:var(--mark);border-color:var(--mark);color:#ffffff;font-weight:700}
.sets{display:flex;align-items:center;gap:6px;width:100%;flex-wrap:wrap}
.set-tab{font:inherit;font-size:13.5px;font-weight:700;border:1.5px solid var(--indigo);background:var(--paper);color:var(--indigo);border-radius:999px;padding:3px 14px;cursor:pointer;white-space:nowrap}
.set-tab .st{font-family:var(--font-mono);font-weight:500;font-size:12.5px;margin-left:6px;opacity:.85}
.set-tab[aria-selected="true"]{background:var(--indigo);color:var(--paper)}
.set-tab:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.avg{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.avg b{font-family:var(--font-mono);font-size:17px;color:var(--mark);font-variant-numeric:tabular-nums;margin:0 1px}
.sec-label{font-family:var(--font-mono);color:var(--indigo);font-weight:500;margin:6px 0 2px}
.result .sets-tbl{margin:4px 0 18px}
.result .sets-tbl tr.cur th{color:var(--indigo)}
.result .sets-tbl tr.avg-row th,.result .sets-tbl tr.avg-row td{border-top:2px solid var(--ink);font-weight:700}
.result h3{font-size:15px;margin:14px 0 4px}
.stem-wrap{max-height:none!important;overflow:visible!important}
.stem-wrap .stem{max-height:30vh;overflow-y:auto;overscroll-behavior:contain}
@media (max-width:560px){.set-tab{padding:2px 10px;font-size:13px}.set-tab .st{margin-left:4px}.avg b{font-size:15px}}
.reveal-note{margin:16px 0 0;padding:8px 12px;border:1px solid var(--mark);border-radius:8px;color:var(--ink);font-size:13.5px;background:var(--paper)}
.score .pt-big{font-size:17px;color:var(--indigo);font-weight:700}
.result{background:var(--paper);border:2px solid var(--indigo);border-radius:12px;padding:20px 20px 14px;margin-top:28px}
.result h2{font-family:var(--font-display);font-size:22px;margin:0 0 4px}
.result .big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.result .big b{font-family:var(--font-mono);font-size:56px;line-height:1.1;color:var(--indigo);font-variant-numeric:tabular-nums}
.result .big span{font-size:18px;font-weight:700}
.result .rmeta{margin:4px 0 12px;font-size:13.5px;color:var(--muted)}
.result .tbl{overflow-x:auto}
.result table{width:100%;border-collapse:collapse;font-size:14px}
.result th,.result td{border-top:1px solid var(--line);padding:6px 8px;text-align:left}
.result th a{color:var(--indigo);font-family:var(--font-display);text-decoration:none}
.result td.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.result td.topic{color:var(--muted)}
.result .full{color:var(--ok);font-weight:700}
.result th{white-space:nowrap}
@media (max-width:560px){.score .sc-sub{display:none}.result td.topic{display:none}.result .big b{font-size:46px}}
footer{margin-top:32px;font-size:12.5px;color:var(--muted)}
@media (max-width:560px){h1{font-size:25px}section.q{padding:16px 14px 6px;scroll-margin-top:96px}.bar{padding-top:6px;padding-bottom:6px}.bar-in{gap:6px}.nav{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;-webkit-overflow-scrolling:touch}.nav a{flex:none}.tools{width:100%;flex-wrap:nowrap;gap:6px}.score{white-space:nowrap}.btn{padding:3px 8px;white-space:nowrap}}
@media (prefers-reduced-motion:no-preference){.ex{animation:fade .2s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="lede">選択肢をタップすると正誤と解説が出ます。解説は『繊維製品の基礎知識 第1部 繊維に関する一般知識』（新訂4版）の記述にもとづき、根拠ページを添えています。</p>
    <p class="save-note" id="saveNote"></p>
    <div class="points" id="points"></div>
  </header>
</div>
<div class="bar"><div class="bar-in">
  <div class="sets" id="sets" role="tablist" aria-label="問題集を選ぶ"></div>
  <nav class="nav" id="nav" aria-label="問題へ移動"></nav>
  <div class="tools">
    <span class="score" id="score"></span>
    <button class="btn primary" id="revealAll" type="button">解答をすべて表示</button>
    <button class="btn" id="reset" type="button">リセット</button>
  </div>
</div></div>
<div class="wrap">
  <p class="reveal-note" id="revealNote" hidden>解答を一時的に表示しています。得点・解答数は変わりません。「元に戻す」で元の画面に戻ります。</p>
  <main id="main"></main>
  <section class="result" id="result" aria-live="polite"></section>
  <footer>ページ番号は『繊維製品の基礎知識 第1部』本文の印刷ページです。正答は配布された解答表と照合済みです。</footer>
</div>

<script>
const TF = ['①②とも正しい','①正 ②誤','①誤 ②正','①②とも誤り'];
const Q1 = [
{id:'q1',t:'問1',topic:'羊毛の構造・高分子・繊維の改質',type:'shared',sections:[
 {roman:'I',stem:'羊毛は、表皮部分に[A]があり、主要部のケラチンの構成アミノ酸の違い等により、[B]がクリンプの外側に[C]が内側となるバイラテラル構造となっている。',
  words:['スケール','セルロース','パラコルテックス','ベータテックス','メタコルテックス','オルソコルテックス'],
  items:[
  {k:'A',a:1,w:'羊毛の表面はうろこ状の表皮（スケール）、内部は皮質部（コルテックス）でできている。スケールは問3Bのフェルト化の原因でもある。',r:'p.11–12'},
  {k:'B',a:6,w:'皮質部はケラチンのアミノ酸組成の違いでオルソコルテックスとパラコルテックスの2層に分かれ、オルソが外側、パラが内側になって生来のクリンプ（捲縮）を作る。覚え方は「オルソ＝ソト（外）」。',r:'p.12'},
  {k:'C',a:3,w:'内側はパラコルテックス。ベータテックス、メタコルテックスという用語はなく、ひっかけの選択肢。',r:'p.12'}]},
 {roman:'II',stem:'合成繊維の原材料であるポリマーは、一般に分子量が[D]程度以上の化合物であり、基本となる化合物が鎖状に連なった構造をしている。ナイロン66はヘキサメチレンジアミンとアジピン酸を[E]により重合したものであり、ポリアクリロニトリルはアクリロニトリルを[F]により重合したものである。',
  words:['1,000','10,000','100,000','重縮合','付加重合','開環重合','解重合'],
  items:[
  {k:'D',a:2,w:'厳密な境界はないが、一般に分子量10,000以上の化合物を高分子（ポリマー）という。このあたりから溶解性・溶液粘度・機械的性質に高分子特有の性質が現れる。',r:'p.4'},
  {k:'E',a:4,w:'ジアミンとジカルボン酸が、水がとれながら結合する反応を繰り返すので重縮合（縮合重合）。ポリエステル（PET）も重縮合でつくる。',r:'p.5'},
  {k:'F',a:5,w:'アクリロニトリル（CH₂=CH−CN）のように炭素間二重結合をもつビニル化合物は、何も脱離せずに次々と付加して高分子になる。これが付加重合。開環重合はε-カプロラクタムからナイロン6をつくる反応なので、ナイロン66と混同しないこと。',r:'p.5–6'}]},
 {roman:'III',stem:'複数のポリマーを一つの紡糸ノズルから押し出して繊維化した繊維の総称を[G]といい、毛のバイラテラル構造を模倣した[H]や極細繊維の原料となる[I]などが製造されている。また、円形以外のノズルを用いて製造される繊維を[J]といい、絹の断面形状である[K]を模倣し、摩擦係数を増大させることにより[L]を再現した繊維も製造されている。',
  words:['混合繊維','異型断面繊維','コンジュゲート繊維','サイドバイサイド型繊維','芯鞘型繊維','海島型繊維','偏平断面','三角断面','中空断面','キシミ感','吸湿性','保温性'],
  items:[
  {k:'G',a:3,w:'複数成分のポリマーを1本の繊維の中で接合したものがコンジュゲート（複合）繊維。並列（サイドバイサイド）型、芯鞘型、多芯型などがある。',r:'p.3, 43'},
  {k:'H',a:4,w:'2成分を貼り合わせたサイドバイサイド型は、収縮差によって羊毛のバイラテラル構造と同じようにクリンプが出る。芯鞘型は芯に導電成分を入れて導電性繊維をつくる用途などに使う。',r:'p.3'},
  {k:'I',a:6,w:'海島型繊維は2成分を複合紡糸し、織編物にしてから「海」成分を溶かして「島」成分だけを残すことで超極細繊維を得る。',r:'p.32'},
  {k:'J',a:2,w:'化学繊維はノズル（紡糸口金）の形で円形以外の断面にできる。これが異形断面繊維で、三角・中空・偏平などはその種類。',r:'p.2, 30'},
  {k:'K',a:8,w:'家蚕の絹（フィブロイン）の断面はおおよそ三角形。三角断面のポリエステルでシルクのような光沢を出す。',r:'p.1'},
  {k:'L',a:10,w:'断面の凹凸が布の摩擦係数を増大させ、絹特有のキシミ感（シルクライクな手ざわり）が得られる。',r:'p.3'}]}
]},
{id:'q2',t:'問2',topic:'繊維の性質・製造・獣毛',type:'own',items:[
 {k:'A',x:'破断するまでのエネルギーが[A]繊維は強靭であるといえる。',o:['大きい','小さい','変化しない'],a:1,w:'荷重−伸長曲線と横軸で囲まれた面積が破断仕事量で、単位長さ・単位太さあたりの値をタフネスという。大きいほど破断に要するエネルギーが大きく、強靭といえる。安全ベルトやロープなど産業資材で重視される。',r:'p.19'},
 {k:'B',x:'一般的な化学繊維では、長く連続した状態のまま使う[B]から作られる糸がある。',o:['チョップ','ステープル','フィラメント'],a:3,w:'化学繊維は長繊維（フィラメント）と短繊維（ステープル）の両方が作られる。連続したまま使うのはフィラメント。ステープルは短く切って紡績に使う。',r:'p.14'},
 {k:'C',x:'綿繊維はアオイ科ワタ植物の種子の[C]細胞が、細長く成長したものである。',o:['筋','幹','表皮'],a:3,w:'綿は種子の表皮細胞が細長く伸びたもので、主成分はセルロース。',r:'p.8'},
 {k:'D',x:'その（綿の）繊維断面には、[D]が存在する。',o:['ルクス','ルーメン','ブラン'],a:2,w:'綿の中空部をルーメンという。ブランは絹の繭糸を構成する1本1本のフィブロイン繊維のことなので混同しないこと。',r:'p.8, 10'},
 {k:'E',x:'ポリエステルやナイロンなどの合成繊維では、紡糸後は分子の配向や結晶が乱れた状態であり、十分な強さを与えるため[E]工程が必要である。',o:['固化','延伸','凝固'],a:2,w:'紡糸直後の繊維を長さ方向に引っ張る（延伸）と高分子が配向し、十分な強さの繊維になる。凝固は湿式紡糸で液中で固めること、固化は溶融紡糸で冷えて固まることで、どちらも延伸の前の段階。',r:'p.14'},
 {k:'F',x:'炭素繊維には、ポリアクリロニトリル（PAN）系の繊維と[F]系の繊維がある。',o:['ペタ','メタ','ピッチ'],a:3,w:'炭素繊維はPAN繊維またはピッチ繊維を焼成・炭素化した無機繊維。',r:'p.34'},
 {k:'G',x:'モヘヤとは[G]の毛である。',o:['アンゴラ山羊','アンゴラうさぎ','アンゴラフェレット'],a:1,w:'モヘヤ＝アンゴラ山羊の毛。素材名の「アンゴラ」はアンゴラうさぎの毛、カシミヤはカシミヤ山羊の毛。',r:'p.11'},
 {k:'H',x:'モヘヤはメリノ羊毛より[H]ことが特徴である。',o:['細くてソフトな','太くてハリがある','ピリングが起こりやすい'],a:2,w:'表1−4では、モヘヤは「羊毛より太くてハリがあり、白く美しい光沢がある」とされている。',r:'p.12（表1−4）'}
]},
{id:'q3',t:'問3',topic:'繊維の試験・性質',type:'own',items:[
 {k:'A',x:'2本の繊維をループ状にして、引張り試験をしたときの強さ',o:['結節強さ','引掛け強さ','折曲げ強さ'],a:2,w:'引掛け強さ（ループ強さ）の定義。結節強さは繊維に結び目を1つつけて引っ張ったときの強さ。どちらも繊維のもろさの評価に使う。',r:'p.19'},
 {k:'B',x:'毛の表面にあるスケールの影響で、羊毛の織・編物が湿潤状態で揉まれると発生する現象',o:['捲縮化','フィブリル化','フェルト化'],a:3,w:'スケールのために根元→先端と先端→根元で摩擦係数が違う（摩擦の異方性）。水中で膨潤してスケールが立った状態で揉まれると、繊維が一方向に移動して絡み、目が詰まっていく。これがフェルト化（縮充）。',r:'p.11, 22'},
 {k:'C',x:'直径が17〜21μmの、一般的な太さの羊毛',o:['ファインウール','ブロードウール','ストロングウール'],a:1,w:'17〜21μmをファインウールとして標準とし、それより太いものをストロングウール（コースウール、ブロードウール）、細いものをスーパーファインウールという。「一般的＝標準＝ファイン」と覚える。',r:'p.11'},
 {k:'D',x:'酸化銅アンモニア溶液に溶解して製造される、再生繊維キュプラの主原料',o:['木材パルプ','コットンリンター','ナフサ'],a:2,w:'キュプラは綿花の種子のまわりに付いている短い繊維（コットンリンター）を原料とする。レーヨンの主原料は木材パルプ、ナフサは合成繊維の原料。',r:'p.15'},
 {k:'E',x:'乾燥前の質量を基準とし、繊維中に含まれる水分量を割合で示した値',o:['水分率','含水率','吸水率'],a:2,w:'水分率＝(W−W′)／W′×100（乾燥後の質量が基準）、含水率＝(W−W′)／W×100（乾燥前の質量が基準）。分母の違いが出題ポイント。公定水分率は水分率のほう。',r:'p.23'}
]},
{id:'q4',t:'問4',topic:'糸の種類・加工糸・意匠糸',type:'own',items:[
 {k:'A',x:'綿糸で、カーディング工程の後、短い繊維を積極的に除去して製造した糸',o:['カード糸','インターレース糸','コーマ糸'],a:3,w:'コーミング工程で短繊維を除去し、繊維の配列を整えた糸がコーマ糸で、強さ・外観に優れる。カード糸はコーミングを省いた糸。',r:'p.37'},
 {k:'B',x:'毛糸のうち、短繊維を取り除き毛足の長い原毛を引き揃えて製造した糸',o:['梳毛糸','紡毛糸','モール糸'],a:1,w:'繊維長が長く上質な羊毛を使うのが梳毛糸（ウーステッド）。短繊維部分や反毛を原料とし、表面が粗でふっくらしているのが紡毛糸（ウーレン）。',r:'p.37'},
 {k:'C',x:'蚕により作られた繭から糸を解じょし、数本束ねて1本の糸を作る工程',o:['精練','製糸','絹紡糸'],a:2,w:'繭を熱湯に漬けてセリシンを軟化させ、数個の繭から繭糸を引き出して集束しながら巻き取る。この工程が製糸。',r:'p.41'},
 {k:'D',x:'製糸工程により製造した絹糸の呼び名',o:['練絹','繭糸','生糸'],a:3,w:'製糸でできた糸が生糸（セリシンが付いたまま）。精練でセリシンを除くと練絹になる。',r:'p.41'},
 {k:'E',x:'2種類以上の短繊維同士を組み合わせて混合し紡績した糸',o:['混紡糸','混繊糸','交撚糸'],a:1,w:'ステープル同士を混ぜて紡績するのが混紡糸。フィラメント同士を混ぜるのが混繊糸、ステープルとフィラメントを混ぜるのが複合糸。',r:'p.36'},
 {k:'F',x:'フィラメントをゆるやかなカール形状にし、中程度の伸縮性とかさ高性を付与する加工法',o:['擦過法','加撚−熱固定−解撚法','押し込み法'],a:1,w:'表2−8で、擦過法は「ゆるやかなカール、伸び：中程度、かさ高」。加撚−熱固定−解撚法はコイル・ループ状で伸び最大、押込み法は細かいジグザグで伸び小。',r:'p.49（表2−8）'},
 {k:'G',x:'芯糸のまわりにからみ糸をループ状に形成させ、ループの撚り戻りによりツノ状にした飾り糸',o:['ノップヤーン','スラブヤーン','スナールヤーン'],a:3,w:'ループを撚り戻りでツノ状にしたのがスナールヤーン。ノップヤーンは糸の中に節（玉）を作った糸、スラブヤーンは部分的に太い所を作った糸。',r:'p.42'},
 {k:'H',x:'スリットしたフィルムをフィブリル化するまで延伸した後に衝撃を加え、細い繊維に分割した糸',o:['ネップヤーン','スプリットヤーン','スリットヤーン'],a:2,w:'フィルムを延伸して所定幅に切ったままのものがスリットヤーン。さらにフィブリル化するまで延伸し、衝撃で細かく割ったものがスプリットヤーン。',r:'p.43'},
 {k:'I',x:'ポリウレタンなどのフィラメントを芯糸にし、他の紡績糸またはフィラメントを巻き付けた糸',o:['コアヤーン','ラッピングヤーン','カバードヤーン'],a:3,w:'ポリウレタン等を芯にして別の糸を巻き付けたのがカバードヤーン。ラッピングヤーンは逆に、無撚りの天然繊維束を芯にしてフィラメントをらせん状に巻き付ける。コアヤーンはフィラメントの芯をステープルで包んだ2層構造の紡績糸。',r:'p.43, 38'}
]},
{id:'q5',t:'問5',topic:'糸の分類',type:'shared',sections:[
 {stem:'糸は、[A]による分類と[B]による分類、製造・加工方法などによる分類がある。[A]においては、[C]糸、毛糸、麻糸、[D]糸などの天然繊維があり、化学繊維の中には、レーヨン糸に使われる[E]繊維、アセテート糸に使われる[F]繊維があり、そしてナイロン糸、ポリエステル糸、[G]糸などに使われる[H]繊維がある。次に[B]に目を向けると、[I]糸と[J]糸がある。天然繊維の[D]糸は、[I]糸と[J]糸の両方あるが、他の天然繊維は、[I]糸しかない。',
  words:['絹','フィラメント','アクリル','繊維の形態','半合成','綿','再生','紡績','原料繊維','合成'],
  items:[
  {k:'A',a:9,w:'テキストの分類「(1)原料繊維の種類による分類」。',r:'p.36'},
  {k:'B',a:4,w:'「(2)原料繊維の形態による分類」。紡績糸とフィラメント糸に分ける。',r:'p.36'},
  {k:'C',a:6,w:'天然繊維の糸は綿糸・毛糸・麻糸・絹糸。Dが「紡績糸とフィラメント糸の両方がある」繊維なので、Cは綿に決まる。',r:'p.36'},
  {k:'D',a:1,w:'絹糸には生糸（フィラメント糸）と絹紡糸（紡績糸）の両方がある。天然繊維で長繊維なのは絹だけ。',r:'p.36–37'},
  {k:'E',a:7,w:'レーヨン・キュプラは再生繊維。',r:'p.36'},
  {k:'F',a:5,w:'アセテートは半合成繊維。',r:'p.36'},
  {k:'G',a:3,w:'ナイロン・ポリエステル・アクリル・ビニロンが合成繊維の糸の例。',r:'p.36'},
  {k:'H',a:10,w:'合成繊維。',r:'p.36'},
  {k:'I',a:8,w:'「他の天然繊維は（I）糸しかない」ので、短繊維から作る紡績糸。',r:'p.36'},
  {k:'J',a:2,w:'フィラメント糸。天然繊維では絹だけが該当する。',r:'p.36'}]}
]},
{id:'q6',t:'問6',topic:'撚り・布の分類',type:'shared',sections:[
 {roman:'I',stem:'繊維束に撚りをかけるとき、下端を固定し上端を時計回りに回転させる[A]とその逆に回転させる[B]がある。また、撚り数とともに糸の空隙率は変化し、小さい順に[C]、並撚り糸、[D]となる。糸を撚ることにより強さを増す理由は、糸を構成している繊維相互の[E]が大きくなるからである。',
  words:['R撚り','甘撚り糸','S撚り','摩擦力','強撚糸','応力','Z撚り'],
  items:[
  {k:'A',a:3,w:'下端を固定し、上端を時計の針と同じ方向に回すとS撚り。',r:'p.38'},
  {k:'B',a:7,w:'逆回転がZ撚り。紡績糸の単糸はZ撚りが多い。',r:'p.38, 46'},
  {k:'C',a:5,w:'強く撚るほど糸がしまり、含気率（空隙率）が減る。最も小さいのが強撚糸で、製品の保温性は下がる。',r:'p.46'},
  {k:'D',a:2,w:'撚りが甘いほど空隙が多い。強撚糸＜並撚り糸＜甘撚り糸の順。',r:'p.46'},
  {k:'E',a:4,w:'撚りで繊維同士が押し付けられて摩擦力が増え、繊維の滑脱が防がれるので強くなる。ただし撚りすぎると強さは下がり、最大になる撚りを飽和撚りという。',r:'p.48'}]},
 {roman:'II',stem:'衣服や装飾に用いられる材料には種々あるが、多くは繊維の集合体である[F]と、[G]類に分けられる。[F]のうち、糸をたて、よこに用いて、原則として互いに直角かつ上下に一定の規則にしたがって組織させたものを[H]、糸のループの連結により構成されたものを[I]、さらに3本以上の糸または糸束を斜めに交差させ、紐状・帯状に作ったものを[J]という。この他には、シート状のウェブをからませたり、接着させたりして製造される[K]がある。「雑貨工業品品質表示規程」では[G]を製品の全部または一部に使用して製造した製品は雑貨工業品となる。',
  words:['組物','布','編物','不織布','網','革','レース','織物','ネット','綱'],
  items:[
  {k:'F',a:2,w:'布素材は大きく布（fabric）と革（leather）類に分けられる。',r:'p.54'},
  {k:'G',a:6,w:'革。雑貨工業品品質表示規程では、革または合成皮革を使った上衣・ズボン・コートなどは繊維製品ではなく雑貨工業品（革製品）になる。',r:'p.54, 93'},
  {k:'H',a:8,w:'織物の定義。',r:'p.54'},
  {k:'I',a:3,w:'編物の定義（糸のループの連続）。',r:'p.54'},
  {k:'J',a:1,w:'組物の定義（3本以上を斜めに交差、紐状・帯状）。',r:'p.54'},
  {k:'K',a:4,w:'不織布の定義（ウェブをからませる・接着する。製織や編組によらない）。',r:'p.54'}]}
]},
{id:'q7',t:'問7',topic:'織物・編物の構造と特性',star:true,type:'tf',items:[
 {k:'A',s1:'平織は糸の交錯点が最も多いので、糸が接近しにくく、糸密度は粗いが外観は密に見え、丈夫な布を得やすい。',s2:'斜文織の特徴は布面に斜め方向の斜文線が現れることである。',a:1,v1:[1,'平織の説明そのまま。'],v2:[1,'斜文織（綾織）は布面に斜文線（綾線）が出る。'],r:'p.55–56'},
 {k:'B',s1:'完全組織内のたて、よこの糸数が等しい場合の斜文線の方向は組織図上で60°の角度をなす。',s2:'斜文織物はたて糸、よこ糸の浮きが平織より長く、交錯点が少ないので、糸密度を大きくできる。',a:3,v1:[0,'60°ではなく45°。斜文線が45°以外のものは急斜文・緩斜文という。'],v2:[1,'浮きが長く交錯点が少ないので糸密度を大きくでき、柔軟でしわになりにくい。'],r:'p.56–57'},
 {k:'C',s1:'二重織はパイル織物を作る際に利用される。',s2:'からみ組織は糸と糸をからませて織るので、透け柄があっても目寄れを起こしにくい。',a:1,v1:[1,'二重織は布を厚く・強くする、両面織物や模様を織り出すほか、パイル織物（ビロードなど）を作るのにも利用される。'],v2:[1,'たて糸同士をからませるので、糸密度が粗くても糸が滑りにくく、ずれ動かない。絽・紗が代表例。'],r:'p.57–58'},
 {k:'D',s1:'織物では、カバーファクタが小さいほど隙間が小さい。',s2:'編物のカバーファクタは、糸が太いほど、ループが小さいほど値が小さくなる。',a:4,v1:[0,'逆。カバーファクタは布が糸で占められる面積の割合なので、小さいほど隙間は大きい。'],v2:[0,'逆。糸が太いほど、ループが小さいほど値は大きくなる。'],r:'p.72–73'},
 {k:'E',s1:'充填率の大きい織物は、生地がしまっていて風合いがかたい。',s2:'ゴム編は平編に比べて大きい含気率をもっている。',a:1,v1:[1,'充填率（パッキングファクタ）は織物の緻密さを総合的にとらえる値。大きいほどしまって硬い。織物で普通20〜50％、編物はこれより小さい。'],v2:[1,'立体的に編成されるゴム編は平編より含気率が大きい。'],r:'p.72–74'},
 {k:'F',s1:'編物は構造的に多孔であるため、通気性に優れている。',s2:'編物は構造的に含気率が小さいため、無風時の保温性は高い。',a:2,v1:[1,'ループ間・繊維間の隙間が多く多孔性なので通気性に優れる。'],v2:[0,'含気率が「大きい」ため無風時の保温性が高い。反面、耐摩耗性は低い。'],r:'p.74'},
 {k:'G',s1:'摩擦回数が増加すると、羊毛では発生したピルが次第に脱落して減少するが、ポリエステルは脱落しにくいため減少しにくい。',s2:'紡績糸使いの素材では、一般的に編物より織物の方がピルを生じやすい。',a:2,v1:[1,'羊毛は強さが小さいのでピルが脱落して減る。ナイロン・ポリエステルは強さが大きく、ピル数は横ばいで減らない（図3−34）。'],v2:[0,'逆。編物は構造が粗で撚りの甘い糸を使い、毛羽立ちやすいので、織物より編物の方がピルを生じやすい。'],r:'p.79'}
]},
{id:'q8',t:'問8',topic:'編物組織・布の力学特性・帯電',star:true,type:'own',items:[
 {k:'A',x:'編物において、よこ編の基本組織は、平編、ゴム編、[A]である。',o:['パール編','シングルアトラス編','両面編'],a:1,w:'よこ編の基本組織は平編・ゴム編・パール編。アトラス編はたて編の組織、両面編（スムース）はゴム編から展開した組織。パール編は表裏同一で、ウエール方向の伸長性が最も大きい。',r:'p.67–68'},
 {k:'B',x:'織物の引裂き破壊は、[B]と呼ばれる部分を起点として、伝播的に荷重が作用して糸の切断が進行する。',o:['タング','デル','テール'],a:2,w:'引張りは多数の糸が同時に切れるのに対し、引裂きはデル部で糸が1本ずつ順に切れていく（図3−30）。',r:'p.75'},
 {k:'C',x:'同じ糸使いであれば、斜子織の引裂き強さは、平織の引裂き強さと比較して[C]。',o:['差がない','小さい','大きい'],a:3,w:'引張り強さは大差ないが、引裂き強さは斜子織が大きい。平織は1本ずつ抵抗するのに対し、斜子織は引きそろえた糸が同時に抵抗するため。伸びの小さい・密な・硬い織物は引裂き強さが小さくなる。',r:'p.76'},
 {k:'D',x:'曲げ特性のうち[D]に対する寄与が大きいものは、繊維の初期引張り抵抗度と、糸の太さ、織編物の密度である。',o:['曲げ剛性','曲げ戻り性','曲げ伸び性'],a:1,w:'曲げ剛性の説明。繊維の曲げ剛性は直径の4乗と初期引張り抵抗度の積に比例する（p.21）。',r:'p.87'},
 {k:'E',x:'[E]には、繊維の粘弾性的な性質の他に糸と糸の交差する点での接触圧力の影響もある。',o:['曲げ剛性','曲げ戻り性','曲げ伸び性'],a:2,w:'曲げ戻り性（ヒステリシス幅）の説明。「曲げ伸び性」という特性はない。',r:'p.87'},
 {k:'F',x:'繊維同士の摩擦により一番高く帯電しやすい組み合わせは[F]である。',o:['羊毛−絹','ナイロン−ポリエステル','レーヨン−綿'],a:2,w:'帯電列は（＋）ナイロン、羊毛、絹、レーヨン、綿、アセテート、ポリエステル、アクリル（−）。列で離れている繊維同士ほど帯電圧が高い。羊毛−絹、レーヨン−綿は隣同士なので低い。',r:'p.85'},
 {k:'G',x:'風合いの物理的因子における用語の組み合わせとして最も適したものは[G]である。',o:['曲げ変形−バイアス方向に引張る','圧縮変形−厚み方向に押さえる','伸長変形−両端をもって曲げる'],a:2,w:'布の5つの力学特性は、曲げ変形（両端を持って曲げる）、せん断変形（バイアス方向に引張る）、伸長変形（両端を持って引張る）、圧縮変形（厚み方向に押さえる）、表面特性。1と3は動作が入れ替えてある。',r:'p.86'}
]},
{id:'q9',t:'問9',topic:'不織布・皮革',type:'own',items:[
 {k:'A',x:'短繊維を水中に均一に分散し、シート状に集積してウェブを結合する方法',o:['乾式法','湿式法','カーディング法'],a:2,w:'湿式法は抄紙法とほぼ同じで、短繊維を水中に分散して金網ですくい、脱水・乾燥する。',r:'p.90'},
 {k:'B',x:'ウェブの接着方法において、化学的接着法にあてはまらないもの',o:['カレンダ法','レジンボンド法','スプレー法'],a:1,w:'化学的接着法（レジンボンド法）は接着剤を浸漬・スプレーなどで付与する。カレンダ法は加熱ロールで低融点繊維を溶かして接着する熱的接着法（サーマルボンド）。',r:'p.91'},
 {k:'C',x:'紡糸機から出たフィラメントを熱風により吹き飛ばした後、ウェブを形成する不織布。極細繊維による不織布の生産が可能',o:['スパンボンド不織布','メルトブローン不織布','ステッチボンド不織布'],a:2,w:'メルトブロー法は熱風で吹き飛ばすので有限長のフィラメントになり、0.01dtexまでの極細繊維が得られる（フィルタ、マスクなど）。スパンボンドは連続フィラメントを振り広げて集積、ステッチボンドは糸で縫う方法。',r:'p.90–91'},
 {k:'D',x:'天然皮革に外観や風合いを近づけ、内部構造も天然皮革に準じたものを目指して模造したもの',o:['合成皮革','人工皮革','擬皮革'],a:2,w:'「内部構造も天然皮革に準じる」のが人工皮革。合成皮革は織物・編物の基布に樹脂を塗って表面だけ革に似せたもの。',r:'p.96–97'},
 {k:'E',x:'Dの基材として利用されるもの',o:['不織布','織物','編物'],a:1,w:'人工皮革の基材は極細繊維の不織布で、ポリウレタンを含浸させて作る。',r:'p.97'},
 {k:'F',x:'鹿の革の銀面をサンドペーパーで擦って起毛させたもの',o:['エンボス革','スエード','バックスキン'],a:3,w:'バックスキンは鹿革の「銀面（表側）」を起毛。スエードは革の「肉面（裏側）」を起毛したもの。面の違いが出題ポイント。',r:'p.94'}
]},
{id:'q10',t:'問10',topic:'前処理・染料・色管理・仕上加工',star:true,type:'tf',items:[
 {k:'A',s1:'絹の精練は、生糸の表面を被覆しているフィブロインをほぼ除去することである。',s2:'絹の精練では、セルラーゼによる酵素精練が行われている。',a:4,v1:[0,'除去するのはセリシン（20〜25％）。フィブロインは絹そのもの。'],v2:[0,'絹の酵素精練はたんぱく質分解酵素（プロテアーゼ）。セルラーゼは綿・麻・リヨセル用のセルロース分解酵素。'],r:'p.103–104, 141'},
 {k:'B',s1:'漂白剤は、酸化型漂白剤と還元型漂白剤があり、一般的には後者が広く使われている。',s2:'過酸化水素漂白は、布に鉄サビなどの鉄分が付着していると、その部分で過酸化水素の分解が進んでピンホールの損傷が起こりやすい。',a:3,v1:[0,'広く使われているのは前者の酸化型。'],v2:[1,'鉄分が点状に付着していると過酸化水素の分解が急激に進み、ピンホールが生じる。'],r:'p.104–105'},
 {k:'C',s1:'バット染料は、水不溶性で、各種堅ろう度が一般的に良好である。',s2:'金属錯塩酸性染料は、アニオン性で、金属が配位結合され、耐光など堅ろう度が高く、色は鮮やかである。',a:2,v1:[1,'鮮明さはやや欠けるが、耐光をはじめ各種堅ろう度が高い高級染料。'],v2:[0,'表4−4では「耐光など堅ろう度が高いが、色がくすむ」。「鮮やか」が誤り。'],r:'p.108（表4−4）, 111'},
 {k:'D',s1:'顔料を繊維上に固定するためには、バインダーといわれる接着剤が必要である。',s2:'繊維着色用として使われる有機顔料は、無機顔料と比べて耐光性、耐熱性が高いものが多い。',a:2,v1:[1,'顔料は繊維に親和性がないので、バインダー（合成樹脂エマルジョン）で固着する。'],v2:[0,'有機顔料は鮮明な色と大きな着色力が特徴だが、無機顔料より耐光性・耐熱性が低いものが多い。'],r:'p.113'},
 {k:'E',s1:'防汚加工のうち、汚れを落ちやすくする加工をソイルリリース加工という。',s2:'防汚加工のうち、汚れがつきにくくする加工をソイルガード加工という。',a:1,v1:[1,'SR加工。疎水性合成繊維に親水性化合物を付与し、洗濯で油汚れを落ちやすくする。'],v2:[1,'SG加工。主にふっ素系樹脂を使う。'],r:'p.139'},
 {k:'F',s1:'繊維製品は様々な分光特性を持つ光源下で使用されるため、演色性には気をつける必要がある。',s2:'アイソメリズムは、特定の光源下で同じ色に見えることをいう。',a:2,v1:[1,'ある光源で同じ色に見えても、光源が変わると違う色に見える（演色性）ため注意が必要。'],v2:[0,'アイソメリズム（絶対等色）は分光反射曲線が同一で、どんな光源下でも同じ色に見える関係。特定の光源下でだけ同じ色に見えるのはメタメリズム（条件等色）。'],r:'p.127'},
 {k:'G',s1:'潜在ひずみを除去し、かさ高性と伸縮性を向上させる処理をリラックス処理という。',s2:'フェルト化の効果により、組織を緻密にする処理を縮じゅうという。',a:1,v1:[1,'加工糸織編物を熱と機械的もみ作用で弛緩させる処理。'],v2:[1,'毛織物・編物をアルカリや石けんを含む液で湿らせ、たたいたり揉んだりして組織を緻密にする。'],r:'p.104'}
]},
{id:'q11',t:'問11',topic:'染色・捺染・色管理',star:true,type:'own',items:[
 {k:'A',x:'水溶性の染料は、湿潤堅ろう度は低いが、耐ドライクリーニング性は高い。また、塩となっているため[A]が問題になることはない。',o:['光堅ろう度','摩擦堅ろう度','昇華堅ろう度'],a:3,w:'水溶性染料は塩なので昇華性がない。逆に水不溶性の染料（分散染料など）は湿潤堅ろう度は高いが、耐ドライクリーニング性や昇華堅ろう度が問題になることがある。',r:'p.110'},
 {k:'B',x:'直接・反応・バット染料で綿を染める際の無機電解質や、酸性染料で羊毛・絹・ナイロンを染める際の酸を[B]という。',o:['促染剤','分散剤','緩染剤'],a:1,w:'染色速度・染着量を増す促染剤。無機電解質は染料と繊維の静電的な反発を弱め、酸は繊維上に染着座席（−NH₃⁺）をつくる。ポリエステルのキャリア剤も促染剤。緩染剤は逆に染色を遅らせてむらを防ぐ。',r:'p.113'},
 {k:'C',x:'還元抜染剤は、主として直接・反応・分散染料などの[C]系染料に適用可能で、還元により[C]基を切断して無色とする。',o:['インジゴイド','アゾ','アントラキノン'],a:2,w:'還元でアゾ基（−N=N−）を切断する。還元抜染できないものには酸化抜染剤を使う。',r:'p.115'},
 {k:'D',x:'染め足などと呼ばれる染色速度の近似した染料同士で染色処方を組むと、色の[D]が高まる。',o:['演色性','再現性','三属性'],a:2,w:'染め足のそろった染料で処方を組むと、色の再現性が高まる。',r:'p.126'},
 {k:'E',x:'色見本に近似する過去に染めた色を既存データから検索する方法は、[E]とも呼ばれる。',o:['コンピュータカラーセッティング（CCS）','コンピュータカラーサーチング（CCS）','コンピュータレシピサーチング（CRS）'],a:2,w:'一定の色差の許容範囲で過去の処方データを検索する「色検索」。テキストでは「コンピュータカラーサーチ（CCS）」と表記。CCMと並んで色合わせの合理化につながる。',r:'p.126'},
 {k:'F',x:'蛍光増白は[F]方法である。',o:['黄褐色の補色である青紫系の色素を付加させて白く見せる','紫外線を放射して一般に紫〜青色、400〜450nmの光を発光させる','紫外線を吸収して一般に紫〜青色、400〜450nmの光を発光させる'],a:3,w:'蛍光増白剤は紫外線を「吸収」して400〜450nm（紫〜青）の光を発する。1は青味付け（ブルーイング）の説明。',r:'p.105'},
 {k:'G',x:'あらかじめ分散染料インクで印刷した紙を用いて、ポリエステル織編物に圧着して熱処理する一連の方法',o:['インクジェットプリント','サーモゾル染色','転写捺染'],a:3,w:'転写紙と布を圧着して模様を移す転写捺染（主に乾式の昇華転写捺染）。サーモゾル染色は分散染料をパッドして200℃付近の乾熱で染める方法。',r:'p.122–123'},
 {k:'H',x:'ザプロ加工は、羊毛がアニオン化した金属錯塩を吸収する性質を利用し、[H]の錯塩を付着させることにより耐熱性を高める。',o:['リンやハロゲン','リンやアルミニウム','ジルコニウムやチタン'],a:3,w:'ザ・ウールマーク・カンパニーが開発した羊毛の防炎加工。消防服などに実用化されている。',r:'p.140'},
 {k:'I',x:'整経に必要な総本数のたて糸を分けて束にし、連続的に染色する方法。主にデニムのたて糸をインジゴで染める',o:['ワープビーム染色','ロープ染色','マフ染色'],a:2,w:'たて糸を数百本ずつのロープ状の束にして連続染色する。糸の外側だけ染まり中心が白く残る「中白」のインジゴ染めに向く。ワープビーム染色はたて糸をビームに巻いてパッケージ染色機で染める方法。',r:'p.117'},
 {k:'J',x:'拡布状で染液中のガイドロールを通して、2本のローラ間で交互に巻き取りながら染色を行う方法',o:['ジッガ染色','ウインス染色','パッドスチーム染色'],a:1,w:'ジッガ染色は浴比が小さく省エネだが、張力がかかり、エンディング（端と中央の色差）やモアレが起こりやすい。ウインス染色はロープ状の布をリールで循環させる方法。',r:'p.118'}
]},
{id:'q12',t:'問12',topic:'仕上加工・機能加工・染色機構',star:true,type:'own',items:[
 {k:'A',x:'研磨により主にたて糸が毛羽立ち毛足は短くなる起毛。ピーチスキン調仕上げに用いられる',o:['針布起毛','エメリ起毛','あざみ起毛'],a:2,w:'エメリ起毛は研磨布で表面を摩耗して毛羽を出す。針布起毛は針布ローラで引っかき、主によこ糸を毛羽立てる。あざみ起毛は植物のあざみの実を使う方法。',r:'p.132'},
 {k:'B',x:'耐薬品性の異なる2種の繊維を混用した織物に薬剤を印捺して、片方の繊維を分解または溶解除去して透明感のある模様を得る加工',o:['オパール加工','オーガンジ加工','リップル加工'],a:1,w:'オパール加工（抜蝕加工）。ポリエステルと綿の混用織物に酸を含む糊を印捺し、綿を炭化・除去する方法が主体。オーガンジ加工は薄い綿布を濃硫酸で処理して透明感と張りを出す加工、リップル加工はアルカリで部分的に収縮させてしぼを出す加工。',r:'p.134'},
 {k:'C',x:'綿などのセルロース繊維またはその混紡織物に樹脂加工を応用して耐久性のあるプリーツ性、ウォッシュ・アンド・ウエア性を付与する加工。プレキュア法とポストキュア法がある',o:['防しわ加工','パーマネントプレス加工','シルケット加工'],a:2,w:'パーマネントプレス（PP）加工の定義。「プレキュア法とポストキュア法」がキーワード。防しわ加工は架橋でしわ回復性を高める加工、シルケット加工は濃いアルカリで綿に光沢を出す加工。',r:'p.136'},
 {k:'D',x:'界面活性剤、シリコーンやポリエチレンの乳化物などで生地を処理し、繊維間の摩擦抵抗を減少させる。揉みや叩きなどの機械的作用を用いる方法もある',o:['クリアカット仕上げ','柔軟仕上げ','光沢仕上げ'],a:2,w:'柔軟仕上げの説明。クリアカット仕上げは毛織物の表面の毛羽を刈り取って織り目を鮮明にする仕上げ。',r:'p.129'},
 {k:'E',x:'生地をラバーベルトなどに添わせ、予想される収縮に相当するだけたて方向に押し込んで仕上げ、寸法安定性を保証する方法',o:['ウォッシュ・アンド・ウエア方式','ポストキュア方式','サンフォライズ方式'],a:3,w:'圧縮収縮仕上げのうち、残留収縮率を測ってその分を押し込み、加工後に試験で確認して寸法安定性を保証するのがサンフォライズ式。',r:'p.136'},
 {k:'F',x:'綿織物などを薬液に浸せきし、緊張下で加熱あるいは蒸気処理をする。薬剤が綿繊維内部まで深く浸透し、結晶および非晶構造を変化させる',o:['減量加工','カレンダ加工','液体アンモニア処理'],a:3,w:'液体アンモニア処理。強さ・寸法セット性・防しわ性・防縮性・風合いが向上するが、光沢や染色性の向上は小さい。形態安定加工の前処理に使われる。減量加工はポリエステルをアルカリで溶かして細くする加工。',r:'p.106'},
 {k:'G',x:'水不溶性でそのままでは染まらない。アルカリとハイドロサルファイトで還元して水溶性のロイコ塩とし染色し、染色後の酸化で不溶性の染料に戻るため湿潤堅ろう度は高い',o:['建染染料の染色機構','カチオン染料の染色機構','分散染料の染色機構'],a:1,w:'建染（バット）染料の染色機構。問10Cのバット染料と同じ。分散染料は水に難溶で、分散した状態から疎水性繊維に染まる。',r:'p.110–111'},
 {k:'H',x:'合成繊維に後加工で吸湿性を付与するため化学構造にヒドロキシ基・カルボキシ基などを導入する。吸水性は表面状態の影響が大きいため、表面に加工剤を付与する方法もある',o:['疎水性繊維の透湿加工','疎水性繊維の親水加工','親水性繊維の防水加工'],a:2,w:'親水加工の説明。吸湿性は化学構造によるので親水基を導入し、吸水性は表面状態によるので表面に加工剤を付ける。',r:'p.138'}
]}
];

const Q2 = [
{id:'q1',t:'問1',topic:'天然繊維・化学繊維の性質と製法',type:'own',items:[
 {k:'A',x:'天然繊維である苧麻の繊維長は[A]程度である。',o:['25〜30 mm','40〜50 mm','70〜280 mm'],a:3,w:'表1−1で苧麻（繊維細胞）の長さは70〜280mm。25〜30mmは亜麻（繊維細胞）の値。苧麻は「太くて長くシャリ感がある」、亜麻は「細くて短く綿に近い風合い」と覚える。',r:'p.1（表1−1）, 10'},
 {k:'B',x:'苧麻の太さ（幅）は[B]程度である。',o:['10〜15 μm','15〜25 μm','25〜75 μm'],a:3,w:'表1−1で苧麻の幅は25〜75μm。長さ（A）と同じく、亜麻より太くて長いのが苧麻の特徴。',r:'p.1（表1−1）, 10'},
 {k:'C',x:'羊毛繊維において、異なる構成アミノ酸組成からなるパラコルテックスとオルソコルテックスの2層が貼り合わさった構造のことを[C]といい、クリンプの原因になっている。',o:['ミセル構造','バイラテラル構造','コアシース構造'],a:2,w:'皮質部（コルテックス）がパラとオルソの2層に分かれたバイラテラル構造で、オルソコルテックスがクリンプの外側になる。練習問題①の問1でも出た頻出事項。',r:'p.1, 12'},
 {k:'D',x:'中心を空洞にした中空繊維では[D]が向上する。',o:['耐熱性','はっ水性','保温性'],a:3,w:'中空繊維は繊維内部に空気を持たせたもので、軽量化・弾力性・保温性が向上する。ポリエステルでは中空率35〜40％の繊維が開発されている。',r:'p.2, 31'},
 {k:'E',x:'植物繊維であるカポックは[E]に分類される。',o:['種子毛繊維','靱皮繊維','葉脈繊維'],a:1,w:'表1−3で種子毛繊維は綿・カポック・パンヤ。靱皮繊維は亜麻・苧麻など、葉脈繊維はマニラ麻・サイザル麻など。',r:'p.9（表1−3）'},
 {k:'F',x:'化学繊維の製法には主に3つの方法があり、紡糸速度や生産性が高いのは[F]である。',o:['湿式紡糸','乾式紡糸','溶融紡糸'],a:3,w:'溶融紡糸は原料を溶かしてノズルから押し出し、冷やして繊維にする方法。紡糸速度を高められ生産性が高く、異形断面繊維の製造にも適する。ポリエステル・ナイロンなど。',r:'p.14'},
 {k:'G',x:'アセテートは[G]により製造されている。',o:['湿式紡糸','乾式紡糸','溶融紡糸'],a:2,w:'乾式紡糸は溶剤に溶かした原料をノズルから押し出し、高温の気体中で溶剤を蒸発させて繊維化する。アセテートや乾式アクリルがこの方法。湿式紡糸はレーヨンや大部分のアクリル。',r:'p.14'},
 {k:'H',x:'アセテート繊維とは、セルロースの−OH基（ヒドロキシ基）を[H]に置き換えた半合成繊維のことである。',o:['メチル基','アセトキシ基','アミノ基'],a:2,w:'アセテートはセルロースの−OH基をアセトキシ基（−OCOCH₃）に置き換えた酢酸セルロース繊維。',r:'p.13, 15'},
 {k:'I',x:'アセテートは、綿やレーヨンと比較して[I]。',o:['吸湿性が高い','水による膨潤性が高い','水による収縮が小さい'],a:3,w:'アセテートは水に対する膨潤性が低いため、綿やレーヨンに比べて水による収縮が小さい。吸湿性は「適度」で、綿やレーヨンより低い。',r:'p.15'},
 {k:'J',x:'吸湿性がなく耐熱性が低い水に浮く合成繊維には[J]がある。',o:['ポリプロピレン','ポリエステル','ポリアミド'],a:1,w:'ポリプロピレンは密度0.91g/cm³と合成繊維の中で最も軽く、水に浮く。吸湿性がなく（公定水分率0.0％）、耐熱性が低い。',r:'p.17, 24'}
]},
{id:'q2',t:'問2',topic:'繊維の力学・熱的性質と改質・スーパー繊維',type:'own',items:[
 {k:'A',x:'繊維は一般的に吸湿により引張り強さは低下するが、[A]は湿潤すると、引張り強さは増加する。',o:['綿・麻','ポリエステル','ビニロン'],a:1,w:'湿度依存性：繊維は一般に吸湿で引張り強さが下がるが、綿・麻は湿潤すると引張り強さが増える。疎水性の合成繊維は湿潤してもあまり変わらない。',r:'p.19, 75'},
 {k:'B',x:'繊維の断面を円と仮定した場合、繊維の曲げ剛性は、繊維の直径の[B]と初期引張り抵抗度の積に比例する。',o:['2乗','3乗','4乗'],a:3,w:'曲げ剛性は直径の4乗に比例する。わずかに細くするだけで曲げ剛性が大きく下がる（しなやかになる）ため、極細繊維は柔らかい。',r:'p.21'},
 {k:'C',x:'繊維の曲げ剛性は、繊維の直径の4乗と初期引張り抵抗度の[C]。',o:['積に比例する','差に等しい','積に反比例する'],a:1,w:'「直径の4乗」×「初期引張り抵抗度」の積に比例する。ねじり剛性も同じく直径の4乗とねじり剛性率の積に比例する。',r:'p.21'},
 {k:'D',x:'合成繊維を構成する高分子のガラス転移温度は[D]。',o:['水分があると上昇する','水分があると低下する','水分があっても変化しない'],a:2,w:'水中でのTgは乾燥状態に比べて低くなる（ポリエステルで約20℃低下、吸湿性のあるナイロンではさらに大きく下がる）。水が可塑剤のように働くため。',r:'p.25–26'},
 {k:'E',x:'親水基を含む化合物やポリマーを合成繊維の繊維内部や繊維表面に導入することで、吸湿性だけでなく、[E]を付与することができる。',o:['はっ水性','制電性','帯電性'],a:2,w:'合成繊維への制電性の付与は、繊維内や繊維表面に親水性ポリマーを導入することで行う。吸湿して表面の電気抵抗が下がり、静電気が逃げやすくなる。',r:'p.31–32'},
 {k:'F',x:'吸水・吸汗性を高めるには[F]は不適当である。',o:['繊維の表面積の低下','繊維の極細化','繊維側面の多孔化'],a:1,w:'吸水・吸汗性は毛管現象が大きく影響し、単位容積当たりの繊維表面積を増やすと向上する。手段は極細化・異形断面化・側面の多孔化など。表面積を「下げる」のは逆効果なので不適当。',r:'p.30–31'},
 {k:'G',x:'ベンゼン環を含まない屈曲性の高分子で、工業的にゲル紡糸・超延伸により得られる高強度・高弾性率の繊維として[G]が知られている。',o:['ポリアリレート繊維','ポリエステル繊維','超高分子量ポリエチレン繊維'],a:3,w:'超高分子量ポリエチレン繊維は、屈曲性の高分子（ベンゼン環なし）をゲル紡糸・超延伸して高強度・高弾性率にした繊維。ポリアリレートは芳香族（ベンゼン環を含む）の液晶高分子。',r:'p.34'},
 {k:'H',x:'引張り強さや引張り弾性率は炭素繊維と同程度で、難燃性や耐熱性が高く、熱分解温度は650℃程度で、限界酸素指数が合成繊維の中でも高い繊維として[H]が知られている。',o:['PBO繊維','PPTA系繊維','PPS繊維'],a:1,w:'PBO（ポリパラフェニレンベンゾビスオキサゾール）繊維は熱分解温度650℃、限界酸素指数68で合成繊維中最高レベル。PPTAはパラ系アラミド、PPSは高耐熱性繊維の例。',r:'p.30, 35'}
]},
{id:'q3',t:'問3',topic:'荷重−伸長曲線・応力とひずみ・粘弾性',type:'own',items:[
 {k:'A',x:'繊維に引張り荷重を加えていくと、繊維は伸びる。荷重と伸びの関係を示した図を、[A]という。',o:['荷重−伸長曲線','負荷−伸び曲線','伸長伝達曲線'],a:1,w:'荷重−伸長曲線（強伸度曲線とも呼ぶ）。荷重を応力に、伸びをひずみに変換したものは応力−ひずみ曲線という。',r:'p.18'},
 {k:'B',x:'荷重の単位としては[B]を用いる。',o:['N（ニュートン）','J（ジュール）','Pa（パスカル）'],a:1,w:'荷重の単位は以前はgfだったが、現在は国際単位系のN。繊維ではcN（センチニュートン）を使い、太さあたりのcN/dtexもよく使われる。Jはエネルギー、Paは応力の単位。',r:'p.18'},
 {k:'C',x:'繊維にかかる荷重を[C]に変換した値を、応力と呼ぶ。',o:['単位伸びあたりの力','単位断面積あたりの力','単位荷重当たりの伸び'],a:2,w:'応力＝単位断面積あたりの力（Pa＝N/m²）。',r:'p.18'},
 {k:'D',x:'応力は[D]で表す。',o:['N（ニュートン）','J（ジュール）','Pa（パスカル）'],a:3,w:'応力の単位はPa（＝N/m²）。荷重（B）はN、応力（D）はPaと対で覚える。',r:'p.18'},
 {k:'E',x:'繊維の伸びを荷重前の試料長（初期長）で除した値を[E]と呼ぶ。',o:['尖度','弾性度','ひずみ'],a:3,w:'伸び（荷重時の長さ−試験長）を試験長で割った比率がひずみ。試験長100mmで20mm伸びればひずみ0.2、伸び率20％。',r:'p.18'},
 {k:'F',x:'一般に繊維の変形による応力変化は時間依存性を示し、一定の伸びを与えておくと、応力は時間とともに減少する。これを[F]と呼ぶ。',o:['応力緩和','クリープ','内部緩和'],a:1,w:'ひずみ一定→応力が時間とともに減る＝応力緩和。どちらも弾性に加えて内部摩擦（粘性）を考える粘弾性の現象。',r:'p.20'},
 {k:'G',x:'一定応力のもとで繊維の伸びは、時間とともに徐々に増加する。これを[G]と呼ぶ。',o:['応力緩和','クリープ','遅延緩和'],a:2,w:'応力一定→ひずみが時間とともに増える＝クリープ。F（応力緩和）と対で出題される。',r:'p.20'}
]},
{id:'q4',t:'問4',topic:'糸の製造・種類・太さの表示',type:'shared',sections:[
 {roman:'I',stem:'',
  words:['トウ紡績','ミュール紡績','オープンエンド紡績','カード糸','コーマ糸','梳毛糸','紡毛糸','混繊糸','絹紡糸','トラベラ','リング','ドラフトローラー'],
  items:[
  {k:'A',x:'化学繊維で長繊維状の繊維束を原料とし、繊維を引張って切断するなどして短繊維化し、スライバーを作り紡績する方法',a:1,w:'トウ（フィラメントの束）を牽切（引きちぎる）方式やカッターで短繊維化して紡績するのがトウ紡績。',r:'p.36'},
  {k:'B',x:'綿糸で、短繊維を積極的に除去するコーミング工程を省略した糸',a:4,w:'コーミング工程を省いたのがカード糸。コーミングで短繊維を除いた糸がコーマ糸（練習問題①問4Aの逆パターン）。',r:'p.37'},
  {k:'C',x:'毛糸で、原毛の短繊維部分や反毛などを原料とし、繊維の配列が比較的乱れているふっくらとした糸',a:7,w:'短繊維部分や反毛（再生羊毛）を原料とし、工程が短く、繊維の配列が乱れて表面が粗でふっくらしているのが紡毛糸。長く上質な羊毛を使うのは梳毛糸。',r:'p.37'},
  {k:'D',x:'養蚕時や生糸を作る時に出る「出がら繭」や「きびそ」などを原料とする糸',a:9,w:'絹紡糸は副蚕糸（出がら繭、くず繭、きびそなど）を原料とする紡績糸。生糸は繭から直接引き出した糸。',r:'p.36–37'},
  {k:'E',x:'リング精紡機で撚りをかけるために回転するパーツ',a:10,w:'リング精紡機では、繊維束がリングとトラベラの間を通ってボビンに巻き取られる。スピンドルの回転と糸の張力でトラベラがリングに沿って回り、撚りがかかる。',r:'p.40'}]},
 {roman:'II',stem:'',
  words:['混繊糸','混合糸','渦流紡績糸','複合糸','フィラメント加工糸','コンジュゲート糸','シックアンドシン糸','麻番手','綿番手','デニール','メートル番手','フィラメント糸','スパン糸'],
  items:[
  {k:'F',x:'絹や化学繊維など連続した繊維を所定の本数束ねた構造の糸',a:12,w:'フィラメント糸は絹や化学繊維の連続した繊維（フィラメント）を所定本数集めた糸。1本ならモノフィラメント糸、複数ならマルチフィラメント糸。',r:'p.36–37'},
  {k:'G',x:'合成繊維の熱可塑性を利用してマルチフィラメントに半永久的な捲縮やねじれを与えた糸',a:5,w:'フィラメント加工糸（テクスチャードヤーン）の定義そのまま。仮撚り加工などで伸縮性・かさ高性を与える。',r:'p.37'},
  {k:'H',x:'2種類以上のフィラメント繊維同士を混合した糸',a:1,w:'フィラメント同士＝混繊糸、ステープル同士＝混紡糸、ステープルとフィラメント＝複合糸。',r:'p.36, 38'},
  {k:'I',x:'基準質量453.59 gの糸の長さが768.1 mの何倍あるかで表す糸の太さの表示法',a:9,w:'綿番手は453.59g（1ポンド）の糸の長さが768.1m（840ヤード）の何倍かで表す恒重式番手。麻番手は基準長さ274.32m（300ヤード）、メートル番手は1,000gで1,000m。',r:'p.44–45'},
  {k:'J',x:'基準長さ9,000 mの糸の質量で表す糸の太さの表示法',a:10,w:'デニールは9,000mあたりのグラム数で表す恒長式。テックスは1,000mあたりのグラム数（1テックス＝9デニール）。',r:'p.44–45'}]}
]},
{id:'q5',t:'問5',topic:'布の性能・寸法安定性',star:true,type:'own',items:[
 {k:'A',x:'織物がかぎ裂きで破れる場合に対する実用性能は[A]で評価される。',o:['破裂強さ','摩耗強さ','引裂き強さ'],a:3,w:'衣服は着用中、引張りよりも引裂きで破れることが多く、作業服や子供服ではかぎ裂きが生じやすい。その実用性能を調べるのが引裂き強さ。',r:'p.75'},
 {k:'B',x:'繊維が高い[B]を持つと防しわ性は向上する。',o:['弾性回復力','引張り強さ','曲げヒステリシス'],a:1,w:'布を構成する繊維が変形しにくく、変形しても元に戻りやすければしわになりにくい。つまり繊維の弾性回復力が大きいほど防しわ性は高い。',r:'p.77'},
 {k:'C',x:'編物で編糸が切断し編目の外れる現象を[C]という。',o:['ラン','スナッグ','ピル'],a:1,w:'ラン（ラダリング、伝線）はよこ編の欠点で、平編で特に起こりやすい。スナッグは糸が引っ掛かって引き出される現象、ピルは毛羽が絡んだ毛玉。',r:'p.68, 79'},
 {k:'D',x:'セルロース繊維織物の収縮は、主に膨潤収縮と[D]がある。',o:['熱収縮','フェルト収縮','緩和収縮'],a:3,w:'綿・レーヨンなどセルロース繊維織物の収縮は、水を吸って膨潤する膨潤収縮と、潜在ひずみの解放による緩和収縮が主な原因。フェルト収縮は羊毛特有。',r:'p.80–81'},
 {k:'E',x:'編物の収縮を抑えるためには、生産工程における給糸、巻取の際の[E]の管理が重要である。',o:['張力','風綿','汚染'],a:1,w:'編物の内部ひずみは主に引張り力から生じる。編成では編目のひずみを抑えるように給糸・巻き取りの張力管理が大切で、仕上げ加工でも張力管理に注意する。',r:'p.80'},
 {k:'F',x:'吸水した布の乾燥において、水分率が直線的に減少したあとの乾燥過程は[F]である。',o:['恒率乾燥','減率乾燥','増率乾燥'],a:2,w:'乾燥はまず水分率が時間とともに直線的に減る恒率乾燥期（外の環境条件に支配）、その後乾燥速度が落ちていく減率乾燥期（繊維の性質が強く関係）と進む。',r:'p.83'},
 {k:'G',x:'布のせん断変形は[G]でも測定できる。',o:['カンチレバー法','通気性試験','バイアス方向の引張り試験'],a:3,w:'布の力学特性のうち、せん断変形は「バイアス方向に引張る」変形。カンチレバー法は曲げ（剛軟度）の試験。',r:'p.86'}
]},
{id:'q6',t:'問6',topic:'不織布の製法',type:'shared',sections:[

  words:['ステッチボンド不織布','ニードルパンチ不織布','スパンレース不織布','メルトブローン不織布','エアレイド不織布','スパンボンド不織布','ケミカルボンド不織布','湿式不織布'],
  items:[
  {k:'A',x:'「返し（バーブ）」のついた針の運動によって、ウェブ中の繊維を交絡する不織布',a:2,w:'特殊な形状の針でウェブを突き刺して繊維を絡めるのがニードルパンチ法。自動車内装材・土木用など用途は幅広い。',r:'p.91'},
  {k:'B',x:'各種接着剤を使用して、ウェブ中の繊維間を接着する不織布',a:7,w:'接着剤で繊維を接着する化学的接着法。レジンボンド法、ラテックス接着法、ケミカルボンド法とも呼ばれる。',r:'p.91'},
  {k:'C',x:'糸を用いて、ウェブを縫うことにより固定する不織布',a:1,w:'ウェブをフィラメント糸などで縫う方法がステッチボンド法（機械的接着法に含まれる）。',r:'p.91'},
  {k:'D',x:'高圧水流によってウェブ中の短繊維を交絡する不織布',a:3,w:'高圧ジェット水流で繊維を絡めるのが水流交絡法（スパンレース法、ウォータジェットパンチ法）。ぬれティッシュや人工皮革の基布などに使われる。',r:'p.91'},
  {k:'E',x:'紡糸されたフィラメントを直接的にシート状に積層することにより製造する不織布',a:6,w:'紡糸直結法の代表がスパンボンド法とメルトブロー法。スパンボンドは連続フィラメントでウェブを作り、メルトブローは熱風で吹き飛ばした有限長のフィラメントでウェブを作る。',r:'p.90'}]}
]},
{id:'q7',t:'問7',topic:'編物の組織と編機',star:true,type:'own',items:[
 {k:'A',x:'よこ編の基本組織は平編、ゴム編、[A]である。',o:['天竺編','パール編','両面編'],a:2,w:'よこ編の基本組織は平編・ゴム編・パール編の3つ。天竺編は平編の別名、両面編はゴム編を2枚重ねた変化組織。',r:'p.67–68'},
 {k:'B',x:'平編は[B]とも呼ばれる。',o:['リブ編','メリヤス編','リンクス編'],a:2,w:'平編は天竺編やメリヤス編とも呼ばれる。リブ編はゴム編、リンクス編はパール編の別名。',r:'p.68'},
 {k:'C',x:'平編は、糸使いが同じなら基本組織の中では最も[C]編地になる。',o:['伸びる','厚い','薄い'],a:3,w:'平編は糸使いが同じなら基本組織の中で最も薄い編地。耳まくれしやすく、ランも起こりやすい。',r:'p.68'},
 {k:'D',x:'ゴム編は[D]とも呼ばれる。',o:['リブ編','メリヤス編','リンクス編'],a:1,w:'ゴム編＝リブ編。ウエールごとに表目と裏目が交互する1×1ゴム編が最も基本。',r:'p.68'},
 {k:'E',x:'ゴム編は[E]方向の伸長性が特に大きい組織である。',o:['コース','ワープ','ウエール'],a:1,w:'ゴム編は裏目のウエールが引っ込み表目のウエールが並ぶ構造で、コース方向（よこ方向）の伸長性が特に大きい。袖口・裾に使われる。ウエール方向の伸長性が最も大きいのはパール編。',r:'p.68'},
 {k:'F',x:'ゴム編からは[F]などが誘導される。',o:['シングルコード編','サテン編','ミラノリブ編'],a:3,w:'ミラノリブは3給糸で1循環し、第2・第3給糸にミスを入れて作るゴム編の変化組織。シングルコード編はたて編の基本組織。',r:'p.69'},
 {k:'G',x:'ゴム編からは、ミラノリブ編や[G]などが誘導される。',o:['片畦編','ガータ編','パイル編'],a:1,w:'片畦編はゴム編の一方の針床側にタックを入れた組織（図3−24）。ガータ編はパール編の別名。',r:'p.69'},
 {k:'H',x:'両面編から誘導される変化組織には[H]がある。',o:['表鹿の子編','モックミラノリブ編','ダブルデンビ編'],a:2,w:'両面編から誘導されるのはモックミラノリブとロイヤルインターロック。表鹿の子編は平編から、ダブルデンビ編はたて編の変化組織。',r:'p.69'},
 {k:'I',x:'たて編機では[I]に通された多数のたて糸を、筬で振って編針にかけて編地を編成する。',o:['筬','ガイド','シャットル（杼）'],a:2,w:'たて編機では、ガイド（導糸針）に通された多数のたて糸を筬で振って編針にかけて編成する。I＝ガイド、J＝筬の順番に注意。',r:'p.67'},
 {k:'J',x:'たて編機では、ガイドに通された多数のたて糸を[J]で振って編針にかけて編地を編成する。',o:['筬','シンカー','シャットル（杼）'],a:1,w:'たて糸を振るのは筬（ガイドバー）。シンカーはよこ編機で編目の形成を助ける部品、シャットルは織機の杼。',r:'p.67'},
 {k:'K',x:'たて編機では、[K]を使用することにより二重組織が編成される。',o:['前ヘルドと後ヘルド','前筬と後筬','フロントビームとバックビーム'],a:2,w:'2枚筬（前筬＝フロントバー、後筬＝バックバー）を使うと、両方の筬のたて糸が同時に編針にかかり、厚地で丈夫な生地になる。ハーフトリコット編がその代表。ヘルドは織機の部品。',r:'p.70–71'}
]},
{id:'q8',t:'問8',topic:'織機の分類（開口・よこ入れ）',type:'shared',sections:[
 {roman:'',stem:'織機の分類には、開口機構による分類と、[A]糸の供給機構による分類がある。開口機構による分類は、[B]糸の運動に関係するもので、最も複雑な織物組織には[C]装置が用いられる。[A]糸の供給機構に関する分類は、シャットル（杼）を使う織機と使わない織機がある。シャットル（杼）を使わない無杼織機は、[D]織機、[E]織機、[F]織機などがある。[D]織機の特徴は、空気や水を利用しており、[E]織機は、剣のような長い帯状の器具の先端部で糸を把持し、開口内を往復し、また[F]織機は、グリッパーが開口内を飛走して、よこ入れする。',
  words:['レピア','プレッサー','プロジェクタイル','タペット（カム）','たて','ジェット','よこ','ピッカー','ジャカード'],
  items:[
  {k:'A',a:7,w:'織機の分類は「開口（たて糸を上下に分ける）」と「よこ入れ（よこ糸の供給）」の2系統。シャットルを使うかどうかはよこ糸の供給方法の話。',r:'p.60–61'},
  {k:'B',a:5,w:'開口はたて糸を上下に分けてよこ糸の通り道を作る動作なので、たて糸の運動に関係する。',r:'p.61'},
  {k:'C',a:9,w:'簡単な組織はカムの原理のタペット、ヘルド8枚以上はドビー（30枚程度まで）、それ以上の紋織のような極めて複雑な組織はジャカード式開口装置。',r:'p.61'},
  {k:'D',a:6,w:'ジェット織機は流体の噴流に糸をのせてよこ入れする。水を使うウォータジェット（疎水性の合繊フィラメント向き）と、空気を使うエアジェット（汎用性が高い）がある。',r:'p.61'},
  {k:'E',a:1,w:'レピア織機はレピアと呼ぶアーム状の挿入装置の先端部で糸端をつかみ、開口内を往復してよこ入れする。',r:'p.60'},
  {k:'F',a:3,w:'プロジェクタイル織機（グリッパー織機）は、シャットルの約1/10の質量のグリッパーが糸端を把持して開口内を飛走する。',r:'p.60'}]}
]},
{id:'q9',t:'問9',topic:'三原組織（平織・斜文織・朱子織）',type:'own',items:[
 {k:'A',x:'一般に糸の浮きがもっとも長く、組織点が連続しない織物で糸の浮き方向に光沢がある。',o:['平織','斜文織','朱子織'],a:3,w:'朱子織は組織点（交錯点）が連続せず、糸の浮きが最も長いので、浮いている糸の方向に光沢が出る。',r:'p.57'},
 {k:'B',x:'糸の交錯点が最も多いので、糸が接近しにくい。',o:['平織','斜文織','朱子織'],a:1,w:'平織は交錯点が最も多く糸が接近しにくいため、糸密度は粗いが外観は密に見え、丈夫な布になる。',r:'p.55'},
 {k:'C',x:'この組織の織物に、ブロード、タフタなどがある。',o:['平織','斜文織','朱子織'],a:1,w:'平織の代表例：綿のブロード・ポプリン・金巾・キャラコ・ローン、絹や化合繊のタフタなど。',r:'p.55'},
 {k:'D',x:'完全組織を作るには、少なくとも、たて、よこ各5本が必要である。',o:['平織','斜文織','朱子織'],a:3,w:'朱子織の完全組織はたて・よこ5本以上（例：3飛び5枚）。平織は2本、斜文織は3本以上。',r:'p.57'},
 {k:'E',x:'一般に糸が最も密に並ぶので、織物は厚くなる。',o:['平織','斜文織','朱子織'],a:3,w:'朱子織は交錯点が少なく糸を最も密に並べられるので、厚地で柔らかく、光沢のある織物になる（摩擦には弱い）。',r:'p.57'},
 {k:'F',x:'たてよこ各2本で完全組織をつくる。',o:['平織','斜文織','朱子織'],a:1,w:'平織はたて・よこ各2本で完全組織になる最も単純な組織。',r:'p.55'},
 {k:'G',x:'この組織の織物に、デニム、ギャバジンなどがある。',o:['平織','斜文織','朱子織'],a:2,w:'斜文織（綾織）の例：綿のドリル・デニム、毛のサージ・ギャバジン。',r:'p.56'},
 {k:'H',x:'織物の表面に斜めの線があらわれる。',o:['平織','斜文織','朱子織'],a:2,w:'斜文織の特徴は布面に斜文線（綾線）が現れること。たて・よこの糸数が等しければ45°。',r:'p.56'},
 {k:'I',x:'この組織の織物に、金巾、キャラコなどがある。',o:['平織','斜文織','朱子織'],a:1,w:'金巾（かなきん）・キャラコは平織の綿織物。',r:'p.55'},
 {k:'J',x:'完全組織を作るには、少なくとも、たて、よこ各3本が必要である。',o:['平織','斜文織','朱子織'],a:2,w:'斜文織の完全組織はたて・よこ各3本以上、任意の本数でつくれる。2本＝平織、3本＝斜文織、5本＝朱子織と整理する。',r:'p.56'},
 {k:'K',x:'この組織の織物に、ドスキンなどがある。',o:['平織','斜文織','朱子織'],a:3,w:'朱子織の例：毛織物のドスキン、綿の綿朱子、絹の綸子・緞子など。',r:'p.57'}
]},
{id:'q10',t:'問10',topic:'減量・漂白・染料・捺染・色管理',star:true,type:'tf',items:[
 {k:'A',s1:'ポリエステルの減量加工では、水酸化ナトリウムが用いられる。',s2:'ポリエステルの減量加工では、酵素が用いられる場合もある。',a:2,v1:[1,'ポリエステル織物を10〜20％の水酸化ナトリウム水溶液で加水分解し、質量の5〜25％を減量する（アルカリ減量加工）。'],v2:[0,'酵素減量加工は綿の減量加工。ポリエステルはアルカリで行う。'],r:'p.29, 105'},
 {k:'B',s1:'酸性染料は、アニオン性染料である。',s2:'酸性染料は、セルロース繊維を染色するのに適している。',a:2,v1:[1,'酸性染料は−SO₃⁻基をもつアニオン性染料で、羊毛・絹・ナイロンの−NH₃⁺基とイオン結合する。'],v2:[0,'酸性染料はセルロース繊維にはほとんど染着しない。'],r:'p.108–109, 111'},
 {k:'C',s1:'かせ染めは、先染めか後染めかの分類では、後染めに分類される。',s2:'トップ染めは、糸を染める方法である。',a:4,v1:[0,'かせ染めは糸染め（チーズ染め・かせ染め）の一つで、先染めに分類される。'],v2:[0,'トップ染めは羊毛などのトップ（梳毛工程でできる繊維の束）を円筒状に巻いて染める方法で、糸染めではない。'],r:'p.99, 116–117'},
 {k:'D',s1:'フラットスクリーン捺染において、捺染糊をスクリーン型を通して布面に押し出し印捺するへら状の部品をスキージという。',s2:'フラットスクリーン捺染において、印捺される布は、エンドレスベルト上を止まることなく連続的に動く。',a:2,v1:[1,'スクリーン型の上の捺染糊をスキージでかいて（スキージング）布に印捺する。'],v2:[0,'自動フラットスクリーン捺染ではエンドレスベルトが柄の1ピッチ分ずつ間欠的に移動する。連続的に動くのはロータリスクリーン捺染。'],r:'p.120–122'},
 {k:'E',s1:'L*a*b*表色系で、L*は明度を表す。',s2:'L*a*b*表色系で、a*はプラスの方向になるほど赤みが強い。',a:1,v1:[1,'L*は明るさ（0〜100、大きいほど明るい）。'],v2:[1,'a*はプラス方向ほど赤み、マイナス方向ほど緑み。b*はプラスほど黄み、マイナスほど青み。'],r:'p.128'},
 {k:'F',s1:'ポリエステルと綿の混用織物を酸を用いてオパール加工を行う場合、除去される繊維は綿である。',s2:'オパール加工を行うと、透明感のある模様を得ることができる。',a:1,v1:[1,'耐薬品性の異なる2種の繊維の一方を薬剤で分解・溶解除去する。ポリエステル／綿なら、酸に弱い綿（セルロース）が除去される。'],v2:[1,'片方の繊維を除去した部分が薄く透けて、透明感のある模様になる。'],r:'p.29, 134'},
 {k:'G',s1:'漂白は、精練後も繊維中に存在する微量の色素を、酸化剤や還元剤によって分解除去する工程である。',s2:'蛍光増白は、精練漂白後もわずかに黄褐色に見える布に青紫系の色素を付加させて白く見せる方法である。',a:2,v1:[1,'漂白は精練後も残る微量の色素を化学的に分解して白くする工程。酸化型漂白剤と還元型漂白剤がある。'],v2:[0,'これは青味付け（ブルーイング）の説明。蛍光増白は紫外線を吸収して紫〜青色（400〜450nm）の光を発光させて白く見せる方法。'],r:'p.104–105'},
 {k:'H',s1:'染色現場において通常の色合わせで得られる色見本と染色物の等色はアイソメリズムの関係であり、どのような光源下でも同じ色に見えるので、光源の影響を考慮する必要はない。',s2:'染色処方では、いろいろな染料を配合して使う配合染色が行われる。',a:3,v1:[0,'色合わせの等色は、ある光源下でだけ同じ色に見えるメタメリズムの関係になることが多い。分光反射曲線が全く同じアイソメリズム（絶対等色）ではないので、光源の影響（演色性）を考慮する必要がある。'],v2:[1,'染色処方では複数の染料を配合する配合染色が行われる。'],r:'p.125, 127'}
]},
{id:'q11',t:'問11',topic:'染色加工・機能性加工',star:true,type:'own',items:[
 {k:'A',x:'硫化染料による染色物では、保存中に[A]が発生して繊維をぜい化させることがある。',o:['硫化水素','硫酸','二硫化炭素'],a:2,w:'硫化染料の染色物は、保存中に不安定に結合した硫黄から硫酸が生成し、繊維を著しく脆化させることがある。',r:'p.111'},
 {k:'B',x:'表面に凹型に模様を彫刻した型を用いて捺染を行う方式は、[B]である。',o:['フラットスクリーン捺染','ロータリスクリーン捺染','ローラ捺染'],a:3,w:'ローラ捺染は凹版（表面に模様を彫刻した銅ローラ）による捺染。スクリーン捺染は孔版。',r:'p.120, 122'},
 {k:'C',x:'疎水性の合成繊維に対して親水性の化合物を付与し、汚れても洗濯により除去しやすくする加工は[C]加工である。',o:['ソイルガード','ソイルリリース','はっ水'],a:2,w:'汚れを落ちやすくする加工がソイルリリース（SR）加工。汚れを付きにくくする加工はソイルガード（SG）加工。',r:'p.139'},
 {k:'D',x:'光触媒加工に用いられる代表的な物質には、[D]がある。',o:['二酸化硫黄','二酸化チタン','二硫化炭素'],a:2,w:'光が当たると触媒活性を示す光触媒の代表が二酸化チタン。繊維に付けて抗菌性や消臭性などを与える。',r:'p.140'},
 {k:'E',x:'染料と結合することで、水に不溶の錯体を生成させ、染色物の堅ろう度を増進させる薬剤は[E]である。',o:['フィックス剤','バインダ','分散剤'],a:1,w:'フィックス剤（染色堅ろう度増進剤）は染料と結合して水に不溶の錯体を作るカチオン性の化合物などで、セルロース繊維の染色物の堅ろう度を上げる。',r:'p.114'},
 {k:'F',x:'機能性を付与する加工方法として、浴中の薬剤を繊維との親和力によって吸収させることで行う加工法は、[F]と呼ばれる。',o:['吸尽加工法','プラズマ加工法','コーティング法'],a:1,w:'加工方法の分類：①吸尽加工法（浴中の薬剤を親和力で吸収させる）、②パッド・ドライ・キュア法、③コーティング加工など。',r:'p.135'},
 {k:'G',x:'「化学物質の審査及び製造等の規制に関する法律」の第一種特定化学物質に指定される「ペルフルオロオクタン酸（PFOA）又はその塩」は、[G]に関連する物質である。',o:['親水加工','防しわ加工','はっ水加工'],a:3,w:'PFOAはふっ素化合物。耐久はっ水剤やはつ油剤にはふっ素系樹脂が使われてきたため、はっ水加工に関連する。テキストにPFOAの記載はないので、ふっ素系はっ水剤とセットで覚える。',r:'p.137–139'}
]},
{id:'q12',t:'問12',topic:'前処理・仕上加工・染料と助剤',star:true,type:'own',items:[
 {k:'A',x:'加工糸織編物は、精練時あるいは精練前に熱と機械的もみ作用により弛緩させて、潜在ひずみを除去し、かさ高性と伸縮性を向上させる。',o:['ストレッチ処理','リラックス処理','パディング処理'],a:2,w:'リラックス処理の定義そのまま。加工糸織物ではひずみの緩和と潜在捲縮の発現、強撚糸織物ではしぼ立てが主な目的。',r:'p.100, 104'},
 {k:'B',x:'ねじれてリボン状の扁平な綿繊維の形態がよじれを戻して円形状断面に変化することで光沢が向上することに加え、繊維内部の結晶および非晶構造の変化によって染色性も向上する加工',o:['マーセライズ加工','オーガンジ加工','ザブロ加工'],a:1,w:'マーセライズ加工（シルケット加工）は綿を濃い水酸化ナトリウム水溶液で処理し、光沢・寸法安定性・吸湿性・染色性を向上させる。',r:'p.105–106'},
 {k:'C',x:'世界で最初の合成染料モーブが属しているカチオン性染料で、羊毛を鮮やかな色調に染めるが、耐光堅ろう度が低い。',o:['酸性染料','媒染染料','塩基性染料'],a:3,w:'塩基性染料はカチオン性染料で、世界初の合成染料モーブもこれ。絹や羊毛を鮮やかに染めるが耐光堅ろう度が低く、旧タイプは現在あまり使われない。',r:'p.112'},
 {k:'D',x:'繊維間隙への染色液の侵入を助け、繊維表面を均一に濡らすことで染色むらを抑制するために用いる界面活性剤であり、特に疎水性繊維の場合に多く使用される。',o:['分散剤','促染剤','湿潤剤'],a:3,w:'湿潤剤は繊維間隙に染液が入るのを助け、繊維表面を均一に濡らして染料との接触をむらなくする。',r:'p.114'},

try {
  localStorage.setItem(CUR_KEY + '-test', '1'); localStorage.removeItem(CUR_KEY + '-test'); canSave = true;
  SETS.forEach((s,i)=>{
    const raw = localStorage.getItem(s.skey);
    if (raw) { const d = JSON.parse(raw); if (d && typeof d === 'object') for (const k in d) if (typeof d[k] === 'number') states[i][k] = d[k]; }

  const c = Number(localStorage.getItem(CUR_KEY)); if (c >= 1 && c <= SETS.length) cur = c - 1;

const itemsOf = q => q.sections ? q.sections.flatMap(s=>s.items) : q.items;
function setScore(i){
  let done=0, ok=0, total=0;
  SETS[i].Q.forEach(q=>itemsOf(q).forEach(it=>{ total++; const c=states[i][q.id+'-'+it.k]; if(c!=null){ done++; if(c===it.a) ok++; } }));
  return {done, ok, total, score: done ? Math.round(ok/done*100) : null};
}
function avgScore(){
  const sc = SETS.map((s,i)=>setScore(i)).filter(x=>x.score!=null);
  return sc.length ? Math.round(sc.reduce((n,x)=>n+x.score,0)/sc.length) : null;
}

}
function switchSet(i){
  if (i === cur) return;
  cur = i; Q = SETS[i].Q; state = states[i]; revealAll = false;
  if (resetArmed) { clearTimeout(resetArmed); resetArmed = null; }
  if (canSave) { try { localStorage.setItem(CUR_KEY, String(i+1)); } catch (e) {} }
  try { history.replaceState(null, '', location.pathname + '?set=' + (i+1)); } catch (e) {}
  header(); render(); window.scrollTo(0, 0);
}

function refHTML(r){
  const lk=n=>PG[n]?`<a class="pg" href="https://drive.google.com/file/d/${PG[n]}/view" target="_blank" rel="noopener">p.${n}</a>`:`p.${n}`;
  return String(r).replace(/^p\./,'').split(/,\s*/).map(part=>{
    const mm=part.match(/^(\d+)(?:–(\d+))?(.*)$/); if(!mm) return esc(part);
    const a=+mm[1], b=mm[2]?+mm[2]:a, out=[];
    for(let n=a;n<=b;n++) out.push(lk(n));
    return out.join('')+(mm[3]?`<span class="pnote">${esc(mm[3])}</span>`:'');
  }).join('');
}
function blanks(text, filled){
  return esc(text).replace(/\[([A-L])\]/g,(m,k)=>{
    const f = filled && filled[k];
    return f ? `<span class="blank filled" data-b="${k}">${esc(f)}</span>` : `<span class="blank" data-b="${k}">（${k}）</span>`;
  });
}
function keyOf(q,k){return q.id+'-'+k}

function chipHTML(q,it,opts,numOnly){
  const key = keyOf(q,it.k), ch = state[key], shown = ch!=null || revealAll;
  return `<div class="chips" role="group" aria-label="${q.t} ${it.k} の選択肢">`+opts.map((o,i)=>{
    const n=i+1; let cls='chip'+(numOnly?' num-only':'');
    if(shown && n===it.a) cls+=' right';
    else if(ch===n && n!==it.a) cls+=' wrong';
    const label = numOnly? `<span>${n}</span>` : `<span class="num">${n}</span>${esc(o)}`;
    return `<button type="button" class="${cls}" data-key="${key}" data-n="${n}" ${shown?'disabled':''} ${numOnly?`title="${esc(o)}"`:''}>${label}</button>`;
  }).join('')+`</div>`;
}
function verdict(q,it){
  const ch = state[keyOf(q,it.k)];
  if(ch==null) return '';
  return ch===it.a ? '<span class="verdict ok">正解</span>' : `<span class="verdict ng">不正解（あなたの解答：${ch}）</span>`;
}
function exHTML(q,it,optText){
  const key=keyOf(q,it.k); if(state[key]==null && !revealAll) return '';
  if(q.type==='tf'){
    const mk=v=>v[0]?'<span class="m o">○</span>':'<span class="m x">×</span>';
    return `<div class="ex">${verdict(q,it)} <b>正解 ${it.a}</b>（${TF[it.a-1]}）
      <div class="sv">${mk(it.v1)}<span>① ${esc(it.v1[1])}</span>${mk(it.v2)}<span>② ${esc(it.v2[1])}</span></div>
      <span class="ref">テキスト ${refHTML(it.r)}</span></div>`;
  }
  return `<div class="ex">${verdict(q,it)} <b>正解 ${it.a}　${esc(optText)}</b><p>${esc(it.w)}</p><span class="ref">テキスト ${refHTML(it.r)}</span></div>`;
}

        const head = s.stem ? `<div class="stem">${s.roman?`<span class="roman">${s.roman}.</span>`:''}${blanks(s.stem,filled)}</div>` : (s.roman?`<div class="sec-label">${s.roman}.</div>`:'');
        return `<div class="sec"><div class="stem-wrap">${head}
          <ul class="words">${s.words.map((w,i)=>`<li><b>${i+1}</b>${esc(w)}</li>`).join('')}</ul></div>`+
          s.items.map(it=>`<div class="item"><div class="item-text"><span class="lab">${it.x?it.k+'.':'（'+it.k+'）'}</span>${it.x?esc(it.x):''}</div>${chipHTML(q,it,s.words,true)}${exHTML(q,it,s.words[it.a-1])}</div>`).join('')+'</div>';
      }).join('');
    } else if(q.type==='tf'){
      body = `<p class="tf-key">1：①②とも正しい　2：①正 ②誤　3：①誤 ②正　4：①②とも誤り</p>`+
        q.items.map(it=>`<div class="item"><div class="stmts"><div class="stmt"><span class="lab">${it.k}.</span><span><span class="n">①</span> ${esc(it.s1)}</span></div><div class="stmt"><span></span><span><span class="n">②</span> ${esc(it.s2)}</span></div></div>${chipHTML(q,it,TF,false)}${exHTML(q,it)}</div>`).join('');
    } else {
      body = q.items.map(it=>{
        const filled={}; if(state[keyOf(q,it.k)]!=null||revealAll) filled[it.k]=it.o[it.a-1];
        const txt = it.x.includes('[')? blanks(it.x,filled) : `<span class="lab">${it.k}.</span>${esc(it.x)}`;
        return `<div class="item"><p class="item-text">${it.x.includes('[')?'':''}${txt}</p>${chipHTML(q,it,it.o,false)}${exHTML(q,it,it.o[it.a-1])}</div>`;
      }).join('');
    }
    const items = q.sections? q.sections.flatMap(s=>s.items): q.items;
    const done = items.filter(it=>state[keyOf(q,it.k)]!=null).length;
    const ok = items.filter(it=>state[keyOf(q,it.k)]===it.a).length;
    return `<section class="q" id="${q.id}"><div class="q-head"><h2>${q.t}</h2><span class="topic">${esc(q.topic)}</span>${q.star?'<span class="star">学びのポイント</span>':''}<span class="prog">${ok}/${done} 正解 ・ 全${items.length}問</span></div>${body}</section>`;
  }).join('');
  // nav + score
  let done=0, ok=0;
  document.getElementById('nav').innerHTML = Q.map(q=>{
    const items = q.sections? q.sections.flatMap(s=>s.items): q.items;
    const d = items.every(it=>state[keyOf(q,it.k)]!=null);
    items.forEach(it=>{const c=state[keyOf(q,it.k)]; if(c!=null){done++; if(c===it.a) ok++;}});
    return `<a href="#${q.id}" class="${d?'done':''}">${q.t.replace('問','')}</a>`;
  }).join('');
  document.getElementById('score').innerHTML = `${SETS[cur].no}得点 <b class="pt-big">${done?Math.round(ok/done*100):0}</b>点<span class="sc-sub">（${ok}/${done}問正解）</span>`;
  const total = Q.reduce((n,q)=>n+itemsOf(q).length,0);
  const av = avgScore();
  document.getElementById('sets').innerHTML = SETS.map((s,i)=>{const sc=setScore(i); return `<button type="button" class="set-tab" role="tab" data-set="${i}" aria-selected="${i===cur}">${s.name}<span class="st">${sc.score==null?'未解答':sc.score+'点'}</span></button>`;}).join('') + `<span class="avg">平均 <b>${av==null?'—':av}</b>${av==null?'':'点'}</span>`;
  const setRows = SETS.map((s,i)=>{const sc=setScore(i); return `<tr class="${i===cur?'cur':''}"><th>${s.name}</th><td class="num">${sc.done?sc.ok+' / '+sc.done+'問正解':'未解答'}</td><td class="num">${sc.done+' / '+sc.total+'問解答'}</td><td class="num">${sc.score==null?'—':sc.score+'点'}</td></tr>`;}).join('');
  const counted = SETS.filter((s,i)=>setScore(i).score!=null).map(s=>s.no).join('・');
  const rows = Q.map(q=>{const its=itemsOf(q); const o=its.filter(it=>state[keyOf(q,it.k)]===it.a).length; const dn=its.filter(it=>state[keyOf(q,it.k)]!=null).length; return `<tr><th><a href="#${q.id}">${q.t}</a></th><td class="topic">${esc(q.topic)}</td><td class="num${dn&&o===dn?' full':''}">${dn?o+' / '+dn+'問正解':'未解答'}</td><td class="num">${dn?Math.round(o/dn*100)+'点':'—'}</td></tr>`;}).join('');
  document.getElementById('result').innerHTML = `<h2>現在の得点</h2><div class="big"><b>${av==null?'—':av}</b><span>${av==null?'':'点'}（平均）</span></div><p class="rmeta">${av==null?'まだ解答がありません。':'解答した問題集（'+counted+'）の得点の平均です。'}各問題集の得点は、解いた問題だけで100点満点に換算しています。</p><div class="tbl sets-tbl"><table><tbody>${setRows}<tr class="avg-row"><th>平均</th><td class="num"></td><td class="num"></td><td class="num">${av==null?'—':av+'点'}</td></tr></tbody></table></div><h3>${SETS[cur].name}の問題別（全${total}問中 ${done}問解答・${ok}問正解）</h3><div class="tbl"><table><tbody>${rows}</tbody></table></div>`;
  const rb=document.getElementById('revealAll'); rb.textContent = revealAll ? '元に戻す' : '解答をすべて表示'; rb.classList.toggle('primary',!revealAll); rb.classList.toggle('back',revealAll); rb.setAttribute('aria-pressed',String(revealAll));
  document.getElementById('revealNote').hidden = !revealAll;
  if(!resetArmed) document.getElementById('reset').textContent = SETS[cur].no+'をリセット';
  document.getElementById('saveNote').textContent = canSave ? '押した解答は問題集ごとにこの端末のブラウザに自動で保存され、次に開いたときも続きから解けます（リセットは表示中の問題集だけを消去）。' : 'この環境では解答を保存できません。ページを閉じると解答は消えます。';
}

document.getElementById('main').addEventListener('click',e=>{
  const b=e.target.closest('button.chip'); if(!b||b.disabled) return;
  state[b.dataset.key]=Number(b.dataset.n);
  save();
  const y=b.getBoundingClientRect().top;
  render();
  const nb=document.querySelector(`button.chip[data-key="${b.dataset.key}"]`);
  if(nb){ window.scrollBy(0, nb.getBoundingClientRect().top - y); }
});
document.getElementById('revealAll').addEventListener('click',()=>{revealAll=!revealAll;render();});
document.getElementById('reset').addEventListener('click',e=>{
  if(!resetArmed){ e.currentTarget.textContent='もう一度押すと'+SETS[cur].no+'を消去'; resetArmed=setTimeout(()=>{resetArmed=null; render();},3000); return; }
  clearTimeout(resetArmed); resetArmed=null;
  for(const k in state) delete state[k]; revealAll=false;
  if(canSave){ try{ localStorage.removeItem(SETS[cur].skey); }catch(err){} }
  render();
});
document.getElementById('sets').addEventListener('click',e=>{const b=e.target.closest('.set-tab'); if(b) switchSet(Number(b.dataset.set));});
header();
render();
function setBarH(){const b=document.querySelector('.bar');if(b)document.documentElement.style.setProperty('--barH',b.offsetHeight+'px');}
setBarH();window.addEventListener('resize',setBarH);
</script>

</body>
</html>
