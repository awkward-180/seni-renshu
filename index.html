const ORIG = {"1": {"q1": {"ins": "次の記述内A～Lの（　）内に、各々の語群の中から最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "（ ）", "html": false, "secs": [{"lab": "Ⅰ", "text": "羊毛は、表皮部分に[A]があり、主要部のケラチンの構成アミノ酸の違い等により、[B]がクリンプの外側に[C]が内側となるバイラテラル構造となっている。", "keys": ["A", "B", "C"], "words": ["スケール", "セルロース", "パラコルテックス", "ベータテックス", "メタコルテックス", "オルソコルテックス"]}, {"lab": "Ⅱ", "text": "合成繊維の原材料であるポリマーは、一般に分子量が[D]程度以上の化合物であり、基本となる化合物が鎖状に連なった構造をしている。ナイロン66はヘキサメチレンジアミンとアジピン酸を[E]により重合したものであり、ポリアクリロニトリルはアクリロニトリルを[F]により重合したものである。", "keys": ["D", "E", "F"], "words": ["1,000", "10,000", "100,000", "重縮合", "付加重合", "開環重合", "解重合"]}, {"lab": "Ⅲ", "text": "複数のポリマーを一つの紡糸ノズルから押し出して繊維化した繊維の総称を[G]といい、毛のバイラテラル構造を模倣した[H]や極細繊維の原料となる[I]などが製造されている。また、円形以外のノズルを用いて製造される繊維を[J]といい、練絹の断面形状である[K]を模倣し、摩擦係数を増大させることにより[L]を再現した繊維も製造されている。", "keys": ["G", "H", "I", "J", "K", "L"], "words": ["混合繊維", "異型断面繊維", "コンジュゲート繊維", "サイドバイサイド型繊維", "芯鞘型繊維", "海島型繊維", "偏平断面", "三角断面", "中空断面", "キシミ感", "吸湿性", "保温性"]}], "opts": {}, "wl": "［語群］"}, "q2": {"ins": "次の記述内［A］～［H］の後ろの（　）内に示す語句の中から最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "破断するまでのエネルギーが[A]（1．大きい　2．小さい　3．変化しない）繊維は強靭であるといえる。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "一般的な化学繊維では、長く連続した状態のまま使う[B]（1．チョップ　2．ステープル　3．フィラメント）から作られる糸がある。", "keys": ["B"]}, {"lab": "Ⅲ", "text": "綿繊維はアオイ科ワタ植物の種子の[C]（1．筋　2．幹　3．表皮）細胞が、細長く成長したものであり、その繊維断面には、[D]（1．ルクス　2．ルーメン　3．ブラン）が存在する。", "keys": ["C", "D"]}, {"lab": "Ⅳ", "text": "ポリエステルやナイロンなどの合成繊維では、紡糸後は繊維内部の分子の配向や結晶が乱れた状態であり、十分な強さを与えるため[E]（1．固化　2．延伸　3．凝固）工程が必要である。", "keys": ["E"]}, {"lab": "Ⅴ", "text": "炭素繊維には、ポリアクリロニトリル（PAN）系の繊維と[F]（1．ペタ　2．メタ　3．ピッチ）系の繊維がある。", "keys": ["F"]}, {"lab": "Ⅵ", "text": "モヘヤとは[G]（1．アンゴラ山羊　2．アンゴラうさぎ　3．アンゴラフェレット）の毛であり、メリノ羊毛より[H]（1．細くてソフトな　2．太くてハリがある　3．ピリングが起こりやすい）ことが特徴である。", "keys": ["G", "H"]}], "opts": {"A": ["大きい", "小さい", "変化しない"], "B": ["チョップ", "ステープル", "フィラメント"], "C": ["筋", "幹", "表皮"], "D": ["ルクス", "ルーメン", "ブラン"], "E": ["固化", "延伸", "凝固"], "F": ["ペタ", "メタ", "ピッチ"], "G": ["アンゴラ山羊", "アンゴラうさぎ", "アンゴラフェレット"], "H": ["細くてソフトな", "太くてハリがある", "ピリングが起こりやすい"]}}, "q3": {"ins": "次のA～Eの記述に最も関係が深いものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "", "html": false, "secs": [{"lab": "A．", "text": "2本の繊維をループ状にして、引張り試験をしたときの強さ\n（1．結節強さ　2．引掛け強さ　3．折曲げ強さ）", "keys": ["A"]}, {"lab": "B．", "text": "毛の表面にあるスケールの影響で、羊毛の織・編物が湿潤状態で揉まれると発生する現象\n（1．捲縮化　2．フィブリル化　3．フェルト化）", "keys": ["B"]}, {"lab": "C．", "text": "直径が17～21 μmの、一般的な太さの羊毛\n（1．ファインウール　2．ブロードウール　3．ストロングウール）", "keys": ["C"]}, {"lab": "D．", "text": "酸化銅アンモニア溶液に溶解して製造される、再生繊維キュプラの主原料\n（1．木材パルプ　2．コットンリンタ　3．ナフサ）", "keys": ["D"]}, {"lab": "E．", "text": "乾燥前の質量を基準とし、繊維中に含まれる水分量を割合で示した値\n（1．水分率　2．含水率　3．吸水率）", "keys": ["E"]}], "opts": {"A": ["結節強さ", "引掛け強さ", "折曲げ強さ"], "B": ["捲縮化", "フィブリル化", "フェルト化"], "C": ["ファインウール", "ブロードウール", "ストロングウール"], "D": ["木材パルプ", "コットンリンタ", "ナフサ"], "E": ["水分率", "含水率", "吸水率"]}}, "q4": {"ins": "次の記述内［A］～［I］の後ろの（　）内に示す語句の中から最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "綿糸で、カーディング工程の後、短い繊維を積極的に除去して製造した糸のことを[A]（1．カード糸　2．インターレース糸　3．コーマ糸）という。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "毛糸のうち、短繊維を取り除き毛足の長い原毛を引き揃えて製造した糸のことを[B]（1．梳毛糸　2．紡毛糸　3．モール糸）という。", "keys": ["B"]}, {"lab": "Ⅲ", "text": "蚕により作られた繭から糸を解じょし、数本束ねて1本の糸を作る工程を[C]（1．精練　2．製糸　3．絹紡糸）といい、この工程により製造した絹糸のことを[D]（1．練絹　2．繭糸　3．生糸）と呼ぶ。", "keys": ["C", "D"]}, {"lab": "Ⅳ", "text": "2種類以上の短繊維同士を組み合わせて混合し紡績した糸のことを[E]（1．混紡糸　2．混繊糸　3．交撚糸）という。", "keys": ["E"]}, {"lab": "Ⅴ", "text": "フィラメント糸の加工法において、繊維形態をゆるやかなカール形状にすることで中程度の伸縮性とかさ高性を付与する加工法を[F]（1．擦過法　2．加撚－熱固定－解撚法　3．押し込み法）と呼ぶ。", "keys": ["F"]}, {"lab": "Ⅵ", "text": "飾り糸において、芯糸のまわりにからみ糸をループ状に形成させ、ループの撚り戻りによりツノ状にした糸を[G]（1．ノップヤーン　2．スラブヤーン　3．スナールヤーン）という。", "keys": ["G"]}, {"lab": "Ⅶ", "text": "スリットしたフィルムをフィブリル化するまで延伸した後に衝撃を加え、細い繊維に分割することで作られる糸を[H]（1．ネップヤーン　2．スプリットヤーン　3．スリットヤーン）という。", "keys": ["H"]}, {"lab": "Ⅷ", "text": "特殊な構造の糸として、ポリウレタンなどのフィラメントを芯糸にし、他の紡績糸またはフィラメントを巻き付けた糸を[I]（1．コアヤーン　2．ラッピングヤーン　3．カバードヤーン）という。", "keys": ["I"]}], "opts": {"A": ["カード糸", "インターレース糸", "コーマ糸"], "B": ["梳毛糸", "紡毛糸", "モール糸"], "C": ["精練", "製糸", "絹紡糸"], "D": ["練絹", "繭糸", "生糸"], "E": ["混紡糸", "混繊糸", "交撚糸"], "F": ["擦過法", "加撚－熱固定－解撚法", "押し込み法"], "G": ["ノップヤーン", "スラブヤーン", "スナールヤーン"], "H": ["ネップヤーン", "スプリットヤーン", "スリットヤーン"], "I": ["コアヤーン", "ラッピングヤーン", "カバードヤーン"]}}, "q5": {"ins": "次の記述内A～Jの（　）内に、下記の語群の中から最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "（ ）", "html": false, "secs": [{"lab": "", "text": "　糸は、[A]による分類と[B]による分類、製造・加工方法などによる分類がある。\n[A]においては、[C]糸、毛糸、麻糸、[D]糸などの天然繊維があり、化学繊維の中には、レーヨン糸に使われる[E]繊維、アセテート糸に使われる[F]繊維があり、そしてナイロン糸、ポリエステル糸、[G]糸などに使われる[H]繊維がある。\n　次に[B]に目を向けると、[I]糸と[J]糸がある。\n　天然繊維の[D]糸は、[I]糸と[J]糸の両方あるが、他の天然繊維は、[I]糸しかない。", "keys": ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"], "words": ["絹", "フィラメント", "アクリル", "繊維の形態", "半合成", "綿", "再生", "紡績", "原料繊維", "合成"]}], "opts": {}, "wl": "［語群］"}, "q6": {"ins": "次の記述内A～Kの（　）内に、各々の語群の中から最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "（ ）", "html": false, "secs": [{"lab": "Ⅰ", "text": "　繊維束に撚りをかけるとき、下端を固定し上端を時計回りに回転させる[A]とその逆に回転させる[B]がある。また、撚り数とともに糸の空隙率は変化し、小さい順に[C]、並撚り糸、[D]となる。糸を撚ることにより強さを増す理由は、糸を構成している繊維相互の[E]が大きくなるからである。", "keys": ["A", "B", "C", "D", "E"], "words": ["R撚り", "甘撚り糸", "S撚り", "摩擦力", "強撚糸", "応力", "Z撚り"]}, {"lab": "Ⅱ", "text": "　衣服や装飾に用いられる材料には種々あるが、多くは繊維の集合体である[F]と、[G]類に分けられる。[F]のうち、糸をたて、よこに用いて、原則として互いに直角かつ上下に一定の規則にしたがって組織させたものを[H]、糸のループの連結により構成されたものを[I]、さらに3本以上の糸または糸束を斜めに交差させ、紐状・帯状に作ったものを[J]という。この他には、シート状のウェブをからませたり、接着させたりして製造される[K]がある。\n　「雑貨工業品品質表示規程」では[G]を製品の全部または一部に使用して製造した製品は雑貨工業品となる。", "keys": ["F", "G", "H", "I", "J", "K"], "words": ["組物", "布", "編物", "不織布", "網", "革", "レース", "織物", "ネット", "綱"]}], "opts": {}, "wl": "［語群］"}, "q7": {"ins": "次のA～Gの記述について、①②の両方が正しい場合には『1』、①が正しく②が間違っている場合には『2』、①が間違っており②が正しい場合には『3』、①②の両方が間違っている場合には『4』を解答記入欄にマークしなさい。", "type": "tf", "bl": "", "html": false, "tf": {"A": ["平織は糸の交錯点が最も多いので、糸が接近しにくく、糸密度は粗いが外観は密に見え、丈夫な布を得やすい。", "斜文織の特徴は布面に斜め方向の斜文線が現れることである。"], "B": ["完全組織内のたて、よこの糸数が等しい場合の斜文線の方向は組織図上で60°の角度をなす。", "斜文織物はたて糸、よこ糸の浮きが平織より長く、交錯点が少ないので、糸密度を大きくできる。"], "C": ["二重織はパイル織物を作る際に利用される。", "からみ組織は糸と糸をからませて織るので、透け柄があっても目寄れを起こしにくい。"], "D": ["織物では、カバーファクタが小さいほど隙間が小さい。", "編物のカバーファクタは、糸が太いほど、ループが小さいほど値が小さくなる。"], "E": ["充填率の大きい織物は、生地がしまっていて風合いがかたい。", "ゴム編は平編に比べて大きい含気率をもっている。"], "F": ["編物は構造的に多孔であるため、通気性に優れている。", "編物は構造的に含気率が小さいため、無風時の保温性は高い。"], "G": ["摩擦回数が増加すると、羊毛では発生したピルが次第に脱落して減少するが、ポリエステルは脱落しにくいため減少しにくい。", "紡績糸使いの素材では、一般的に編物より織物の方がピルを生じやすい。"]}}, "q8": {"ins": "次の記述内［A］～［G］の後ろの（　）内に示す語句の中から最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "編物において、よこ編の基本組織は、平編、ゴム編、[A]（1．パール編　2．シングルアトラス編　3．両面編）である。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "織物の引裂き破壊は、[B]（1．タング　2．デル　3．テール）と呼ばれる部分を起点として、伝播的に荷重が作用して糸の切断が進行する。同じ糸使いであれば、斜子織の引裂き強さは、平織の引裂き強さと比較して[C]（1．差がない　2．小さい　3．大きい）。", "keys": ["B", "C"]}, {"lab": "Ⅲ", "text": "曲げ特性のうち[D]（1．曲げ剛性　2．曲げ戻り性　3．曲げ伸び性）に対する寄与が大きいものは、繊維の初期引張り抵抗度と、糸の太さ、織編物の密度である。\n[E]（1．曲げ剛性　2．曲げ戻り性　3．曲げ伸び性）には、繊維の粘弾性的な性質の他に糸と糸の交差する点での接触圧力の影響もある。", "keys": ["D", "E"]}, {"lab": "Ⅳ", "text": "繊維同士の摩擦により一番高く帯電しやすい組み合わせは[F]（1．羊毛 － 絹　2．ナイロン － ポリエステル　3．レーヨン － 綿）である。", "keys": ["F"]}, {"lab": "Ⅴ", "text": "布の力学特性は風合いと関係が深い。風合いの物理的因子における用語の組み合わせとして最も適した組み合わせは[G]（1．曲げ変形 － バイアス方向に引張る　2．圧縮変形 － 厚み方向に押さえる　3．伸長変形 － 両端をもって曲げる）である。", "keys": ["G"]}], "opts": {"A": ["パール編", "シングルアトラス編", "両面編"], "B": ["タング", "デル", "テール"], "C": ["差がない", "小さい", "大きい"], "D": ["曲げ剛性", "曲げ戻り性", "曲げ伸び性"], "E": ["曲げ剛性", "曲げ戻り性", "曲げ伸び性"], "F": ["羊毛 － 絹", "ナイロン － ポリエステル", "レーヨン － 綿"], "G": ["曲げ変形 － バイアス方向に引張る", "圧縮変形 － 厚み方向に押さえる", "伸長変形 － 両端をもって曲げる"]}}, "q9": {"ins": "次の記述内［A］～［F］の後ろの（　）内に示す語句の中から最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "　不織布の製造において、短繊維を水中に均一に分散し、シート状に集積してウェブを結合する方法を[A]（1．乾式法　2．湿式法　3．カーディング法）という。また、ウェブの接着方法において、化学的接着法にあてはまらないものは[B]（1．カレンダ法　2．レジンボンド法　3．スプレー法）である。", "keys": ["A", "B"]}, {"lab": "Ⅱ", "text": "　紡糸機から出たフィラメントを熱風により吹き飛ばした後、ウェブを形成し、シート状に積層して結合する[C]（1．スパンボンド不織布　2．メルトブローン不織布　3．ステッチボンド不織布）では、極細繊維による不織布の生産が可能である。", "keys": ["C"]}, {"lab": "Ⅲ", "text": "　天然皮革に外観や風合いを近づけるなどの工夫をし、内部構造も天然皮革に準じたものを目指して模造したものを[D]（1．合成皮革　2．人工皮革　3．擬皮革）といい、その基材には[E]（1．不織布　2．織物　3．編物）が利用される。", "keys": ["D", "E"]}, {"lab": "Ⅳ", "text": "　革の仕上げによる種類において、鹿の革の銀面をサンドペーパーで擦って起毛させたものを[F]（1．エンボス革　2．スエード　3．バックスキン）という。", "keys": ["F"]}], "opts": {"A": ["乾式法", "湿式法", "カーディング法"], "B": ["カレンダ法", "レジンボンド法", "スプレー法"], "C": ["スパンボンド不織布", "メルトブローン不織布", "ステッチボンド不織布"], "D": ["合成皮革", "人工皮革", "擬皮革"], "E": ["不織布", "織物", "編物"], "F": ["エンボス革", "スエード", "バックスキン"]}}, "q10": {"ins": "次のA～Gの記述について、①②の両方が正しい場合には『1』、①が正しく②が間違っている場合には『2』、①が間違っており②が正しい場合には『3』、①②の両方が間違っている場合には『4』を解答記入欄にマークしなさい。", "type": "tf", "bl": "", "html": false, "tf": {"A": ["絹の精練は、生糸の表面を被覆しているフィブロインをほぼ除去することである。", "絹の精練では、セルラーゼによる酵素精練が行われている。"], "B": ["漂白剤は、酸化型漂白剤と還元型漂白剤があり、一般的には後者が広く使われている。", "過酸化水素漂白は、布に鉄サビなどの鉄分が付着していると、その部分で過酸化水素の分解が進んでピンホールの損傷が起こりやすい。"], "C": ["バット染料は、水不溶性で、各種堅ろう度が一般的に良好である。", "金属錯塩酸性染料は、アニオン性で、金属が配位結合され、耐光など堅ろう度が高く、色は鮮やかである。"], "D": ["顔料を繊維上に固定するためには、バインダーといわれる接着剤が必要である。", "繊維着色用として使われる有機顔料は、無機顔料と比べて耐光性、耐熱性が高いものが多い。"], "E": ["防汚加工のうち、汚れを落ちやすくする加工をソイルリリース加工という。", "防汚加工のうち、汚れがつきにくくする加工をソイルガード加工という。"], "F": ["繊維製品は様々な分光特性を持つ光源下で使用されるため、演色性には気をつける必要がある。", "アイソメリズムは、特定の光源下で同じ色に見えることをいう。"], "G": ["潜在ひずみを除去し、かさ高性と伸縮性を向上させる処理をリラックス処理という。", "フェルト化の効果により、組織を緻密にする処理を縮じゅうという。"]}}, "q11": {"ins": "次の記述内A～Jの（　）内に、各々の語群の中から最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "（ ）", "html": false, "secs": [{"lab": "Ⅰ", "text": "水溶性の染料は、水によく溶けるため湿潤堅ろう度は低いが、耐ドライクリーニング性は高い。また、塩となっているため[A]が問題になることはない。\n（1．光堅ろう度　2．摩擦堅ろう度　3．昇華堅ろう度）", "keys": ["A"]}, {"lab": "Ⅱ", "text": "直接、反応、バットの各染料で、綿を染める際の無機電解質や、酸性染料で、羊毛、絹、ナイロンを染める際の酸を[B]という。\n（1．促染剤　2．分散剤　3．緩染剤）", "keys": ["B"]}, {"lab": "Ⅲ", "text": "還元抜染剤は、主として直接染料、反応染料、分散染料などの[C]系染料に適用可能で、還元により[C]基を切断して無色とする。\n（1．インジゴイド　2．アゾ　3．アントラキノン）", "keys": ["C"]}, {"lab": "Ⅳ", "text": "色合わせの方法として、実際の染色においては配合染色が行われる。染め足などと呼ばれる染色速度の近似した染料同士で染色処方を組むと、色の[D]が高まる。\n（1．演色性　2．再現性　3．三属性）", "keys": ["D"]}, {"lab": "Ⅴ", "text": "色見本に近似する過去に染めた色を既存データから検索する方法は、[E]とも呼ばれ、コンピュータカラーマッチング（CCM）と同様に、色合わせの合理化につながっている。\n（1．コンピュータカラーセッティング（CCS）\n　2．コンピュータカラーサーチング（CCS）\n　3．コンピュータレシピサーチング（CRS））", "keys": ["E"]}, {"lab": "Ⅵ", "text": "蛍光増白は[F]方法である。\n（1．黄褐色の補色である青紫系の色素を付加させて白く見せる\n　2．紫外線を放射して一般に紫～青色、400～450 nmの光を発光させる\n　3．紫外線を吸収して一般に紫～青色、400～450 nmの光を発光させる）", "keys": ["F"]}, {"lab": "Ⅶ", "text": "あらかじめ分散染料インクで印刷した紙を用いて、ポリエステル織編物に圧着して熱処理する一連の方法を[G]という。\n（1．インクジェットプリント　2．サーモゾル染色　3．転写捺染）", "keys": ["G"]}, {"lab": "Ⅷ", "text": "ザプロ加工は、ザ・ウールマーク・カンパニーが開発した羊毛の防炎加工で羊毛がアニオン化した金属錯塩を吸収する性質を利用し、[H]の錯塩を付着させることにより耐熱性を高める。\n（1．リンやハロゲン　2．リンやアルミニウム　3．ジルコニウムやチタン）", "keys": ["H"]}, {"lab": "Ⅸ", "text": "整経に必要な総本数のたて糸を分けて束にし、連続的に染色する方法を[I]とよび、主としてデニムのたて糸をインジゴで染めるのに用いられている。\n（1．ワープビーム染色　2．ロープ染色　3．マフ染色）", "keys": ["I"]}, {"lab": "Ⅹ", "text": "拡布状で染液中のガイドロールを通して、2本のローラ間で交互に巻き取りながら染色を行う方法を[J]という。\n（1．ジッガ染色　2．ウィンス染色　3．パッドスチーム染色）", "keys": ["J"]}], "opts": {"A": ["光堅ろう度", "摩擦堅ろう度", "昇華堅ろう度"], "B": ["促染剤", "分散剤", "緩染剤"], "C": ["インジゴイド", "アゾ", "アントラキノン"], "D": ["演色性", "再現性", "三属性"], "E": ["コンピュータカラーセッティング（CCS）", "コンピュータカラーサーチング（CCS）", "コンピュータレシピサーチング（CRS）"], "F": ["黄褐色の補色である青紫系の色素を付加させて白く見せる", "紫外線を放射して一般に紫～青色、400～450 nmの光を発光させる", "紫外線を吸収して一般に紫～青色、400～450 nmの光を発光させる"], "G": ["インクジェットプリント", "サーモゾル染色", "転写捺染"], "H": ["リンやハロゲン", "リンやアルミニウム", "ジルコニウムやチタン"], "I": ["ワープビーム染色", "ロープ染色", "マフ染色"], "J": ["ジッガ染色", "ウィンス染色", "パッドスチーム染色"]}}, "q12": {"ins": "次のA～Hの記述に最も関係が深いものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "", "html": false, "secs": [{"lab": "A．", "text": "起毛は、布面から毛羽をかき出し、毛羽立たせる仕上げで、この方法による起毛は、主にたて糸が毛羽立ち毛足は短くなる。ピーチスキン調仕上げに用いられている。\n（1．針布起毛　2．エメリ起毛　3．あざみ起毛）", "keys": ["A"]}, {"lab": "B．", "text": "耐薬品性の異なる2種の繊維を混用した織物に薬剤を印捺して、片方の繊維を分解または溶解除去して透明感のある模様を得る加工\n（1．オパール加工　2．オーガンジ加工　3．リップル加工）", "keys": ["B"]}, {"lab": "C．", "text": "綿などのセルロース繊維またはその混紡織物に樹脂加工を応用して耐久性のあるプリーツ性、ウォッシュ・アンド・ウエア性を付与する加工で、プレキュア法とポストキュア法とがある。\n（1．防しわ加工　2．パーマネントプレス加工　3．シルケット加工）", "keys": ["C"]}, {"lab": "D．", "text": "繊維の種類と目的に合わせて各種の界面活性剤、シリコーンやポリエチレンの乳化物などを用いて生地を処理し、繊維間の摩擦抵抗を減少させる。この他、揉みや叩きなどの機械的作用を用いる方法もある。\n（1．クリアカット仕上げ　2．柔軟仕上げ　3．光沢仕上げ）", "keys": ["D"]}, {"lab": "E．", "text": "生地をラバーベルトなどに添わせ、予想される収縮に相当するだけ、たて方向に積極的に押し込んで仕上げる方法で、主に綿の織物などに適用され、寸法安定性を保証する方法である。\n（1．ウォッシュ・アンド・ウエア方式　2．ポストキュア方式　3．サンフォライズ方式）", "keys": ["E"]}, {"lab": "F．", "text": "綿織物およびポリエステル・綿混織物を薬液に浸せきし、緊張下で加熱あるいは蒸気処理をするもので、薬剤が綿繊維内部まで深く浸透し、結晶および非晶構造を変化させる。加工・処理効果としては、強さ、寸法セット性、防しわ性、防縮性、風合いの向上がある。\n（1．減量加工　2．カレンダ加工　3．液体アンモニア処理）", "keys": ["F"]}, {"lab": "G．", "text": "水不溶性でそのままで繊維を染めることはできない。アルカリとハイドロサルファイトで還元して、水溶性のロイコ塩（染料アニオン）とし染色する。染色後、酸化により繊維上に不溶性の染料が復元するので、湿潤堅ろう度は高い。\n（1．建染染料の染色機構　2．カチオン染料の染色機構　3．分散染料の染色機構）", "keys": ["G"]}, {"lab": "H．", "text": "繊維の吸湿性は化学構造によるので、合成繊維に後加工で吸湿性を付与するために化学反応により繊維の化学構造にヒドロキシ基、カルボキシ基などを導入するなどの方法がとられる。吸水性は繊維の表面状態の影響が大きいため、繊維表面に加工剤を付与する方法がある。\n（1．疎水性繊維の透湿加工　2．疎水性繊維の親水加工　3．親水性繊維の防水加工）", "keys": ["H"]}], "opts": {"A": ["針布起毛", "エメリ起毛", "あざみ起毛"], "B": ["オパール加工", "オーガンジ加工", "リップル加工"], "C": ["防しわ加工", "パーマネントプレス加工", "シルケット加工"], "D": ["クリアカット仕上げ", "柔軟仕上げ", "光沢仕上げ"], "E": ["ウォッシュ・アンド・ウエア方式", "ポストキュア方式", "サンフォライズ方式"], "F": ["減量加工", "カレンダ加工", "液体アンモニア処理"], "G": ["建染染料の染色機構", "カチオン染料の染色機構", "分散染料の染色機構"], "H": ["疎水性繊維の透湿加工", "疎水性繊維の親水加工", "親水性繊維の防水加工"]}}}, "2": {"q1": {"ins": "次の記述内の[A]～[J]の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "[]", "html": false, "secs": [{"lab": "Ⅰ", "text": "天然繊維である苧麻の繊維長は[A]（1．25～30 mm　2．40～50 mm　3．70～280 mm）程度で、太さ（幅）は[B]（1．10～15 μm　2．15～25 μm　3．25～75 μm）程度である。", "keys": ["A", "B"]}, {"lab": "Ⅱ", "text": "羊毛繊維において、異なる構成アミノ酸組成からなるパラコルテックスとオルソコルテックスの2層が貼り合わさった構造のことを[C]（1．ミセル構造　2．バイラテラル構造　3．コアシース構造）といい、クリンプの原因になっている。", "keys": ["C"]}, {"lab": "Ⅲ", "text": "中心を空洞にした中空繊維では[D]（1．耐熱性　2．はっ水性　3．保温性）が向上する。", "keys": ["D"]}, {"lab": "Ⅳ", "text": "植物繊維であるカポックは[E]（1．種子毛繊維　2．靭皮繊維　3．葉脈繊維）に分類される。", "keys": ["E"]}, {"lab": "Ⅴ", "text": "化学繊維の製法には、主に3つの方法があり、紡糸速度や生産性が高いのは[F]（1．湿式紡糸　2．乾式紡糸　3．溶融紡糸）である。また、アセテートは[G]（1．湿式紡糸　2．乾式紡糸　3．溶融紡糸）により製造されている。", "keys": ["F", "G"]}, {"lab": "Ⅵ", "text": "アセテート繊維とは、セルロースの－OH基（ヒドロキシ基）を[H]（1．メチル基　2．アセトキシ基　3．アミノ基）に置き換えた半合成繊維のことである。アセテートは、綿やレーヨンと比較して[I]（1．吸湿性が高い　2．水による膨潤性が高い　3．水による収縮が小さい）。", "keys": ["H", "I"]}, {"lab": "Ⅶ", "text": "吸湿性がなく耐熱性が低い水に浮く合成繊維には[J]（1．ポリプロピレン　2．ポリエステル　3．ポリアミド）がある。", "keys": ["J"]}], "opts": {"A": ["25～30 mm", "40～50 mm", "70～280 mm"], "B": ["10～15 μm", "15～25 μm", "25～75 μm"], "C": ["ミセル構造", "バイラテラル構造", "コアシース構造"], "D": ["耐熱性", "はっ水性", "保温性"], "E": ["種子毛繊維", "靭皮繊維", "葉脈繊維"], "F": ["湿式紡糸", "乾式紡糸", "溶融紡糸"], "G": ["湿式紡糸", "乾式紡糸", "溶融紡糸"], "H": ["メチル基", "アセトキシ基", "アミノ基"], "I": ["吸湿性が高い", "水による膨潤性が高い", "水による収縮が小さい"], "J": ["ポリプロピレン", "ポリエステル", "ポリアミド"]}}, "q2": {"ins": "次の記述内の[A]～[H]の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "[]", "html": false, "secs": [{"lab": "Ⅰ", "text": "繊維は一般的に吸湿により引張り強さは低下するが、[A]（1．綿・麻　2．ポリエステル　3．ビニロン）は湿潤すると、引張り強さは増加する。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "繊維の断面を円と仮定した場合、繊維の曲げ剛性は、繊維の直径の[B]（1．2乗　2．3乗　3．4乗）と初期引張り抵抗度の[C]（1．積に比例する　2．差に等しい　3．積に反比例する）。", "keys": ["B", "C"]}, {"lab": "Ⅲ", "text": "合成繊維を構成する高分子のガラス転移温度は[D]（1．水分があると上昇する　2．水分があると低下する　3．水分があっても変化しない）。", "keys": ["D"]}, {"lab": "Ⅳ", "text": "親水基を含む化合物やポリマーを合成繊維の繊維内部や繊維表面に導入することで、吸湿性だけでなく、[E]（1．はっ水性　2．制電性　3．帯電性）を付与することができる。\n吸水・吸汗性を高めるには[F]（1．繊維の表面積の低下　2．繊維の極細化　3．繊維側面の多孔化）は不適当である。", "keys": ["E", "F"]}, {"lab": "Ⅴ", "text": "ベンゼン環を含まない屈曲性の高分子で、工業的にゲル紡糸・超延伸により得られる高強度・高弾性率の繊維として[G]（1．ポリアリレート繊維　2．ポリエステル繊維　3．超高分子量ポリエチレン繊維）が知られている。", "keys": ["G"]}, {"lab": "Ⅵ", "text": "引張り強さや引張り弾性率は炭素繊維と同程度で、難燃性や耐熱性が高く、熱分解温度は650℃程度で、限界酸素指数〔燃えにくさの指標〕が合成繊維の中でも高い繊維として[H]（1．ポリパラフェニレンベンゾビスオキサゾール（PBO）繊維　2．ポリパラフェニレンテレフタラミド（PPTA）系繊維　3．ポリフェニレンサルファイド（PPS）繊維）が知られている。", "keys": ["H"]}], "opts": {"A": ["綿・麻", "ポリエステル", "ビニロン"], "B": ["2乗", "3乗", "4乗"], "C": ["積に比例する", "差に等しい", "積に反比例する"], "D": ["水分があると上昇する", "水分があると低下する", "水分があっても変化しない"], "E": ["はっ水性", "制電性", "帯電性"], "F": ["繊維の表面積の低下", "繊維の極細化", "繊維側面の多孔化"], "G": ["ポリアリレート繊維", "ポリエステル繊維", "超高分子量ポリエチレン繊維"], "H": ["ポリパラフェニレンベンゾビスオキサゾール（PBO）繊維", "ポリパラフェニレンテレフタラミド（PPTA）系繊維", "ポリフェニレンサルファイド（PPS）繊維"]}}, "q3": {"ins": "次の記述内の[A]～[G]の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "[]", "html": false, "secs": [{"lab": "Ⅰ", "text": "繊維に引張り荷重を加えていくと、繊維は伸びる。荷重と伸びの関係を示した図を、[A]（1．荷重－伸長曲線　2．負荷－伸び曲線　3．伸長伝達曲線）という。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "荷重の単位としては[B]（1．N（ニュートン）　2．J（ジュール）　3．Pa（パスカル））を用いる。", "keys": ["B"]}, {"lab": "Ⅲ", "text": "繊維にかかる荷重を[C]（1．単位伸びあたりの力　2．単位断面積あたりの力　3．単位荷重当たりの伸び）に変換した値を、応力と呼ぶ。", "keys": ["C"]}, {"lab": "Ⅳ", "text": "応力は[D]（1．N（ニュートン）　2．J（ジュール）　3．Pa（パスカル））で表す。", "keys": ["D"]}, {"lab": "Ⅴ", "text": "繊維の伸びを荷重前の試料長（初期長）で除した値を[E]（1．尖度　2．弾性度　3．ひずみ）と呼ぶ。", "keys": ["E"]}, {"lab": "Ⅵ", "text": "一般に繊維の変形による応力変化は時間依存性を示し、一定の伸びを与えておくと、応力は時間とともに減少する。これを[F]（1．応力緩和　2．クリープ　3．内部緩和）と呼ぶ。", "keys": ["F"]}, {"lab": "Ⅶ", "text": "一定応力のもとで繊維の伸びは、時間とともに徐々に増加する。これを[G]（1．応力緩和　2．クリープ　3．遅延緩和）と呼ぶ。", "keys": ["G"]}], "opts": {"A": ["荷重－伸長曲線", "負荷－伸び曲線", "伸長伝達曲線"], "B": ["N（ニュートン）", "J（ジュール）", "Pa（パスカル）"], "C": ["単位伸びあたりの力", "単位断面積あたりの力", "単位荷重当たりの伸び"], "D": ["N（ニュートン）", "J（ジュール）", "Pa（パスカル）"], "E": ["尖度", "弾性度", "ひずみ"], "F": ["応力緩和", "クリープ", "内部緩和"], "G": ["応力緩和", "クリープ", "遅延緩和"]}}, "q4": {"ins": "次のA～Jの記述に最も関係が深いものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "", "html": false, "secs": [{"lab": "Ⅰ", "text": "", "keys": ["A", "B", "C", "D", "E"], "words": ["トウ紡績", "ミュール紡績", "オープンエンド紡績", "カード糸", "コーマ糸", "梳毛糸", "紡毛糸", "混繊糸", "絹紡糸", "トラベラ", "リング", "ドラフトローラー"]}, {"lab": "Ⅱ", "text": "", "keys": ["F", "G", "H", "I", "J"], "words": ["混繊糸", "混合糸", "渦流紡績糸", "複合糸", "フィラメント加工糸", "コンジュゲート糸", "シックアンドシン糸", "麻番手", "綿番手", "デニール", "メートル番手", "フィラメント糸", "スパン糸"]}], "opts": {}, "itemx": {"A": "化学繊維で長繊維状の繊維束を原料とし、繊維を引張って切断するなどして短繊維化し、スライバーを作り紡績する方法", "B": "綿糸で、短繊維を積極的に除去するコーミング工程を省略した糸", "C": "毛糸で、原毛の短繊維部分や反毛などを原料とし、繊維の配列が比較的乱れているふっくらとした糸", "D": "養蚕時や生糸を作る時に出る「出がら繭」や「きびそ」などを原料とする糸", "E": "リング精紡機で撚りをかけるために回転するパーツ", "F": "絹や化学繊維など連続した繊維を所定の本数束ねた構造の糸", "G": "合成繊維の熱可塑性を利用してマルチフィラメントに半永久的な捲縮やねじれを与えた糸", "H": "2種類以上のフィラメント繊維同士を混合した糸", "I": "基準質量453.59 gの糸の長さが768.1 mの何倍あるかで表す糸の太さの表示法", "J": "基準長さ9,000 mの糸の質量で表す糸の太さの表示法"}, "wl": "［語群］"}, "q5": {"ins": "次の記述内の[A]～[G]の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "[]", "html": false, "secs": [{"lab": "Ⅰ", "text": "織物がかぎ裂きで破れる場合に対する実用性能は[A]（1．破裂強さ　2．摩耗強さ　3．引裂き強さ）で評価される。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "繊維が高い[B]（1．弾性回復力　2．引張り強さ　3．曲げヒステリシス）を持つと防しわ性は向上する。", "keys": ["B"]}, {"lab": "Ⅲ", "text": "編物で編糸が切断し編目の外れる現象を[C]（1．ラン　2．スナッグ　3．ピル）という。", "keys": ["C"]}, {"lab": "Ⅳ", "text": "セルロース繊維織物の収縮は、主に膨潤収縮と[D]（1．熱収縮　2．フェルト収縮　3．緩和収縮）がある。", "keys": ["D"]}, {"lab": "Ⅴ", "text": "編物の収縮を抑えるためには、生産工程における給糸、巻取の際の[E]（1．張力　2．風綿　3．汚染）の管理が重要である。", "keys": ["E"]}, {"lab": "Ⅵ", "text": "吸水した布の乾燥において、水分率が直線的に減少したあとの乾燥過程は[F]（1．恒率乾燥　2．減率乾燥　3．増率乾燥）である。", "keys": ["F"]}, {"lab": "Ⅶ", "text": "布のせん断変形は[G]（1．カンチレバー法　2．通気性試験　3．バイアス方向の引張り試験）でも測定できる。", "keys": ["G"]}], "opts": {"A": ["破裂強さ", "摩耗強さ", "引裂き強さ"], "B": ["弾性回復力", "引張り強さ", "曲げヒステリシス"], "C": ["ラン", "スナッグ", "ピル"], "D": ["熱収縮", "フェルト収縮", "緩和収縮"], "E": ["張力", "風綿", "汚染"], "F": ["恒率乾燥", "減率乾燥", "増率乾燥"], "G": ["カンチレバー法", "通気性試験", "バイアス方向の引張り試験"]}}, "q6": {"ins": "次のA～Eの記述に最も関係が深いものを下記の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "", "html": false, "secs": [{"lab": "", "text": "", "keys": ["A", "B", "C", "D", "E"], "words": ["ステッチボンド不織布", "ニードルパンチ不織布", "スパンレース不織布", "メルトブローン不織布", "エアレイド不織布", "スパンボンド不織布", "ケミカルボンド不織布", "湿式不織布"]}], "opts": {}, "itemx": {"A": "「返し（バーブ）」のついた針の運動によって、ウェブ中の繊維を交絡する不織布", "B": "各種接着剤を使用して、ウェブ中の繊維間を接着する不織布", "C": "糸を用いて、ウェブを縫うことにより固定する不織布", "D": "高圧水流によってウェブ中の短繊維を交絡する不織布", "E": "紡糸されたフィラメントを直接的にシート状に積層することにより製造する不織布"}, "wl": "［語群］"}, "q7": {"ins": "次の記述内の[A]～[K]の後ろの（　）内に示す語句の中から最も適切なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "[]", "html": false, "secs": [{"lab": "Ⅰ", "text": "よこ編の基本組織は平編、ゴム編、[A]（1．天竺編　2．パール編　3．両面編）である。平編は[B]（1．リブ編　2．メリヤス編　3．リンクス編）とも呼ばれ、糸使いが同じなら基本組織の中では最も[C]（1．伸びる　2．厚い　3．薄い）編地になる。ゴム編は[D]（1．リブ編　2．メリヤス編　3．リンクス編）とも呼ばれ、[E]（1．コース　2．ワープ　3．ウエール）方向の伸長性が特に大きい組織である。更にゴム編からは[F]（1．シングルコード編　2．サテン編　3．ミラノリブ編）や[G]（1．片畦編　2．ガータ編　3．パイル編）などが誘導される。\n両面編から誘導される変化組織には[H]（1．表鹿の子編　2．モックミラノリブ編　3．ダブルデンビ編）がある。", "keys": ["A", "B", "C", "D", "E", "F", "G", "H"]}, {"lab": "Ⅱ", "text": "たて編機では[I]（1．筬　2．ガイド　3．シャットル（杼））に通された多数のたて糸を[J]（1．筬　2．シンカー　3．シャットル（杼））で振って編針にかけて編地を編成する。", "keys": ["I", "J"]}, {"lab": "Ⅲ", "text": "たて編機では、[K]（1．前ヘルドと後ヘルド　2．前筬と後筬　3．フロントビームとバックビーム）を使用することにより二重組織が編成される。", "keys": ["K"]}], "opts": {"A": ["天竺編", "パール編", "両面編"], "B": ["リブ編", "メリヤス編", "リンクス編"], "C": ["伸びる", "厚い", "薄い"], "D": ["リブ編", "メリヤス編", "リンクス編"], "E": ["コース", "ワープ", "ウエール"], "F": ["シングルコード編", "サテン編", "ミラノリブ編"], "G": ["片畦編", "ガータ編", "パイル編"], "H": ["表鹿の子編", "モックミラノリブ編", "ダブルデンビ編"], "I": ["筬", "ガイド", "シャットル（杼）"], "J": ["筬", "シンカー", "シャットル（杼）"], "K": ["前ヘルドと後ヘルド", "前筬と後筬", "フロントビームとバックビーム"]}}, "q8": {"ins": "次の記述の（　）内に、下記の語群の中から最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "（ ）", "html": false, "secs": [{"lab": "", "text": "　織機の分類には、開口機構による分類と、[A]糸の供給機構による分類がある。開口機構による分類は、[B]糸の運動に関係するもので、最も複雑な織物組織には[C]装置が用いられる。\n[A]糸の供給機構に関する分類は、シャットル（杼）を使う織機と使わない織機がある。\n　シャットル（杼）を使わない無杼織機は、[D]織機、[E]織機、[F]織機などがある。\n[D]織機の特徴は、空気や水を利用しており、[E]織機は、剣のような長い帯状の器具の先端部で糸を把持し、開口内を往復し、また[F]織機は、グリッパーが開口内を飛走して、よこ入れする。", "keys": ["A", "B", "C", "D", "E", "F"], "words": ["レピア", "プレッサー", "プロジェクタイル", "タペット（カム）", "たて", "ジェット", "よこ", "ピッカー", "ジャカード"]}], "opts": {}, "wl": "［語群］"}, "q9": {"ins": "次のA～Kの記述で、平織に該当するものは1、斜文織に該当するものは2、朱子織に該当するものは3を解答記入欄にマークしなさい。", "type": "para", "bl": "", "html": false, "secs": [{"lab": "A．", "text": "一般に糸の浮きがもっとも長く、組織点が連続しない織物で糸の浮き方向に光沢がある。", "keys": ["A"]}, {"lab": "B．", "text": "糸の交錯点が最も多いので、糸が接近しにくい。", "keys": ["B"]}, {"lab": "C．", "text": "この組織の織物に、ブロード、タフタなどがある。", "keys": ["C"]}, {"lab": "D．", "text": "完全組織を作るには、少なくとも、たて、よこ各5本が必要である。", "keys": ["D"]}, {"lab": "E．", "text": "一般に糸が最も密に並ぶので、織物は厚くなる。", "keys": ["E"]}, {"lab": "F．", "text": "たてよこ各2本で完全組織をつくる。", "keys": ["F"]}, {"lab": "G．", "text": "この組織の織物に、デニム、ギャバジンなどがある。", "keys": ["G"]}, {"lab": "H．", "text": "織物の表面に斜めの線があらわれる。", "keys": ["H"]}, {"lab": "I．", "text": "この組織の織物に、金巾、キャラコなどがある。", "keys": ["I"]}, {"lab": "J．", "text": "完全組織を作るには、少なくとも、たて、よこ各3本が必要である。", "keys": ["J"]}, {"lab": "K．", "text": "この組織の織物に、ドスキンなどがある。", "keys": ["K"]}], "opts": {"A": ["平織", "斜文織", "朱子織"], "B": ["平織", "斜文織", "朱子織"], "C": ["平織", "斜文織", "朱子織"], "D": ["平織", "斜文織", "朱子織"], "E": ["平織", "斜文織", "朱子織"], "F": ["平織", "斜文織", "朱子織"], "G": ["平織", "斜文織", "朱子織"], "H": ["平織", "斜文織", "朱子織"], "I": ["平織", "斜文織", "朱子織"], "J": ["平織", "斜文織", "朱子織"], "K": ["平織", "斜文織", "朱子織"]}}, "q10": {"ins": "次のA～Hの記述について、①②の両方が正しい場合には『1』、①が正しく②が間違っている場合には『2』、①が間違っており②が正しい場合には『3』、①②の両方が間違っている場合には『4』を解答記入欄にマークしなさい。", "type": "tf", "bl": "", "html": true, "tf": {"A": ["ポリエステルの減量加工では、水酸化ナトリウムが用いられる。", "ポリエステルの減量加工では、酵素が用いられる場合もある。"], "B": ["酸性染料は、アニオン性染料である。", "酸性染料は、セルロース繊維を染色するのに適している。"], "C": ["かせ染めは、先染めか後染めかの分類では、後染めに分類される。", "トップ染めは、糸を染める方法である。"], "D": ["フラットスクリーン捺染において、捺染糊をスクリーン型を通して布面に押し出し印捺するへら状の部品をスキージという。", "フラットスクリーン捺染において、印捺される布は、エンドレスベルト上を止まることなく連続的に動く。"], "E": ["L*a*b*表色系で、L*は明度を表す。", "L*a*b*表色系で、a*はプラスの方向になるほど赤みが強い。"], "F": ["ポリエステルと綿の混用織物を酸を用いてオパール加工を行う場合、除去される繊維は綿である。", "オパール加工を行うと、透明感のある模様を得ることができる。"], "G": ["漂白は、精練後も繊維中に存在する微量の色素を、酸化剤や還元剤によって分解除去する工程である。", "蛍光増白は、精練漂白後もわずかに黄褐色に見える布に青紫系の色素を付加させて白く見せる方法である。"], "H": ["染色現場において通常の色合わせで得られる色見本と染色物の等色はアイソメリズムの関係であり、どのような光源下でも同じ色に見えるので、光源の影響を考慮する必要はない。", "染色処方では、いろいろな染料を配合して使う配合染色が行われる。"]}}, "q11": {"ins": "次のA～Gの文中の（　）内に、最も適当なものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "（ ）", "html": false, "secs": [{"lab": "Ⅰ", "text": "硫化染料による染色物では、保存中に[A]が発生して繊維をぜい化させることがある。\n（1．硫化水素　2．硫酸　3．二硫化炭素）", "keys": ["A"]}, {"lab": "Ⅱ", "text": "表面に凹型に模様を彫刻した型を用いて捺染を行う方式は、[B]である。\n（1．フラットスクリーン捺染　2．ロータリスクリーン捺染　3．ローラ捺染）", "keys": ["B"]}, {"lab": "Ⅲ", "text": "疎水性の合成繊維に対して親水性の化合物を付与し、汚れても洗濯により除去しやすくする加工は[C]加工である。\n（1．ソイルガード　2．ソイルリリース　3．はっ水）", "keys": ["C"]}, {"lab": "Ⅳ", "text": "光触媒加工に用いられる代表的な物質には、[D]がある。\n（1．二酸化硫黄　2．二酸化チタン　3．二硫化炭素）", "keys": ["D"]}, {"lab": "Ⅴ", "text": "染料と結合することで、水に不溶の錯体を生成させ、染色物の堅ろう度を増進させる薬剤は[E]である。\n（1．フィックス剤　2．バインダ　3．分散剤）", "keys": ["E"]}, {"lab": "Ⅵ", "text": "機能性を付与する加工方法として、浴中の薬剤を繊維との親和力によって吸収させることで行う加工法は、[F]と呼ばれる。\n（1．吸尽加工法　2．プラズマ加工法　3．コーティング法）", "keys": ["F"]}, {"lab": "Ⅶ", "text": "「化学物質の審査及び製造等の規制に関する法律」の第一種特定化学物質に指定される「ペルフルオロオクタン酸(PFOA)又はその塩」は、[G]に関連する物質である。\n（1．親水加工　2．防しわ加工　3．はっ水加工）", "keys": ["G"]}], "opts": {"A": ["硫化水素", "硫酸", "二硫化炭素"], "B": ["フラットスクリーン捺染", "ロータリスクリーン捺染", "ローラ捺染"], "C": ["ソイルガード", "ソイルリリース", "はっ水"], "D": ["二酸化硫黄", "二酸化チタン", "二硫化炭素"], "E": ["フィックス剤", "バインダ", "分散剤"], "F": ["吸尽加工法", "プラズマ加工法", "コーティング法"], "G": ["親水加工", "防しわ加工", "はっ水加工"]}}, "q12": {"ins": "次の文中のA～Jの記述に最も関係が深いものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "", "html": false, "secs": [{"lab": "A．", "text": "加工糸織編物は、精練時あるいは精練前に熱と機械的もみ作用により弛緩させて、潜在ひずみを除去し、かさ高性と伸縮性を向上させる。\n（1．ストレッチ処理　2．リラックス処理　3．パディング処理）", "keys": ["A"]}, {"lab": "B．", "text": "ねじれてリボン状の扁平な綿繊維の形態がよじれを戻して円形状断面に変化することで光沢が向上することに加え、繊維内部の結晶および非晶構造の変化によって染色性も向上する加工\n（1．マーセライズ加工　2．オーガンジ加工　3．ザプロ加工）", "keys": ["B"]}, {"lab": "C．", "text": "世界で最初の合成染料モーブが属しているカチオン性染料で、羊毛を鮮やかな色調に染めるが、耐光堅ろう度が低い。\n（1．酸性染料　2．媒染染料　3．塩基性染料）", "keys": ["C"]}, {"lab": "D．", "text": "繊維間隙への染色液の侵入を助け、繊維表面を均一に濡らすことで染色むらを抑制するために用いる界面活性剤であり、特に疎水性繊維の場合に多く使用される。\n（1．分散剤　2．促染剤　3．湿潤剤）", "keys": ["D"]}, {"lab": "E．", "text": "捺染糊に添加され、蒸熱中に水蒸気を吸収して染料の拡散を容易にする作用を示す。反応染料による染色では尿素が代表的である。\n（1．染料溶解剤　2．抜染剤　3．乳化剤）", "keys": ["E"]}, {"lab": "F．", "text": "一般に画像入力部、画像処理部、およびプリント部で構成された生産システムであり、彫刻型を必要とせず、また、布面に直接模様を印捺することができる。少量生産・短納期・高精細・多色表現などの特徴がある。\n（1．スクリーン捺染　2．インクジェットプリント　3．転写捺染）", "keys": ["F"]}, {"lab": "G．", "text": "染色物の測色による色管理で用いられる均等色空間の表色系であり、物体色の色差としてその色差式が一般的に用いられている。\n（1．マンセル表色系　2．XYZ表色系　3．L*a*b*表色系）", "keys": ["G"]}, {"lab": "H．", "text": "ローラなどを用いて生地表面を加圧して平滑化する加工\n（1．カレンダ加工　2．シャリング加工　3．リップル加工）", "keys": ["H"]}, {"lab": "I．", "text": "表面に模様を彫刻した加熱金属ローラと弾性ローラとの間に生地を通すことにより、生地表面に彫刻どおりの凹凸と光沢差を与える加工\n（1．メルトン加工　2．オーガンジ加工　3．エンボス加工）", "keys": ["I"]}, {"lab": "J．", "text": "染色工程において、繊維高分子と共有結合で染着する染料で、セルロース繊維の主力染料として多く用いられている。\n（1．反応染料　2．硫化染料　3．酸化染料）", "keys": ["J"]}], "opts": {"A": ["ストレッチ処理", "リラックス処理", "パディング処理"], "B": ["マーセライズ加工", "オーガンジ加工", "ザプロ加工"], "C": ["酸性染料", "媒染染料", "塩基性染料"], "D": ["分散剤", "促染剤", "湿潤剤"], "E": ["染料溶解剤", "抜染剤", "乳化剤"], "F": ["スクリーン捺染", "インクジェットプリント", "転写捺染"], "G": ["マンセル表色系", "XYZ表色系", "L*a*b*表色系"], "H": ["カレンダ加工", "シャリング加工", "リップル加工"], "I": ["メルトン加工", "オーガンジ加工", "エンボス加工"], "J": ["反応染料", "硫化染料", "酸化染料"]}}}, "3": {"q1": {"ins": "次の文中の［A］～［J］の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "自然のままで繊維形状をしているものを利用した繊維を総称して天然繊維と呼び、植物繊維、動物繊維、[A]（1．無機繊維　2．鉱物繊維　3．金属繊維）が存在する。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "植物繊維は、[B]（1．綿　2．大麻　3．サイザル麻）のような種子毛繊維、亜麻や苧麻のような[C]（1．木質繊維　2．葉脈繊維　3．靭皮繊維）、マニラ麻のような[D]（1．木質繊維　2．葉脈繊維　3．靭皮繊維）などに大別される。", "keys": ["B", "C", "D"]}, {"lab": "Ⅲ", "text": "綿も麻もセルロースを主成分としているが、麻のほうが硬く、肌にふれたときに涼しく感じるので、夏物衣料に適する。麻の中でも[E]（1．亜麻　2．黄麻　3．大麻）は比較的細くて綿に近い風合いを有している。", "keys": ["E"]}, {"lab": "Ⅳ", "text": "繊維製品品質表示規程で毛の指定用語として定められているのは、羊毛、アンゴラ、カシミヤ、モヘヤ、アルパカと[F]（1．らくだ　2．パシュミナ　3．ラマ）の6種である。", "keys": ["F"]}, {"lab": "Ⅴ", "text": "絹は蚕蛾の繭から採取される繊維で、一般的には家蚕の繭から採られる。家蚕が吐出する繭糸は2本の[G]（1．ルーメン　2．コルテックス　3．ブラン）をセリシンで固着したものであり、セリシンを除去することで光沢のある[H]（1．生絹　2．練絹　3．平絹）となる。", "keys": ["G", "H"]}, {"lab": "Ⅵ", "text": "羽毛は鳥類の体表を覆う上皮構造物で、JIS L 0216「羽毛用語」では、ダウン、フェザー、[I]（1．ファイバー　2．ボール　3．スモールフェザー）の総称と規定されている。ダウンは羽毛の中でも[J]（1．元羽軸　2．幹羽軸　3．羽糸）がない、または明瞭でないものを指し、フェザーと比較して軽くて柔らかく、保温性にも優れる。", "keys": ["I", "J"]}], "opts": {"A": ["無機繊維", "鉱物繊維", "金属繊維"], "B": ["綿", "大麻", "サイザル麻"], "C": ["木質繊維", "葉脈繊維", "靭皮繊維"], "D": ["木質繊維", "葉脈繊維", "靭皮繊維"], "E": ["亜麻", "黄麻", "大麻"], "F": ["らくだ", "パシュミナ", "ラマ"], "G": ["ルーメン", "コルテックス", "ブラン"], "H": ["生絹", "練絹", "平絹"], "I": ["ファイバー", "ボール", "スモールフェザー"], "J": ["元羽軸", "幹羽軸", "羽糸"]}}, "q2": {"ins": "次のA～Eの説明として最もふさわしいものを下記記述の中から選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "", "html": false, "secs": [{"lab": "A．", "text": "衣料用の羊毛はもともと捲縮を有し、糸にした際にふくらみがでるが、この捲縮の主たる要因の説明", "keys": ["A"]}, {"lab": "B．", "text": "それぞれの獣毛の特徴の説明", "keys": ["B"]}, {"lab": "C．", "text": "モダクリル（アクリル系）繊維についての説明", "keys": ["C"]}, {"lab": "D．", "text": "ポリエチレンテレフタレートのエチレンをブチレンに置き換えたポリブチレンテレフタレートの説明", "keys": ["D"]}, {"lab": "E．", "text": "ポリウレタン繊維の説明", "keys": ["E"]}], "opts": {"A": ["羊毛表面にうろこ状のスケールが存在し、摩擦抵抗に異方性があるため", "スケールの表面がはっ水性であり水をはじくが、スケールの隙間から皮質部に水蒸気が吸収されるため", "皮質部がオルソコルテックスとパラコルテックスの2層からなるバイラテラル構造となっているため"], "B": ["アンゴラは繊維が太くてかたい触感が特徴である。", "カシミヤは比較的かたい触感で、フェルト化が起こりにくい。", "モヘヤは羊毛より太くてハリがあり、繊維に縮れがなく、縮絨性が小さい。"], "C": ["アクリロニトリルの重合割合が85％以上の繊維", "アクリロニトリルの重合割合が10％未満で、アクリレート基25％以上含む繊維", "アクリロニトリルの重合割合が35％以上、85％未満の繊維"], "D": ["ポリエチレンテレフタレートに対して耐熱性が高く、熱セット性に優れる。", "ポリエチレンテレフタレートに対してかさ高加工を施した場合に伸縮性に優れる。", "ポリエチレンテレフタレートに対して硬く、ロープなどに用いられる。"], "E": ["分子はウレタン結合（-NH・CO・O-）をもつポリマーである。", "分子は、ハードセグメントとソフトセグメントから構成され、後者が繊維の強さを支えている。", "繊維は伸縮性を有するため、その特徴を生かして単独で使用されることが多い。"]}}, "q3": {"ins": "次の文中の［A］～［J］の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "多くの化学繊維は無定形状態の[A]（1．高分子　2．低分子　3．金属微結晶）が、紡糸ノズルを通るときのせん断力およびその後の延伸操作によって、分子が[B]（1．繊維の半径方向　2．繊維軸方向　3．全方向）に配列したものである。\n　繊維を構成する高分子は温度が上昇すると、低温で拘束されていた分子の一部分であるセグメントが動き始める。この温度を[C]（1．融点　2．キュリー点　3．ガラス転移温度）という。つまり、[C]は、[D]（1．ゴム状態　2．液晶状態　3．ガラス状態）にあった高分子が[E]（1．ストレッチ運動　2．ミクロブラウン運動　3．マクロブラウン運動）を開始する温度である。\n　ポリエステルやナイロンなどの合成繊維は、温度の上昇に応じて軟化現象が現れ、[F]（1．分解温度　2．結晶の融解温度　3．ガラス転移温度）に達すると完全に溶融する。", "keys": ["A", "B", "C", "D", "E", "F"]}, {"lab": "Ⅱ", "text": "横軸を伸びで表した場合、荷重－伸長曲線と横軸との間の面積は[G]（1．破壊力　2．破断仕事量　3．仕事率）を表し、特に単位長さ、単位太さあたりの[G]は[H]（1．タフネス　2．ブリットルネス　3．ハードネス）と呼ばれる。荷重－伸長曲線の形は、繊維の種類により異なるが、同じ繊維でも品種・タイプによって相違する。天然繊維のうち、[I]（1．麻　2．綿　3．羊毛）は、強さが大きく伸び率が小さい。また、[J]（1．綿　2．羊毛　3．絹）は、強さは小さく伸び率が大きい。", "keys": ["G", "H", "I", "J"]}], "opts": {"A": ["高分子", "低分子", "金属微結晶"], "B": ["繊維の半径方向", "繊維軸方向", "全方向"], "C": ["融点", "キュリー点", "ガラス転移温度"], "D": ["ゴム状態", "液晶状態", "ガラス状態"], "E": ["ストレッチ運動", "ミクロブラウン運動", "マクロブラウン運動"], "F": ["分解温度", "結晶の融解温度", "ガラス転移温度"], "G": ["破壊力", "破断仕事量", "仕事率"], "H": ["タフネス", "ブリットルネス", "ハードネス"], "I": ["麻", "綿", "羊毛"], "J": ["綿", "羊毛", "絹"]}}, "q4": {"ins": "次のⅠ～Ⅴの文中の（　）内に、最も適当なものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "（ ）", "html": true, "secs": [{"lab": "Ⅰ", "text": "質量1,000ｇの紡毛糸の長さが50 kmであった場合、メートル番手では[A]である。", "keys": ["A"], "words": ["5番手", "50番手", "500番手"]}, {"lab": "Ⅱ", "text": "長さ1,000ｍのキュプラのフィラメント糸の質量が3ｇである場合、糸の太さは[B]である。", "keys": ["B"], "words": ["30 tex", "30 dtex", "3 dtex"]}, {"lab": "Ⅲ", "text": "紡績糸を撚ることにより引張り強さが増加する理由は、糸中で[C]に撚られた繊維に張力が発生し、糸の中心に向かう力が生じ、そのため糸を構成している繊維相互の[D]の増大による結果である。", "keys": ["C", "D"], "words": ["同心円状", "円盤状", "摩擦力", "らせん状", "ファンデルワールス力"]}, {"lab": "Ⅳ", "text": "不織布はウェブの形成方法に基づき、湿式不織布、乾式不織布、[E]に大別される。[E]の代表的な方法は[F]とメルトブロー法である。ウェブの接着方法には、化学的接着法、熱的接着法、機械的接着法がある。化学的接着法は[G]とも呼ばれる。機械的接着法には、特殊な形状の針を用いる[H]などがある。", "keys": ["E", "F", "G", "H"], "words": ["紡糸型不織布", "紡糸直結型不織布", "紡糸間接型不織布", "サーマルボンド法", "レジンボンド法", "スパンボンド法", "カレンダ法", "ニードルパンチ法", "スパンレース法", "スルーエア法"]}, {"lab": "Ⅴ", "text": "織物面積をA、厚さをｔ、織物の絶乾質量をWと織物を構成する繊維の密度をｓとすると、織物の見掛けの容積Vは[I]、織物を構成する繊維の占める容積V<sub>f</sub>は[J]であり、このとき充填率は[K]で表される。", "keys": ["I", "J", "K"], "words": ["A・t", "A/t", "W・s", "W/s", "V<sub>f</sub>/V", "V/V<sub>f</sub>", "V・V<sub>f</sub>"]}], "opts": {}, "wl": "［語群］"}, "q5": {"ins": "織物、編物の基本組織について、それぞれの組織の説明として最も適当なものを次の1～9の中から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "［］", "html": true, "secs": [{"lab": "", "text": "<table class=\"otbl\"><tr><th></th><th colspan=\"3\">基本組織</th></tr><tr><th>織　物</th><td>平織［A］</td><td>斜文織［B］</td><td>朱子織［C］</td></tr><tr><th>よこ編</th><td>平編［D］</td><td>ゴム編［E］</td><td>パール編［F］</td></tr><tr><th>たて編</th><td>シングルトリコット編［G］</td><td>シングルコード編［H］</td><td>シングルアトラス編［I］</td></tr></table>", "keys": ["A", "B", "C", "D", "E", "F", "G", "H", "I"], "words": ["この組織は、1列針床の編機でループを全て同じ方向に引き出して編成される。", "この組織は、1枚の筬のたて糸を隣接する針に交互にラッピングして編成される。", "この組織は、1枚の筬のたて糸を、1針おいた次の針に交互にラッピングさせて編成される。", "この組織は、コースごとに表目と裏目が交互した配置である。", "この組織は、ウェールごとに表目と裏目が交互した配置である。", "この組織は、たて、よこ各3本以上の本数で完全組織をつくることができる。", "この組織は、たて、よこ各5本以上の本数で完全組織をつくることができる。", "この組織は、たて、よこ各2本で完全組織をつくることができる。", "この組織は、1枚の筬のたて糸を、隣接する針の方向に数回次々にラッピングさせ、その後同じ回数を逆方向にラッピングさせて編成される。"]}], "opts": {}, "itemx": {"A": "平織［A］", "B": "斜文織［B］", "C": "朱子織［C］", "D": "平編［D］", "E": "ゴム編［E］", "F": "パール編［F］", "G": "シングルトリコット編［G］", "H": "シングルコード編［H］", "I": "シングルアトラス編［I］"}, "nolab": true, "wl": ""}, "q6": {"ins": "次のⅠ～Ⅴの文中の（　）内に、最も適当なものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "（ ）", "html": false, "secs": [{"lab": "Ⅰ", "text": "織物準備工程で、たて糸をビームに平行に巻き取り、糸の長さ、糸密度、幅などを整える工程は[A]である。たて糸の毛羽を伏せ、製織中のたて糸の損傷や切断を防ぐために[B]を行う。シャットルレス織機で不要な工程は[C]である。", "keys": ["A", "B", "C"], "words": ["機掛け", "巻き返し", "撚り工程", "整経", "糊付け", "よこ管巻き"]}, {"lab": "Ⅱ", "text": "製織においてヘルドフレーム（綜絖枠）の上下によってたて糸を2つのグループに分ける運動を[D]運動という。よこ糸を入れた後、よこ糸を織前まで押し込む運動を[E]運動という。", "keys": ["D", "E"], "words": ["送り出し", "巻取", "開口", "よこ入れ", "筬打ち"]}, {"lab": "Ⅲ", "text": "自動織機とは製織中に織機を停止することなく、[F]のできる織機のことをいう。織機におけるヘルドフレームの枚数は少なくとも[G]は必要である。ウォータジェット織機は水を用いるので[H]の製織に適している。", "keys": ["F", "G", "H"], "words": ["たて糸の補給", "よこ糸の補給", "切断糸を繋ぐこと", "1枚", "たて糸の本数", "完全組織のたて糸数", "絹糸", "合成繊維フィラメント糸", "綿糸"]}, {"lab": "Ⅳ", "text": "たて朱子とよこ朱子の組み合わせで紋様を表した織物に[I]がある。模紗織は[J]に似せて作ったものである。", "keys": ["I", "J"], "words": ["梨地織", "絽", "緞子", "パイル組織", "からみ組織", "紋織物"]}, {"lab": "Ⅴ", "text": "パイル組織は、織物にパイル糸を織り込んだ組織であり、たて方向に畝が表れるように製織・カッティングがされたよこパイル織物には[K]がある。カッティングされたパイルで、抜けにくいのは[L]である。", "keys": ["K", "L"], "words": ["別珍", "コール天", "ビロード", "ルーズパイル", "ファストパイル", "Vパイル"]}], "opts": {}, "wl": "［語群］"}, "q7": {"ins": "次の文中の［A］～［H］の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "編機の分類において靴下編機は[A]（1．よこ編の円形編機　2．たて編の円形編機　3．よこ編の平型編機）が中心である。編地の区分において、丸編機により、一人分の身丈を区切って、裾部、身頃部を、組織を変えながら編成した半製品編地を[B]（1．流し編地　2．ガーメントレングス編地　3．成形編地）という。", "keys": ["A", "B"]}, {"lab": "Ⅱ", "text": "ゴム編を編成する2列針床の丸編機は[C]（1．フライス編機　2．ラッシェル編機　3．ミラニーズ編機）ともいう。編機に用いられる編針による編成において、ループ糸に糸が引き込まれ新しい編目ができる動作を[D]（1．タック　2．ノックオーバー　3．ウェルト）という。平編のコースごとにニットとタックが交互になるようにした変化組織を[E]（1．片畦編　2．表鹿の子編　3．ミラノリブ）という。スムース編は[F]（1．1列針床　2．2列針床（ゴム編出合い）　3．2列針床（両面編出合い））の編機で編まれる。", "keys": ["C", "D", "E", "F"]}, {"lab": "Ⅲ", "text": "2枚筬のたて編で、前筬にシングルコード編、後ろ筬にシングルトリコット編をした組織は[G]（1．ダブルアトラス編　2．ハーフトリコット編　3．ダブルコード編）である。[G]の編成において前筬のシングルコード編をさらに1針離れた針にラッピングさせると[H]（1．サテントリコット編　2．プレーントリコット編　3．ダブルバーコード編）になる。", "keys": ["G", "H"]}], "opts": {"A": ["よこ編の円形編機", "たて編の円形編機", "よこ編の平型編機"], "B": ["流し編地", "ガーメントレングス編地", "成形編地"], "C": ["フライス編機", "ラッシェル編機", "ミラニーズ編機"], "D": ["タック", "ノックオーバー", "ウェルト"], "E": ["片畦編", "表鹿の子編", "ミラノリブ"], "F": ["1列針床", "2列針床（ゴム編出合い）", "2列針床（両面編出合い）"], "G": ["ダブルアトラス編", "ハーフトリコット編", "ダブルコード編"], "H": ["サテントリコット編", "プレーントリコット編", "ダブルバーコード編"]}}, "q8": {"ins": "生地名A～Eの説明として最も適当と思われるものを下記の記述から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "", "html": false, "secs": [{"lab": "", "text": "", "keys": ["A", "B", "C", "D", "E"], "words": ["地の薄い織糸の密な平織物", "よこ糸に比べて、たて糸が大幅に密な平織物", "絹の平織物", "平織などの組織で、密度の粗い梳毛織物", "縮充加工により地組織を毛羽で覆った紡毛織物", "薄地のからみ組織の織物"]}], "opts": {}, "itemx": {"A": "メルトン", "B": "ローン", "C": "タフタ", "D": "ブロード", "E": "ポーラ"}, "wl": ""}, "q9": {"ins": "次の文中の［A］～［E］の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "水蒸気が布を通して高湿度側から低湿度側に移動する現象を[A]（1．放湿　2．透湿　3．吸湿）という。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "布を触って濡れていると感じるかどうかの境目の水分率を[B]（1．湿限界水分率　2．湿潤限界水分率　3．吸湿限界水分率）という。", "keys": ["B"]}, {"lab": "Ⅲ", "text": "編物は織物と比較して、一般に[C]（1．形崩れしにくい　2．ドレープ性が高い　3．スナッグが生じにくい）傾向がある。", "keys": ["C"]}, {"lab": "Ⅳ", "text": "しわになりにくい布は繊維の[D]（1．破断強度　2．弾性回復性　3．吸水性）が高い布である。", "keys": ["D"]}, {"lab": "Ⅴ", "text": "合成繊維の紡績糸による布ではピリングが問題となることがあるが、これは合成繊維が一般に強さが大きく、[E]（1．毛羽立ちしにくい　2．毛羽が絡みにくい　3．ピルが脱落しにくい）ためである。", "keys": ["E"]}], "opts": {"A": ["放湿", "透湿", "吸湿"], "B": ["湿限界水分率", "湿潤限界水分率", "吸湿限界水分率"], "C": ["形崩れしにくい", "ドレープ性が高い", "スナッグが生じにくい"], "D": ["破断強度", "弾性回復性", "吸水性"], "E": ["毛羽立ちしにくい", "毛羽が絡みにくい", "ピルが脱落しにくい"]}}, "q10": {"ins": "次のA～Fの文について、①②の両方が正しい場合には『1』、①が正しく②が間違っている場合には『2』、①が間違っており②が正しい場合には『3』、①②の両方が間違っている場合には『4』を解答記入欄にマークしなさい。", "type": "tf", "bl": "", "html": false, "tf": {"A": ["マーセライズ加工は、絹に対して行われる加工である。", "マーセライズ加工に用いられる薬剤は水酸化ナトリウムである。"], "B": ["染料と繊維の結合に関して、イオン結合の方が共有結合よりも弱い。", "染料と繊維の結合に関して、イオン結合の方が水素結合よりも強い。"], "C": ["酸性染料が羊毛に染まるのは、繊維の分子とイオン結合するからである。", "ナフトール染料は、別名を建染染料という。"], "D": ["反応染料は、水に不溶の染料である。", "反応染料と繊維との結合は、イオン結合である。"], "E": ["均染剤は、染色速度を速めることで均一な染色を促す薬剤である。", "分散染料による染色に用いられるキャリア剤は、促染剤として機能している。"], "F": ["かせ染めは、糸を染色する方法である。", "チーズ染めは、布を染色する方法である。"]}}, "q11": {"ins": "次のⅠ～Ⅹの文中の（　）内に、最も適当なものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "（ ）", "html": true, "secs": [{"lab": "Ⅰ", "text": "デニムの染色などに用いられるインジゴの染料部属は[A]である。\n（1．酸性染料　2．直接染料　3．バット染料）", "keys": ["A"]}, {"lab": "Ⅱ", "text": "デニムのたて糸をインジゴで中白に染色するのに適している染色機は、[B]である。\n（1．ウインス染色機　2．ジッガ染色機　3．ロープ染色機）", "keys": ["B"]}, {"lab": "Ⅲ", "text": "過酸化水素漂白は綿の漂白に優れた効果があるが、布に[C]が付着していると、その部分で過酸化水素の分解が急速に進んで損傷が起こるので注意が必要である。\n（1．塩分　2．鉄分　3．油分）", "keys": ["C"]}, {"lab": "Ⅳ", "text": "ポリエステル織物を水酸化ナトリウム水溶液によって加水分解を行う減量加工では、減量効果を促進させるために[D]が用いられる。\n（1．非イオン界面活性剤　2．陰イオン界面活性剤　3．陽イオン界面活性剤）", "keys": ["D"]}, {"lab": "Ⅴ", "text": "縮充（縮絨）は、[E]に対して行われる処理である。\n（1．麻　2．絹　3．羊毛）", "keys": ["E"]}, {"lab": "Ⅵ", "text": "染料は、繊維の[F]領域に拡散することで染着する。\n（1．結晶　2．配向　3．非晶）", "keys": ["F"]}, {"lab": "Ⅶ", "text": "分散染料をパッドした布を乾燥し、熱処理して染着させる連続染色は、[G]染色と呼ばれる。\n（1．サーモゾル　2．パッドスチーム　3．パッドバッチ）", "keys": ["G"]}, {"lab": "Ⅷ", "text": "アゾ染料の中で、人体内に吸収された場合に還元性酵素の作用で還元分解し、[H]を生成する可能性のある染料については法規制がなされており、JISによる試験法が規定されている。\n（1．特定芳香族アミン　2．アレルギー性染料　3．ポリ塩化ビフェニル）", "keys": ["H"]}, {"lab": "Ⅸ", "text": "反応染料で綿を染める際の無機電解質、および酸性染料で羊毛やナイロンを染める際の酸は、[I]としての役割を示す。\n（1．緩染剤　2．均染剤　3．促染剤）", "keys": ["I"]}, {"lab": "Ⅹ", "text": "L<sup>*</sup>a<sup>*</sup>b<sup>*</sup>表色系の測色結果において、b<sup>*</sup>がプラスの値の場合、b<sup>*</sup>の値が大きくなるほど[J]みが強くなる。\n（1．黄　2．緑　3．赤）", "keys": ["J"]}], "opts": {"A": ["酸性染料", "直接染料", "バット染料"], "B": ["ウインス染色機", "ジッガ染色機", "ロープ染色機"], "C": ["塩分", "鉄分", "油分"], "D": ["非イオン界面活性剤", "陰イオン界面活性剤", "陽イオン界面活性剤"], "E": ["麻", "絹", "羊毛"], "F": ["結晶", "配向", "非晶"], "G": ["サーモゾル", "パッドスチーム", "パッドバッチ"], "H": ["特定芳香族アミン", "アレルギー性染料", "ポリ塩化ビフェニル"], "I": ["緩染剤", "均染剤", "促染剤"], "J": ["黄", "緑", "赤"]}}, "q12": {"ins": "次の文中のA～Iの記述に最も関係が深いものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "", "html": false, "secs": [{"lab": "A．", "text": "綿やその混紡品の洗濯後のアイロンがけを容易にしたり不要にしたりすることを目的とした加工\n（1．W&W加工　2．オパール加工　3．リップル加工）", "keys": ["A"]}, {"lab": "B．", "text": "綿のリップル加工に用いられる薬剤\n（1．水酸化ナトリウム　2．塩酸　3．硫酸）", "keys": ["B"]}, {"lab": "C．", "text": "ポリエステルと綿を混用した織物に対し、綿のみを除去できる薬品を用いて部分的に半透明の模様を生む加工\n（1．オーガンジ加工　2．オパール加工　3．カレンダ加工）", "keys": ["C"]}, {"lab": "D．", "text": "防縮加工に該当するもの\n（1．ザプロ加工　2．サンフォライズ加工　3．ＳＲ加工）", "keys": ["D"]}, {"lab": "E．", "text": "セルラーゼを加工のために用いることのできる繊維\n（1．絹　2．綿　3．ポリエステル）", "keys": ["E"]}, {"lab": "F．", "text": "カレンダ加工のうち、生地に朱子のような光沢を与えることができ、ふとん側地などの加工に用いられるもの\n（1．フリクションカレンダ　2．シュライナカレンダ　3．フェルトカレンダ）", "keys": ["F"]}, {"lab": "G．", "text": "針布や研磨布を用いて布表面を毛羽立たせる仕上げ加工\n（1．起毛加工　2．せん毛加工　3．エンボス加工）", "keys": ["G"]}, {"lab": "H．", "text": "W&W加工と関連が深く、法令で衣料品からの遊離量が規制されている物質\n（1．ホルムアルデヒド　2．アセトアルデヒド　3．ジメチルホルムアミド）", "keys": ["H"]}, {"lab": "I．", "text": "機能性を付与する加工の方法として、布を薬剤の入った溶液に浸漬し、マングルで絞ったのちに予備乾燥し、熱処理を連続的に行う方法\n（1．パッド・ドライ・キュア法　2．吸尽法　3．パッドロール法）", "keys": ["I"]}], "opts": {"A": ["W&W加工", "オパール加工", "リップル加工"], "B": ["水酸化ナトリウム", "塩酸", "硫酸"], "C": ["オーガンジ加工", "オパール加工", "カレンダ加工"], "D": ["ザプロ加工", "サンフォライズ加工", "ＳＲ加工"], "E": ["絹", "綿", "ポリエステル"], "F": ["フリクションカレンダ", "シュライナカレンダ", "フェルトカレンダ"], "G": ["起毛加工", "せん毛加工", "エンボス加工"], "H": ["ホルムアルデヒド", "アセトアルデヒド", "ジメチルホルムアミド"], "I": ["パッド・ドライ・キュア法", "吸尽法", "パッドロール法"]}}}};
ORIG["4"] = {"q1": {"ins": "次の文中［A］～［J］の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "現在、世界で最も生産量が多い繊維は[A]（1．ポリエステル　2．ナイロン　3．綿　4．毛）であり、次いで多いのは[B]（1．ポリエステル　2．ナイロン　3．綿　4．毛）である。", "keys": ["A", "B"]}, {"lab": "Ⅱ", "text": "麻には多くの種類があるが、家庭用品品質表示法に基づいて麻と表示できるのは苧麻と[C]（1．亜麻　2．大麻　3．黄麻）である。麻の主成分は[D]（1．ポリ乳酸　2．レーヨン　3．アクリレート）と同じであり、吸湿性に優れ、春夏物衣料に適する。", "keys": ["C", "D"]}, {"lab": "Ⅲ", "text": "羊毛の主成分は[E]（1．セリシン　2．プロテイン　3．ケラチン）であり、その皮質部は[F]（1．スケール　2．コルテックス　3．フィブロイン）で構成されている。", "keys": ["E", "F"]}, {"lab": "Ⅳ", "text": "アセテートは、[G]（1．再生繊維　2．半合成繊維　3．合成繊維）に分類され、セルロースの－OH基を酢酸化した繊維である。酢酸化の割合が高いほど[H]（1．吸湿性　2．比重　3．耐熱性）が減少する。また、－OH基の[I]（1．38％　2．74％　3．92％）以上を酢酸化した繊維をトリアセテートと表示することができる。", "keys": ["G", "H", "I"]}, {"lab": "Ⅴ", "text": "産業用に使用されるナイロン66やポリエステルは、衣料用に比較して、高強度、低伸度である。これは、主に原料高分子の[J]（1．非晶領域の割合を高くする　2．重合度を高くする　3．重合度を低くする）ことや、繊維化工程で延伸倍率を高めることなどにより達成される。", "keys": ["J"]}], "opts": {"A": ["ポリエステル", "ナイロン", "綿", "毛"], "B": ["ポリエステル", "ナイロン", "綿", "毛"], "C": ["亜麻", "大麻", "黄麻"], "D": ["ポリ乳酸", "レーヨン", "アクリレート"], "E": ["セリシン", "プロテイン", "ケラチン"], "F": ["スケール", "コルテックス", "フィブロイン"], "G": ["再生繊維", "半合成繊維", "合成繊維"], "H": ["吸湿性", "比重", "耐熱性"], "I": ["38％", "74％", "92％"], "J": ["非晶領域の割合を高くする", "重合度を高くする", "重合度を低くする"]}}, "q2": {"ins": "次のA～Eの説明に最も適当と思われる繊維を下記の語群から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "", "html": false, "secs": [{"lab": "", "text": "", "keys": ["A", "B", "C", "D", "E"], "words": ["ナイロン", "アラミド", "ポリ乳酸", "アクリル", "ビニロン", "ポリ塩化ビニル", "レーヨン", "キュプラ", "ポリエチレン", "ポリプロピレン", "ポリウレタン"]}], "opts": {}, "itemx": {"A": "主にベンゼン環を直接アミド結合でつないだ構造からなり、メタ型の構造を有するポリマーからなる繊維は耐熱性と防炎性に優れ、消防服や防護服などに用いられる。", "B": "紡績糸としての利用が主流であり、軽くて保温性に富むので、秋冬物衣料や寝装、インテリアなどに用いられる。カチオン染料を用いてきれいな発色と高い染色堅ろう度が得られる。", "C": "摩耗や折り曲げに対して強く、ポリエステルに比較して初期引張り抵抗度が低く、肌着や靴下などに用いられる。また、紫外線などで黄変しやすい。", "D": "ゴムのように伸縮し、ゴムより強く劣化しにくいため、他の繊維と混用することでストレッチ性を有する素材とするために用いられることが多い。タイツやレギンス、水着などに用いられる。", "E": "酸化銅アンモニア法により製造される化学繊維である。"}, "wl": "［語群］"}, "q3": {"ins": "次のⅠ～Ⅴの文中の（　）内に、最も適切なものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "（ ）", "html": true, "secs": [{"lab": "Ⅰ", "text": "繊維は一定の引張り荷重の下では、ひずみが時間とともに増加する。この現象を[A]と呼ぶ。また、繊維に荷重を加えて、ひずみXを与えた後に荷重を取り除いた時、一定時間後にひずみがYまで減少したとすると、［（X－Y）／X］を[B]と呼ぶ。", "keys": ["A", "B"], "words": ["応力緩和", "クリープ", "初期引張り抵抗度", "セット率", "弾性回復率", "弾性変形率", "永久変形率"]}, {"lab": "Ⅱ", "text": "ナイロンは、[C]結合をもつ鎖状高分子からなる繊維である。また、ポリエステルは、[D]原子からなる繊維である。", "keys": ["C", "D"], "words": ["エステル", "イミド", "アミド", "炭素と水素", "炭素と水素と酸素", "炭素と水素と酸素と窒素"]}, {"lab": "Ⅲ", "text": "ナイロンやポリエステルは、溶融紡糸法により製造される。溶融紡糸法を適用するには、原料の高分子が[E]を有することが必要である。湿式紡糸法は、原料を溶剤に溶かし、凝固浴中で繊維化させる方法であり、この方法は[F]に適用されている。", "keys": ["E", "F"], "words": ["熱可塑性", "熱硬化性", "熱分解性", "アセテート", "ポリプロピレン", "レーヨン"]}, {"lab": "Ⅳ", "text": "繊維の吸湿性とは、[G]状の水分を繊維の表面に付着あるいは内部に取り込む性質である。ナイロン、アクリル、ポリエステルの中で最も大きな吸湿性を示すものは、[H]である。", "keys": ["G", "H"], "words": ["液体", "気体", "クラスター", "ナイロン", "アクリル", "ポリエステル"]}, {"lab": "Ⅴ", "text": "難燃性を示す繊維には、[I]がある。不燃性である炭素繊維は、石油系ピッチや[J]の長繊維を焼成炭素化した繊維である。", "keys": ["I", "J"], "words": ["ポリ塩化ビニル", "ポリエチレン", "ビニロン", "アクリル", "ナイロン", "ポリエステル"]}], "opts": {}, "wl": "［語群］"}, "q4": {"ins": "次の文中［A］～［I］の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "フィラメント加工糸は、主として合成繊維の熱可塑性を利用して、半永久的な[A]（1．牽切や引張　2．押圧やせん断　3．捲縮やねじれ）を生じさせ、伸縮性やかさ高性を与えた糸である。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "綿糸紡績において、スライバのダブリングと引き伸ばし（ドラフト）をくり返し、太さむらを低減する工程を[B]（1．練条　2．カーディング　3．混打綿）という。", "keys": ["B"]}, {"lab": "Ⅲ", "text": "カバード糸と同じような原理で、天然繊維束を芯にして、それに化学繊維のフィラメントをらせん状に巻き付けたものを[C]（1．精紡交撚糸　2．ラッピングヤーン　3．コアスパンヤーン）という。", "keys": ["C"]}, {"lab": "Ⅳ", "text": "質量1 kgの梳毛糸の長さが40 kmである場合、メートル番手では[D]（1．4番手　2．40番手　3．400番手）である。", "keys": ["D"]}, {"lab": "Ⅴ", "text": "布の充填率は、布の[E]（1．見かけ比重　2．厚さ　3．質量）を、布を構成する繊維の[F]（1．質量　2．太さ　3．密度）で割って計算される。", "keys": ["E", "F"]}, {"lab": "Ⅵ", "text": "一般に織物は、[G]（1．たて方向　2．よこ方向　3．バイアス方向）に伸びやすい。", "keys": ["G"]}, {"lab": "Ⅶ", "text": "織物の引裂き強さは、[H]（1．トップ部　2．ダル部　3．デル部）において、順次に糸が切断されるため、切断部の糸の自由度に大きく影響される。", "keys": ["H"]}, {"lab": "Ⅷ", "text": "糸や布中に貯えられた内部のひずみが張力のない状態で吸湿または吸水すると、布に収縮が生じる。これを[I]（1．フェルト収縮　2．緩和収縮　3．ハイグラルエキスパンション）という。", "keys": ["I"]}], "opts": {"A": ["牽切や引張", "押圧やせん断", "捲縮やねじれ"], "B": ["練条", "カーディング", "混打綿"], "C": ["精紡交撚糸", "ラッピングヤーン", "コアスパンヤーン"], "D": ["4番手", "40番手", "400番手"], "E": ["見かけ比重", "厚さ", "質量"], "F": ["質量", "太さ", "密度"], "G": ["たて方向", "よこ方向", "バイアス方向"], "H": ["トップ部", "ダル部", "デル部"], "I": ["フェルト収縮", "緩和収縮", "ハイグラルエキスパンション"]}}, "q5": {"ins": "次の文中［A］～［H］の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": true, "secs": [{"lab": "Ⅰ", "text": "斜文織はたて、よこ[A]（1．2本　2．3本　3．5本）以上の任意の本数で作ることができる。<sup>5</sup>/<sub>2</sub>↗斜文織を位置を変えずにそのまま裏から見ると、[B]（1．<sup>5</sup>/<sub>2</sub>↖　2．<sup>2</sup>/<sub>5</sub>↖　3．<sup>2</sup>/<sub>5</sub>↗）になる。", "keys": ["A", "B"]}, {"lab": "Ⅱ", "text": "朱子織は、完全組織のたて糸本数と、隣り合うたて糸の交錯点のへだたりをよこ糸本数で表した飛び数で示すことができる。朱子織においては、[C]（1．3飛び10枚　2．5飛び10枚　3．7飛び10枚）は存在しない。", "keys": ["C"]}, {"lab": "Ⅲ", "text": "からみ組織の代表的な織物には[D]（1．絽　2．緞子　3．摸紗織）がある。ビロードは[E]（1．たてパイル織物　2．よこパイル織物　3．ループパイル織物）である。", "keys": ["D", "E"]}, {"lab": "Ⅳ", "text": "織機において、たて糸を2つのグループに分け開口部を形成するために、そのたて糸を1本ずつ通す目穴をもった針金を[F]（1．筬　2．通糸　3．綜絖）という。バンド方式やロッド方式などによるアーム状の挿入装置の先端部で糸端をつかみ、よこ入れする織機は[G]（1．レピア織機　2．グリッパー織機　3．シャットル織機）である。", "keys": ["F", "G"]}, {"lab": "Ⅴ", "text": "紋織物のように完全組織内のたて糸本数が数百本以上の織物を織る際には[H]（1．タペット式　2．ドビー式　3．ジャカード式）の開口装置を用いる。", "keys": ["H"]}], "opts": {"A": ["2本", "3本", "5本"], "B": ["<sup>5</sup>/<sub>2</sub>↖", "<sup>2</sup>/<sub>5</sub>↖", "<sup>2</sup>/<sub>5</sub>↗"], "C": ["3飛び10枚", "5飛び10枚", "7飛び10枚"], "D": ["絽", "緞子", "摸紗織"], "E": ["たてパイル織物", "よこパイル織物", "ループパイル織物"], "F": ["筬", "通糸", "綜絖"], "G": ["レピア織機", "グリッパー織機", "シャットル織機"], "H": ["タペット式", "ドビー式", "ジャカード式"]}}, "q6": {"ins": "次の文中の［A］～［H］の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "紡績糸を引っ張ると、撚られた繊維に張力が発生し、法線力が生じることによって、糸を構成している繊維相互の[A]（1．曲げ　2．せん断　3．摩擦）力が増大する。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "布面で多方向に荷重が作用する場合の外力に対する抵抗を[B]（1．引張り　2．引裂き　3．破裂）強さという。", "keys": ["B"]}, {"lab": "Ⅲ", "text": "1錘のリング精紡に2本の繊維束（粗糸）を同時に供給し、1本の糸として加撚・巻き取る糸を[C]（1．サイロスパン糸　2．諸撚り糸　3．インターレース糸）という。", "keys": ["C"]}, {"lab": "Ⅳ", "text": "飾り糸は[D]（1．コンジュゲート糸　2．ファンシーヤーン　3．リングヤーン）とも呼ばれる。モール糸は芯糸と押さえ糸で保持された毛羽で覆われた糸であり[E]（1．スナールヤーン　2．スラブヤーン　3．シェニール糸）ともいう。", "keys": ["D", "E"]}, {"lab": "Ⅴ", "text": "クレープや縮緬では表面に凹凸を表すために、よこ糸に[F]（1．太さの異なる　2．撚り方向の異なる　3．糸むらの異なる）強撚糸を交互に配置する。", "keys": ["F"]}, {"lab": "Ⅵ", "text": "ひげ針での編成時に、ひげを抑える補助装置を[G]（1．スライダ　2．プレッサ　3．シンカ）という。", "keys": ["G"]}, {"lab": "Ⅶ", "text": "布を構成する繊維または糸が引っ掛かりにより生地の表面から突出する現象を[H]（1．摩耗　2．目ずれ　3．スナッグ）という。", "keys": ["H"]}], "opts": {"A": ["曲げ", "せん断", "摩擦"], "B": ["引張り", "引裂き", "破裂"], "C": ["サイロスパン糸", "諸撚り糸", "インターレース糸"], "D": ["コンジュゲート糸", "ファンシーヤーン", "リングヤーン"], "E": ["スナールヤーン", "スラブヤーン", "シェニール糸"], "F": ["太さの異なる", "撚り方向の異なる", "糸むらの異なる"], "G": ["スライダ", "プレッサ", "シンカ"], "H": ["摩耗", "目ずれ", "スナッグ"]}}, "q7": {"ins": "図中の［A］～［H］に入る最も代表的な名称を下記の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "［］", "html": false, "secs": [{"lab": "", "text": "{{fig:q4-7}}", "keys": ["A", "B", "C", "D", "E", "F", "G", "H"], "words": ["編目", "編成", "開き目", "表目", "裏目", "閉じ目", "ガイド", "フロント", "シリンダ", "ミス", "タック", "シンカ", "バック", "ニードル", "ダブル", "組目"]}], "opts": {}, "itemx": {"A": "［A］記号", "B": "［B］（四角の中にたて線）", "C": "［C］（四角の中に弧）", "D": "［D］ループ", "E": "［E］ループ", "F": "［F］記号", "G": "［G］（Y字形）", "H": "［H］（離れた横線とたて線）"}, "nolab": true, "wl": "［語群］"}, "q8": {"ins": "次のⅠ～Ⅱの文中（A）～（K）に、最も適切なものを語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "（ ）", "html": false, "secs": [{"lab": "Ⅰ", "text": "毛糸には[A]と[B]がある。[A]は繊維長の[C]原料を選別・仕分けして使用する。[B]は[A]の原料としては使えない繊維長の[D]原料を選んで使用するため毛羽が多い糸となる。\n　一方、絹糸には[E]と[F]などがある。[E]は繭から繊維を解じょし、数本集めて作られる。この工程を[G]という。[F]は養蚕時や[E]を作るときに出る[H]を原料とする。", "keys": ["A", "B", "C", "D", "E", "F", "G", "H"], "words": ["モノフィラメント糸", "紡毛糸", "生糸", "リネン糸", "紡糸", "梳毛糸", "副蚕糸", "絹紡糸", "サイロスパン糸", "複合糸", "製糸", "短い", "長い", "硬い", "落綿"]}, {"lab": "Ⅱ", "text": "2種類以上の繊維を混合した糸は、ステープル繊維同士を混合する[I]、フィラメント同士を混合する[J]、ステープルとフィラメントを混合する複合糸がある。複合糸には[K]などがある。", "keys": ["I", "J", "K"], "words": ["混紡糸", "モノフィラメント糸", "紡績糸", "マルチフィラメント糸", "混繊糸", "コアヤーン", "スラブヤーン", "コンジュゲート糸"]}], "opts": {}, "wl": "［語群］"}, "q9": {"ins": "次の文中［A］～［F］の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "水の熱伝導率は空気の[A]（1．約2倍　2．約10倍　3．約25倍）であり、布の保温性は含水すると低下する。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "手から布への瞬間の熱伝導現象は、接触温冷感と関係がある。手より布の温度が低い時は、[B]（1．布に含まれる水分の割合が少ないほど　2．密な組織ほど　3．毛羽が多いほど）冷たく感じる。", "keys": ["B"]}, {"lab": "Ⅲ", "text": "綿、アクリル、ナイロンの中で摩擦帯電列の最もプラス側に位置する繊維は[C]（1．綿　2．アクリル　3．ナイロン）である。", "keys": ["C"]}, {"lab": "Ⅳ", "text": "不織布の製造方法の一つであるメルトブロー法は[D]（1．紡糸直結法　2．湿式法　3．乾式法）に分類され、極細繊維による生産が可能である。", "keys": ["D"]}, {"lab": "Ⅴ", "text": "不織布の製造でウェブの繊維を高圧ジェット水流により絡みあわせる方法を[E]（1．スパンレース法　2．ニードルパンチ法　3．スルーエア法）という。", "keys": ["E"]}, {"lab": "Ⅵ", "text": "繊維束に撚りをかけるとき、下端を固定し上端を時計の針と同じ方向に回転すると[F]（1．仮撚り　2．Z撚り　3．S撚り）がかけられる。", "keys": ["F"]}], "opts": {"A": ["約2倍", "約10倍", "約25倍"], "B": ["布に含まれる水分の割合が少ないほど", "密な組織ほど", "毛羽が多いほど"], "C": ["綿", "アクリル", "ナイロン"], "D": ["紡糸直結法", "湿式法", "乾式法"], "E": ["スパンレース法", "ニードルパンチ法", "スルーエア法"], "F": ["仮撚り", "Z撚り", "S撚り"]}}, "q10": {"ins": "次の文中の［A］～［F］に最も関係が深いものを下記の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "", "html": true, "secs": [{"lab": "A．", "text": "太陽光に含まれる過度に当たると有害となる成分を遮断して、皮膚を保護する加工\n（1．UVカット加工　2．光触媒加工　3．遠赤外線加工）", "keys": ["A"]}, {"lab": "B．", "text": "食害を防ぐために、食毒性または接触毒性を有する薬剤を繊維に付与して防虫加工を行うが、この加工を最も必要とする繊維\n（1．綿　2．羊毛　3．アクリル）", "keys": ["B"]}, {"lab": "C．", "text": "繊維に付着する黄色ブドウ球菌の他に、肺炎かん菌などの菌の増殖を抑制する加工\n（1．制菌加工　2．防かび加工　3．消臭加工）", "keys": ["C"]}, {"lab": "D．", "text": "固体Aの表面に液体Bが接触した場合、AとBの界面では、Aの表面張力（臨界表面張力）をγ<sub>A</sub>、Bの表面張力をγ<sub>B</sub>としたときに、固体上で液体をはじくためのγ<sub>A</sub>とγ<sub>B</sub>の関係\n（1．γ<sub>A</sub>＝γ<sub>B</sub>　2．γ<sub>A</sub>＞γ<sub>B</sub>　3．γ<sub>A</sub>＜γ<sub>B</sub>）", "keys": ["D"]}, {"lab": "E．", "text": "コーティングによって生地に微多孔膜を形成させ、液体の水を衣服内部に侵入させず、また身体から放出される水蒸気を外部に排出する機能をもたせる加工\n（1．親水加工　2．透湿防水加工　3．吸湿発熱加工）", "keys": ["E"]}, {"lab": "F．", "text": "セルロース繊維を含む織物に樹脂加工剤（架橋剤）を含浸させ乾燥したのち、縫製後に熱処理を行って繊維内架橋を形成して形態を安定させる樹脂加工の手法\n（1．マイルドキュア法　2．プレキュア法　3．ポストキュア法）", "keys": ["F"]}], "opts": {"A": ["UVカット加工", "光触媒加工", "遠赤外線加工"], "B": ["綿", "羊毛", "アクリル"], "C": ["制菌加工", "防かび加工", "消臭加工"], "D": ["γ<sub>A</sub>＝γ<sub>B</sub>", "γ<sub>A</sub>＞γ<sub>B</sub>", "γ<sub>A</sub>＜γ<sub>B</sub>"], "E": ["親水加工", "透湿防水加工", "吸湿発熱加工"], "F": ["マイルドキュア法", "プレキュア法", "ポストキュア法"]}}, "q11": {"ins": "次の文中の［A］～［J］の後ろの（　）内に示す語句の中から、最も適当なものを選び、解答記入欄の数字をマークしなさい。", "type": "para", "bl": "［］", "html": false, "secs": [{"lab": "Ⅰ", "text": "各種の界面活性剤、シリコーンやポリエチレンの乳化物などを用いて生地を処理し、繊維間の摩擦抵抗を減少させる仕上げを[A]（1．サテン仕上げ　2．柔軟仕上げ　3．チンツ仕上げ）という。", "keys": ["A"]}, {"lab": "Ⅱ", "text": "生地に界面活性剤や吸湿性のある処理剤を付与することにより[B]（1．再生繊維　2．疎水性繊維　3．親水性繊維）の帯電を防止する。", "keys": ["B"]}, {"lab": "Ⅲ", "text": "一般にテンタを使用して、組織のゆがみを修正しながら所定の布幅に仕上げることを[C]（1．タンブリング仕上げ　2．ベロア仕上げ　3．幅出し）という。", "keys": ["C"]}, {"lab": "Ⅳ", "text": "毛羽を出す仕上げには、縮充で表面に出た毛羽を絡ませて表面を覆う[D]（1．ビーバー仕上げ　2．ミルド仕上げ　3．メルトン仕上げ）がある。", "keys": ["D"]}, {"lab": "Ⅴ", "text": "丸編地を織物と同様に平面状に仕上げることを開反仕上げというが、天竺などの編地は、切り開いた耳部分が巻きやすいので、耳部分に合成樹脂を塗布して耳巻きを防止することを[E]（1．ガミング　2．カーディング　3．ブランディング）という。", "keys": ["E"]}, {"lab": "Ⅵ", "text": "一般にセータなどのニット製品において、上着の袖や首回りの生地を、目を拾って接続する方法を[F]（1．ミキシング　2．リンキング　3．バインディング）という。", "keys": ["F"]}, {"lab": "Ⅶ", "text": "カレンダ加工のうち、金属ローラの回転を速くし弾性ローラとの周速の差を大きくして、生地表面との間に生じる摩擦により金属のような光沢を与える加工を[G]（1．ローリングカレンダ　2．シュライナカレンダ　3．フリクションカレンダ）加工という。", "keys": ["G"]}, {"lab": "Ⅷ", "text": "羊毛がアニオン化した金属錯塩を吸収する性質を利用し、ジルコニウムやチタンの錯塩を吸着させることにより耐熱性を高める防炎加工を[H]（1．ザプロ加工　2．シロセット加工　3．サンフォライズ加工）という。", "keys": ["H"]}, {"lab": "Ⅸ", "text": "繊維表面を溶解除去し、織物等の風合いを改良する（やわらかくする）加工を減量加工というが、薬剤にアルカリを使う減量加工で対象とする繊維は[I]（1．ポリエステル　2．ポリエチレン　3．レーヨン）である。", "keys": ["I"]}, {"lab": "Ⅹ", "text": "羊毛を染色するには[J]（1．直接　2．酸性　3．硫化）染料が適している。", "keys": ["J"]}], "opts": {"A": ["サテン仕上げ", "柔軟仕上げ", "チンツ仕上げ"], "B": ["再生繊維", "疎水性繊維", "親水性繊維"], "C": ["タンブリング仕上げ", "ベロア仕上げ", "幅出し"], "D": ["ビーバー仕上げ", "ミルド仕上げ", "メルトン仕上げ"], "E": ["ガミング", "カーディング", "ブランディング"], "F": ["ミキシング", "リンキング", "バインディング"], "G": ["ローリングカレンダ", "シュライナカレンダ", "フリクションカレンダ"], "H": ["ザプロ加工", "シロセット加工", "サンフォライズ加工"], "I": ["ポリエステル", "ポリエチレン", "レーヨン"], "J": ["直接", "酸性", "硫化"]}}, "q12": {"ins": "次のⅠ～Ⅲの文中（A）～（I）に、もっとも適当なものを各々の語群の中から選び、解答記入欄の数字をマークしなさい。", "type": "shared", "bl": "（ ）", "html": true, "secs": [{"lab": "Ⅰ", "text": "セルロース繊維からなる染色物の[A]堅ろう度を増進させるためのフィックス剤は、染料と結合して水に不溶の錯体を生成する[B]性の有機化合物や、これに銅などの金属塩を配合したものが用いられる。これらは、直接染料や反応染料で染めたセルロース繊維に対する[A]堅ろう度の向上を目的としているが、[C]堅ろう度は低くなることがある。一方、ナイロンの場合は、タンニン酸／吐酒石または合成タンニンなどの[D]化合物で後処理する。", "keys": ["A", "B", "C", "D"], "words": ["湿潤", "フェノール系", "アゾ系", "耐光", "摩擦", "アニオン", "カチオン", "酸"]}, {"lab": "Ⅱ", "text": "色見本と同じ色（これを等色という）になるまで、試験染色を繰り返す作業を[E]という。色を計測する測色機や色合せ計算がコンピュータ化された、コンピュータ[E]のシステムは、染色試験室の自動化の主役である。過去の染色処方をデータベースとして蓄積し、色見本に近似する過去に染めた色を、既存データから検索する、いわゆる色検索は、コンピュータ[F]とも呼ばれ色合せの合理化につながっている。", "keys": ["E", "F"], "words": ["カラーアソート", "カラーマッチング", "カラーフィッティング", "カラーサーチング"]}, {"lab": "Ⅲ", "text": "光を混ぜると[G]混合的に明るい色になる。色材を混ぜると[H]混合的に暗くなる。物体色を表示する方法には、色の3属性によって体系的に並べられた[I]がある。", "keys": ["G", "H", "I"], "words": ["乗算", "減算", "加算", "除算", "L<sup>*</sup>a<sup>*</sup>b<sup>*</sup>表色系", "XYZ表色系", "マンセル表色系"]}], "opts": {}, "wl": "［語群］"}};

function verdict(q,it){
  const ch = state[keyOf(q,it.k)];
  if(ch==null) return '';
  return ch===it.a ? '<span class="verdict ok">正解</span>' : `<span class="verdict ng">不正解（あなたの解答：${ch}）</span>`;
}
function exHTML(q,it,optText){
  const key=keyOf(q,it.k); if(state[key]==null && !revealAll) return '';
  if(q.type==='tf'){
    const mk=v=>v[0]?'<span class="m o">○</span>':'<span class="m x">×</span>';
    return `<div class="ex">${verdict(q,it)} <b>正解 ${it.a}</b>（${TF[it.a-1]}）
      <div class="sv">${mk(it.v1)}<span>① ${esc(it.v1[1])}</span>${mk(it.v2)}<span>② ${esc(it.v2[1])}</span></div>
      <span class="ref">テキスト ${refHTML(it.r)}</span>${redoHTML(key)}</div>`;
  }
  return `<div class="ex">${verdict(q,it)} <b>正解 ${it.a}　${rich(optText)}</b><p>${esc(it.w)}</p><span class="ref">テキスト ${refHTML(it.r)}</span>${redoHTML(key)}</div>`;
}
function redoHTML(key){ return state[key]!=null ? `<button type="button" class="redo" data-key="${key}">この問題をやり直す</button>` : ''; }

function rich(t){ return esc(t).replace(/&lt;(\/?)(sub|sup|tr|th|td)( colspan=&quot;\d&quot;)?&gt;/g,(m,a,b,c)=>'<'+a+b+(c?c.replace(/&quot;/g,'"'):'')+'>').replace(/&lt;table class=&quot;otbl&quot;&gt;/g,'<table class="otbl">').replace(/&lt;\/table&gt;/g,'</table>').replace(/\n/g,'<br>').replace(/\{\{fig:([\w-]+)\}\}/g,(m,k)=>FIGS[k]||''); }
function mark(o,k){ return o.bl==='［］'?`［${k}］`:o.bl==='[]'?`[${k}]`:o.bl==='（ ）'?`（　${k}　）`:k; }
function oblanks(o,text,filled,s0){
  return rich(text).replace(/\[([A-L])\]/g,(m0,k)=>{
    const v=s0[k]; const cls=v==null?'':(v?' ok':' ng');
    return `<span class="oblank${cls}">${mark(o,k)}</span>`+(filled[k]?`<span class="fillw">${rich(filled[k])}</span>`:'');
  });
}
const actSel = {}, secView = {};
function sharedSec(q,o,sc,si,byK,st,lab){
  const sid=q.id+'-s'+si, done=k=>state[keyOf(q,k)]!=null;
  let act = actSel[sid] && sc.keys.includes(actSel[sid]) && !done(actSel[sid]) ? actSel[sid] : sc.keys.find(k=>!done(k));
  if(revealAll) act=null;
  let view = secView[sid] && sc.keys.includes(secView[sid]) && done(secView[sid]) ? secView[sid] : null;
  const vc = view? state[keyOf(q,view)] : null, va = view? byK[view].a : null;
  const s0={}, filled={}; sc.keys.forEach(k=>{ s0[k]=st(k); if(s0[k]!=null){ const c=state[keyOf(q,k)]; filled[k]=sc.words[(c==null?byK[k].a:c)-1]; } });
  const blankH=k=>{ const v=s0[k]; const cls=(v==null?'':(v?' ok':' ng'))+(k===act?' act':''); const tap=revealAll?'':(!done(k)?` data-act="${k}" data-sec="${sid}" role="button" tabindex="0"`:` data-view="${k}" data-sec="${sid}" role="button" tabindex="0"`);
    return `<span class="oblank${cls}${k===view?' viewing':''}"${tap}>${mark(o,k)}</span>`+(filled[k]?`<span class="fillw${s0[k]?'':' ng'}">${rich(filled[k])}</span>`:''); };
  let text='';
  if(sc.text) text=`<div class="stem otext">${lab(sc.lab)}${rich(sc.text).replace(/\[([A-L])\]/g,(m,k)=>blankH(k))}</div>`;
  else if(sc.lab) text=`<div class="sec-label">${lab(sc.lab)}</div>`;
  if(o.itemx){
    text+=`<div class="orows">`+sc.keys.map(k=>{ const v=s0[k]; const tap=revealAll?'':(!done(k)?` data-act="${k}" data-sec="${sid}" role="button" tabindex="0"`:` data-view="${k}" data-sec="${sid}" role="button" tabindex="0"`);
      const badge=filled[k]?` <span class="fillw${v?'':' ng'}">${rich(filled[k])}</span>`:'';
      return `<div class="orow${k===act?' act':''}${k===view?' viewing':''}${v==null?'':(v?' ok':' ng')}"${tap}>${o.nolab?'':`<span class="lab">${k}．</span>`}<span>${rich(o.itemx[k])}${badge}</span></div>`; }).join('')+`</div>`;
  }
  const vlab = view ? (o.itemx?(o.nolab?rich(o.itemx[view]):view):mark(o,view)) : '';
  const vres = view ? `<div class="pickres ${vc===va?'ok':'ng'}">${vlab}：${vc===va?'正解':'不正解（正解は '+va+'．'+rich(sc.words[va-1])+'）'}</div>` : '';
  const hint = vres + (act ? `<div class="pickhint">${o.itemx?(o.nolab?rich(o.itemx[act]):act+'．'):mark(o,act)} の答えを${o.wl?'語群':'下'}からタップ</div>` : '');
  const words = (o.wl?`<div class="wlab">${esc(o.wl)}</div>`:'')+`<ul class="words pick">`+sc.words.map((w,i)=>
    `<li><button type="button" class="chip wpick${view&&i+1===va?' right':''}${view&&i+1===vc&&vc!==va?' wrong':''}" ${act?`data-key="${keyOf(q,act)}" data-n="${i+1}" data-sec="${sid}"`:'disabled'}><b>${i+1}．</b>${rich(w)}</button></li>`).join('')+`</ul>`;
  const exs = sc.keys.filter(k=>done(k)||revealAll).map(k=>{const it=byK[k];
    return `<div class="item"><div class="item-text"><span class="lab">${o.itemx&&!o.nolab?k+'．':(o.itemx?rich(o.itemx[k]):mark(o,k))}</span></div>${exHTML(q,it,sc.words[it.a-1])}</div>`;}).join('');
  return `<div class="sec" data-secid="${sid}"><div class="stem-wrap${o.itemx?' nostick':''}">${text}${hint}${words}</div>${exs}</div>`;
}
function origBody(q){
  const o=q.orig, byK={}; itemsOf(q).forEach(it=>byK[it.k]=it);
  const st=k=>{const c=state[keyOf(q,k)], it=byK[k]; if(c==null&&!revealAll) return null; return c==null?true:c===it.a;};
  const lab=l=>l?`<span class="roman">${esc(l)}${/[．.]$/.test(l)?'':'．'}</span>`:'';
  if(o.type==='tf'){
    return Object.keys(o.tf).map(k=>{const it=byK[k],[a,b]=o.tf[k];
      return `<div class="item"><div class="stmts"><div class="stmt"><span class="lab">${k}．</span><span>①${rich(a)}</span></div><div class="stmt"><span></span><span>②${rich(b)}</span></div></div>${chipHTML(q,it,TF,false)}${exHTML(q,it)}</div>`;}).join('');
  }
  return o.secs.map((sc,si)=>{
    if(o.type==='shared') return sharedSec(q,o,sc,si,byK,st,lab);
    const filled={}, s0={};
    sc.keys.forEach(k=>{ s0[k]=st(k); if(o.type==='shared' && s0[k]!=null) filled[k]=sc.words[byK[k].a-1]; });
    const words = sc.words? (o.wl?`<div class="wlab">${esc(o.wl)}</div>`:'')+`<ul class="words">${sc.words.map((w,i)=>`<li><b>${i+1}．</b>${rich(w)}</li>`).join('')}</ul>`:'';
    const text = sc.text? `<div class="stem otext">${lab(sc.lab)}${oblanks(o,sc.text,filled,s0)}</div>` : (sc.lab?`<div class="sec-label">${lab(sc.lab)}</div>`:'');
    const sticky = o.type==='shared' || sc.keys.length>1;
    const itemsH = sc.keys.map(k=>{
      const it=byK[k], opts = o.type==='shared'? sc.words : o.opts[k];
      let head='';
      if(o.itemx) head = `<div class="item-text">${o.nolab?'':`<span class="lab">${k}．</span>`}${rich(o.itemx[k])}</div>`;
      else if(/\[[A-L]\]/.test(sc.text)) head = `<div class="item-text"><span class="lab">${mark(o,k)}</span></div>`;
      return `<div class="item">${head}${chipHTML(q,it,opts,false)}${exHTML(q,it,opts[it.a-1])}</div>`;
    }).join('');
    return sticky ? `<div class="sec"><div class="stem-wrap">${text}${words}</div>${itemsH}</div>` : `<div class="sec">${text}${words}${itemsH}</div>`;
  }).join('');
}

function render(){
  const main=document.getElementById('main');
  main.innerHTML = Q.map(q=>{
    let body='';
    if(q.orig){ body = origBody(q); }
    else if(q.type==='shared'){
      body = q.sections.map(s=>{
        const filled={}; s.items.forEach(it=>{ if(state[keyOf(q,it.k)]!=null||revealAll) filled[it.k]=s.words[it.a-1]; });
        const head = s.stem ? `<div class="stem">${s.roman?`<span class="roman">${s.roman}.</span>`:''}${blanks(s.stem,filled)}</div>` : (s.roman?`<div class="sec-label">${s.roman}.</div>`:'');
        return `<div class="sec"><div class="stem-wrap">${head}
          <ul class="words">${s.words.map((w,i)=>`<li><b>${i+1}</b>${esc(w)}</li>`).join('')}</ul></div>`+
          s.items.map(it=>`<div class="item"><div class="item-text"><span class="lab">${it.x?it.k+'.':'（'+it.k+'）'}</span>${it.x?esc(it.x):''}</div>${chipHTML(q,it,s.words,true)}${exHTML(q,it,s.words[it.a-1])}</div>`).join('')+'</div>';
      }).join('');
    } else if(q.type==='tf'){
      body = `<p class="tf-key">1：①②とも正しい　2：①正 ②誤　3：①誤 ②正　4：①②とも誤り</p>`+
        q.items.map(it=>`<div class="item"><div class="stmts"><div class="stmt"><span class="lab">${it.k}.</span><span><span class="n">①</span> ${esc(it.s1)}</span></div><div class="stmt"><span></span><span><span class="n">②</span> ${esc(it.s2)}</span></div></div>${chipHTML(q,it,TF,false)}${exHTML(q,it)}</div>`).join('');
    } else {
      body = q.items.map(it=>{
        const filled={}; if(state[keyOf(q,it.k)]!=null||revealAll) filled[it.k]=it.o[it.a-1];
        const txt = it.x.includes('[')? blanks(it.x,filled) : `<span class="lab">${it.k}.</span>${esc(it.x)}`;
        return `<div class="item"><p class="item-text">${it.x.includes('[')?'':''}${txt}</p>${chipHTML(q,it,it.o,false)}${exHTML(q,it,it.o[it.a-1])}</div>`;
      }).join('');
    }
    const items = q.sections? q.sections.flatMap(s=>s.items): q.items;
    const done = items.filter(it=>state[keyOf(q,it.k)]!=null).length;
    const ok = items.filter(it=>state[keyOf(q,it.k)]===it.a).length;
    return `<section class="q" id="${q.id}"><div class="q-head"><h2>${q.t}</h2><span class="topic">${esc(q.topic)}</span>${q.star?'<span class="star">学びのポイント</span>':''}<span class="prog">${ok}/${done} 正解 ・ 全${items.length}問</span>${done?`<button type="button" class="qreset${qArmed===q.id?' armed':''}" data-q="${q.id}">${qArmed===q.id?'もう一度押すと'+q.t+'を消去':q.t+'をやり直す'}</button>`:''}</div>${q.orig?`<p class="ins">${esc(q.orig.ins)}</p>`:''}${body}</section>`;
  }).join('');
  // nav + score
  let done=0, ok=0;
  document.getElementById('nav').innerHTML = Q.map(q=>{
    const items = q.sections? q.sections.flatMap(s=>s.items): q.items;
    const d = items.every(it=>state[keyOf(q,it.k)]!=null);
    items.forEach(it=>{const c=state[keyOf(q,it.k)]; if(c!=null){done++; if(c===it.a) ok++;}});
    return `<a href="#${q.id}" class="${d?'done':''}">${q.t.replace('問','')}</a>`;
  }).join('');
  document.getElementById('score').innerHTML = `${SETS[cur].no}得点 <b class="pt-big">${done?Math.round(ok/done*100):0}</b>点<span class="sc-sub">（${ok}/${done}問正解）</span>`;
  const total = Q.reduce((n,q)=>n+itemsOf(q).length,0);
  const av = avgScore();
  document.getElementById('sets').innerHTML = SETS.map((s,i)=>{const sc=setScore(i); return `<button type="button" class="set-tab" role="tab" data-set="${i}" aria-selected="${i===cur}"><span class="tl">練習問題</span>${s.no}<span class="st">${sc.score==null?'未解答':sc.score+'点'}</span></button>`;}).join('') + `<span class="avg">平均 <b>${av==null?'—':av}</b>${av==null?'':'点'}</span>`;
  const setRows = SETS.map((s,i)=>{const sc=setScore(i); return `<tr class="${i===cur?'cur':''}"><th>${s.name}</th><td class="num">${sc.done?sc.ok+' / '+sc.done+'問正解':'未解答'}<br><small>${sc.done+' / '+sc.total+'問解答'}</small></td><td class="num">${sc.score==null?'—':sc.score+'点'}</td></tr>`;}).join('');
  const counted = SETS.filter((s,i)=>setScore(i).score!=null).map(s=>s.no).join('・');
  const rows = Q.map(q=>{const its=itemsOf(q); const o=its.filter(it=>state[keyOf(q,it.k)]===it.a).length; const dn=its.filter(it=>state[keyOf(q,it.k)]!=null).length; return `<tr><th><a href="#${q.id}">${q.t}</a></th><td class="topic">${esc(q.topic)}</td><td class="num${dn&&o===dn?' full':''}">${dn?o+' / '+dn+'問正解':'未解答'}</td><td class="num">${dn?Math.round(o/dn*100)+'点':'—'}</td></tr>`;}).join('');
  const ptRows = SETS.map((s,i)=>{const sc=pointScore(i); return `<tr class="${i===cur?'cur':''}"><th>${s.name}</th><td class="num">${sc.done?sc.ok+' / '+sc.done+'問正解':'未解答'}<br><small>${sc.done+' / '+sc.total+'問解答'}</small></td><td class="num">${sc.score==null?'—':sc.score+'点'}</td></tr>`;}).join('');
  const ptSc = SETS.map((s,i)=>pointScore(i).score).filter(x=>x!=null);
  const ptAv = ptSc.length ? Math.round(ptSc.reduce((a,b)=>a+b,0)/ptSc.length) : null;
  const ptQ = SETS[cur].points.map(([qid,label])=>{const q=Q.find(x=>x.id===qid); const its=itemsOf(q); const o=its.filter(it=>state[keyOf(q,it.k)]===it.a).length; const dn=its.filter(it=>state[keyOf(q,it.k)]!=null).length; return `<tr><th><a href="#${q.id}">${esc(label)}</a></th><td class="num${dn&&o===dn?' full':''}">${dn?o+' / '+dn+'問正解':'未解答'}</td><td class="num">${dn?Math.round(o/dn*100)+'点':'—'}</td></tr>`;}).join('');
  const ptHTML = `<h3 class="pt-h">学びのポイントだけの得点</h3><p class="rmeta">「学びのポイント」の印が付いた大問だけで、解いた問題を100点満点に換算しています。</p><div class="tbl sets-tbl"><table><tbody>${ptRows}<tr class="avg-row"><th>平均</th><td class="num"></td><td class="num">${ptAv==null?'—':ptAv+'点'}</td></tr></tbody></table></div><h3>${SETS[cur].name}の学びのポイント</h3><div class="tbl pt-q"><table><tbody>${ptQ}</tbody></table></div>`;
  document.getElementById('result').innerHTML = `<h2>現在の得点</h2><div class="big"><b>${av==null?'—':av}</b><span>${av==null?'':'点'}（平均）</span></div><p class="rmeta">${av==null?'まだ解答がありません。':'解答した問題集（'+counted+'）の得点の平均です。'}各問題集の得点は、解いた問題だけで100点満点に換算しています。</p><div class="tbl sets-tbl"><table><tbody>${setRows}<tr class="avg-row"><th>平均</th><td class="num"></td><td class="num">${av==null?'—':av+'点'}</td></tr></tbody></table></div>${ptHTML}<h3>${SETS[cur].name}の問題別（全${total}問中 ${done}問解答・${ok}問正解）</h3><div class="tbl"><table><tbody>${rows}</tbody></table></div>`;
  const rb=document.getElementById('revealAll'); rb.textContent = revealAll ? '元に戻す' : '解答をすべて表示'; rb.classList.toggle('primary',!revealAll); rb.classList.toggle('back',revealAll); rb.setAttribute('aria-pressed',String(revealAll));
  document.getElementById('revealNote').hidden = !revealAll;
  if(!resetArmed) document.getElementById('reset').textContent = SETS[cur].no+'をリセット';
  document.getElementById('saveNote').textContent = canSave ? '押した解答は問題集ごとにこの端末のブラウザに自動で保存され、次に開いたときも続きから解けます（リセットは表示中の問題集だけを消去）。' : 'この環境では解答を保存できません。ページを閉じると解答は消えます。';
}

function keepPos(el, sel, fn){
  const y = el.getBoundingClientRect().top; fn();
  const n = document.querySelector(sel); if(n){ window.scrollBy(0, n.getBoundingClientRect().top - y); }
}
document.getElementById('main').addEventListener('click',e=>{
  const qb=e.target.closest('button.qreset');
  if(qb){
    const id=qb.dataset.q, q=Q.find(x=>x.id===id); if(!q) return;
    if(qArmed!==id){
      clearTimeout(qTimer); qArmed=id;
      qTimer=setTimeout(()=>{ qArmed=null; keepPos(document.getElementById(id), '#'+id, render); },3000);
      keepPos(qb, '#'+id+' button.qreset', render); return;
    }
    clearTimeout(qTimer); qArmed=null;
    trackRedo(q,null);
    itemsOf(q).forEach(it=>{ delete state[keyOf(q,it.k)]; }); save();
    keepPos(document.getElementById(id), '#'+id, render); return;
  }
  const rb=e.target.closest('button.redo');
  if(rb){
    const key=rb.dataset.key;
    { const [qid,k]=key.split('-'); const q=Q.find(x=>x.id===qid); const it=q&&itemsOf(q).find(x=>x.k===k); if(it) trackRedo(q,it); }
    delete state[key]; save();
    const sel=`button.chip[data-key="${key}"]`; keepPos(document.querySelector(sel)||rb, sel, render); return;
  }
  const vw=e.target.closest('[data-view]');
  if(vw){ secView[vw.dataset.sec]=vw.dataset.view; render(); return; }
  const as=e.target.closest('[data-act]');
  if(as){ actSel[as.dataset.sec]=as.dataset.act; const y=as.getBoundingClientRect().top; render(); const n=document.querySelector(`[data-secid="${as.dataset.sec}"]`); return; }
  const b=e.target.closest('button.chip'); if(!b||b.disabled) return;
  state[b.dataset.key]=Number(b.dataset.n);
  if(b.dataset.sec) secView[b.dataset.sec]=b.dataset.key.split('-')[1];
  { const [qid,k]=b.dataset.key.split('-'); const q=Q.find(x=>x.id===qid); const it=q&&itemsOf(q).find(x=>x.k===k); if(it) trackAnswer(q,it,Number(b.dataset.n)); }
  save();
  const y=b.getBoundingClientRect().top;
  render();
  const nb=document.querySelector(`button.chip[data-key="${b.dataset.key}"]`);
  if(nb){ window.scrollBy(0, nb.getBoundingClientRect().top - y); }
  else if(b.dataset.sec){ const sb=document.querySelector(`button.wpick[data-sec="${b.dataset.sec}"][data-n="${b.dataset.n}"]`); if(sb) window.scrollBy(0, sb.getBoundingClientRect().top - y); }
});
document.getElementById('revealAll').addEventListener('click',()=>{revealAll=!revealAll;render();});
document.getElementById('reset').addEventListener('click',e=>{
  if(!resetArmed){ e.currentTarget.textContent='もう一度押すと'+SETS[cur].no+'を消去'; resetArmed=setTimeout(()=>{resetArmed=null; render();},3000); return; }
  clearTimeout(resetArmed); resetArmed=null;
  trackRedo(null,null);
  for(const k in state) delete state[k]; revealAll=false;
  if(canSave){ try{ localStorage.removeItem(SETS[cur].skey); }catch(err){} }
  render();
});
document.getElementById('sets').addEventListener('click',e=>{const b=e.target.closest('.set-tab'); if(b) switchSet(Number(b.dataset.set));});
header();
render();
function setBarH(){const b=document.querySelector('.bar');if(b)document.documentElement.style.setProperty('--barH',b.offsetHeight+'px');}
setBarH();window.addEventListener('resize',setBarH);
</script>
